                        arr.forEach(e => { e.primary = (e === primary); });
                        byBook[bk] = arr.slice().sort((a, b) => a.line - b.line);
                    });
                }));
            };

            // Real windows for one player from their parsed game log.
            const nflComputeWindows = (glRows, posKeys, lineFor, oppAbbr) => {
                const statsByKey = {}, gameLogByKey = {};
                const mean = (arr) => arr.length ? round1(arr.reduce((s, v) => s + v, 0) / arr.length) : null;
                posKeys.forEach(k => {
                    const getV = NFL_PROP_DEFS[k].get;
                    const vals = glRows.map(g => getV(g.row) || 0);
                    const line = lineFor[k] != null ? lineFor[k] : (mean(vals) || 0);
                    const rate = (a) => a.length ? Math.round((a.filter(v => v > line).length / a.length) * 100) : null;
                    const lastN = (n) => vals.slice(-n);
                    const sorted = [...vals].sort((a, b) => a - b);
                    const oppVals = glRows.filter(g => g.opponent === oppAbbr).map(g => getV(g.row) || 0);
                    statsByKey[k] = {
                        last5: { avg: mean(lastN(5)), hitRate: rate(lastN(5)), games: Math.min(5, vals.length) },
                        last10: { avg: mean(lastN(10)), hitRate: rate(lastN(10)), games: Math.min(10, vals.length) },
                        last20: { avg: mean(lastN(20)), hitRate: rate(lastN(20)), games: Math.min(20, vals.length) },
                        season: { avg: mean(vals), hitRate: rate(vals), games: vals.length },
                        vsOpp: oppVals.length ? { avg: mean(oppVals), hitRate: rate(oppVals), games: oppVals.length } : { avg: mean(vals), hitRate: rate(vals), games: 0 },
                        recent: { avg: mean(lastN(5)), hitRate: rate(lastN(5)), median: sorted[sorted.length >> 1] || 0, range: [sorted[0] || 0, sorted[sorted.length - 1] || 0], games: vals.length }
                    };
                    gameLogByKey[k] = glRows.slice(-40).map(g => ({ date: g.date, dateShort: g.dateShort, opponent: g.opponent, vsLabel: g.vsLabel, points: getV(g.row) || 0, line }));
                });
                return { statsByKey, gameLogByKey };
            };

            // Build a player's props for ONE book from their consolidated lines.
            const nflBuildProps = (posKeys, statsByKey, allLines, book, perGameFor) => {
                const props = [];
                const seedK = (k, line) => { if (!statsByKey[k]) statsByKey[k] = nflSeedWindows(perGameFor(k, line), line); return statsByKey[k]; };
                const pushLine = (k, def, e, extraIn) => {
                    const { _stdLine, ...extra } = extraIn;
                    const w = seedK(k, e.line);
                    const oHR = estHitRate(w.season.avg || w.recent.avg || e.line, e.line);
                    const base = { type: def.type, statKey: k, line: e.line, ...extra };
                    // Goblin / Demon = "More"-only picks on PrizePicks/Underdog.
                    if (DFS_PLATFORMS.has(extra.book) && (e.ppType === 'goblin' || e.ppType === 'demon')) {
                        props.push({ ...base, direction: 'over', oneWay: true, ppKind: e.ppType, odds: extra.odds ?? -110, oppOdds: null, hitRate: oHR });
                        return;
                    }
                    const hasO = e.over != null, hasU = e.under != null;
                    if (hasO && hasU) {
                        props.push({ ...base, direction: 'over', odds: extra.odds ?? -110, oppOdds: extra.oppOdds ?? -110, hitRate: oHR });
                        props.push({ ...base, direction: 'under', odds: extra.oppOdds ?? -110, oppOdds: extra.odds ?? -110, hitRate: Math.max(2, 100 - oHR) });
                        return;
                    }
                    const side = hasO ? 'over' : 'under'; // one-way sportsbook rung
                    props.push({
                        ...base, direction: side, oneWay: true, ppKind: null,
                        odds: (side === 'over' ? extra.odds : extra.oppOdds) ?? -110, oppOdds: null,
                        hitRate: side === 'over' ? oHR : Math.max(2, 100 - oHR)
                    });
                };
                const bookOrder = [book, ...PROPLINE_BOOK_PRIORITY.filter(b => b !== book)];
                posKeys.forEach(k => {
                    const def = NFL_PROP_DEFS[k];
                    const byBook = allLines[k] || {};
                    const useBook = bookOrder.find(b => byBook[b] && byBook[b].length);
                    if (!useBook) return;
                    const crossBook = useBook !== book; // selected book has no line; showing another's
                    // Drop obvious bad data — e.g. a niche book listing a WR's
                    // "rush yards" at 43.5 when he averages ~1.
                    const pg = perGameFor(k);
                    const w = statsByKey[k];
                    if (w && (w.season.games || 0) >= 4) {
                        const primaryLine = ((byBook[useBook].find(e => e.primary)) || byBook[useBook][0] || {}).line || 0;
                        const hi = (w.recent && w.recent.range && w.recent.range[1]) || pg;
                        if (primaryLine > pg * 6 + 8 || primaryLine > hi * 2 + 8) return;
                    }
                    let arr = byBook[useBook];
                    // A sportsbook fallback carries an extreme-odds alt ladder
                    // ("150+ pass yds -1300") — only surface its main number.
                    if (crossBook) { const pr = arr.find(e => e.primary) || arr.slice().sort((a, c) => a.juice - c.juice)[0]; arr = pr ? [pr] : []; }
                    const sorted = arr.slice().sort((a, c) => (c.primary ? 1 : 0) - (a.primary ? 1 : 0) || a.line - c.line);
                    const multi = sorted.length > 1;
                    const stdLine = (sorted.find(e => e.over != null && e.under != null) || {}).line;
                    sorted.forEach(e => pushLine(k, def, e, {
                        lineSource: crossBook ? `${useBook} line — not posted on ${book}` : `${e._src === 'parlayapi' ? 'ParlayAPI' : 'PropLine'} · ${useBook}`,
                        book: useBook, crossBook, setAt: e.setAt, move: e.move,
                        altLine: multi && !e.primary, odds: e.over, oppOdds: e.under, _stdLine: stdLine
                    }));
                });
                return props;
            };

            const fetchNflSlate = async (date) => {
                const ymd = String(date).replace(/-/g, '');
                let sb;
                try { sb = await nflFetch(`${NFL_ESPN}/scoreboard?dates=${ymd}`); } catch (e) { sb = {}; }
                let events = (sb && sb.events) || [];
                if (!events.length) {
                    try { const sb2 = await nflFetch(`${NFL_ESPN}/scoreboard`); events = (sb2 && sb2.events) || []; } catch (e) { /* */ }
                }
                if (!events.length) return { slots: [], games: [] };

                const teamMeta = {}, games = [];
                events.forEach(e => {
                    const c = (e.competitions || [])[0]; if (!c) return;
                    const home = (c.competitors || []).find(x => x.homeAway === 'home');
                    const away = (c.competitors || []).find(x => x.homeAway === 'away');
                    if (!home || !away) return;
                    teamMeta[home.team.id] = { abbr: home.team.abbreviation, name: home.team.displayName };
                    teamMeta[away.team.id] = { abbr: away.team.abbreviation, name: away.team.displayName };
                    const when = new Date(e.date);
                    const st = e.status && e.status.type;
                    games.push({
                        gameId: e.id, homeId: home.team.id, awayId: away.team.id,
                        iso: e.date, kickoffMs: Date.parse(e.date || ''),
                        status: st && st.name, state: st && st.state,
                        gameTime: when.toLocaleString([], { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })
                            + (st && st.state === 'post' ? ' · Final' : (st && st.state === 'in' ? ' · Live' : ''))
                    });
                });

                // Team defense: points allowed / game, ranked 1 (stingiest) - 32.
                // One keyless call; feeds the NFL matchup factor + projection.
                const defByTeam = {};
                try {
                    for (const yr of [NFL_SEASON, NFL_SEASON - 1]) {
                        const st = await nflFetch(`https://site.api.espn.com/apis/v2/sports/football/nfl/standings?season=${yr}`);
                        const ent = [];
                        (function dig(o) { if (!o || typeof o !== 'object') return; if (Array.isArray(o.entries)) ent.push(...o.entries); for (const k in o) dig(o[k]); })(st);
                        if (!ent.length) continue;
                        const rows = ent.map(e => {
                            const g = (e.stats || []).find(s => s.name === 'gamesPlayed') || {};
                            const pa = (e.stats || []).find(s => s.name === 'pointsAgainst' || s.name === 'avgPointsAgainst') || {};
                            const gp = parseFloat(g.value) || 17;
                            const paVal = parseFloat(pa.value) || 0;
                            const perGame = pa.name === 'avgPointsAgainst' ? paVal : (paVal / gp);

                    const nm = nflNormName((idMeta[pid] || {}).name);
                    return nm ? byNorm[nm] || null : null;
                };
                const matched = Object.keys(linesById).map(pid => ({ pid, slot: resolveSlot(pid) })).filter(x => x.slot);
                if (!matched.length) { setPropLineSource('sample'); setProplineError('PropLine returned CFB lines but none matched the roster scan.'); return []; }

                const glMap = await cfbGamelogs(matched.map(x => x.slot.id));
                const wantBook = PLATFORM_BOOK[selectedPlatform] || 'prizepicks';
                const SNAP_KEY = 'beatsedge_cfb_lines_v1';
                let snap = {}; try { snap = JSON.parse(localStorage.getItem(SNAP_KEY) || '{}'); } catch (e) { }
                const nextSnap = {}, now = Date.now();

                const built = [];
                const seenPlayer = new Set();
                matched.forEach(({ pid, slot }) => {
                    if (seenPlayer.has(slot.id)) return;
                    seenPlayer.add(slot.id);
                    const lines = linesById[pid];
                    const posKeys = nflPosKeys(slot.pos).filter(k => lines[k]);
                    if (!posKeys.length) return;
                    const glRows = glMap[slot.id] || [];
                    const lineFor = {};
                    Object.keys(lines).forEach(k => {
                        const arr = (lines[k][wantBook]) || [];
                        const pr = arr.find(e => e.primary) || arr[0];
                        if (pr) lineFor[k] = pr.line;
                    });
                    Object.keys(lines).forEach(k => {
                        const arr = (lines[k][wantBook]) || [];
                        const pr = arr.find(e => e.primary) || arr[0];
                        if (!pr) return;
                        const id = `${slot.id}:${k}:${wantBook}`;
                        nextSnap[id] = { line: pr.line, ts: now };
                        const prev = snap[id];
                        if (prev && typeof prev.line === 'number' && prev.line !== pr.line) {
                            pr.move = { from: prev.line, to: pr.line, delta: Math.round((pr.line - prev.line) * 10) / 10, sinceTs: prev.ts };
                        }
                    });
                    const { statsByKey, gameLogByKey } = glRows.length
                        ? nflComputeWindows(glRows, nflPosKeys(slot.pos), lineFor, slot.opponent)
                        : { statsByKey: {}, gameLogByKey: {} };
                    const perGameFor = (k) => { const w = statsByKey[k]; return (w && (w.season.avg || w.recent.avg)) || 0; };
                    let props = nflBuildProps(posKeys, statsByKey, lines, wantBook, perGameFor);
                    const player = {
                        id: slot.id, name: slot.name, sport: 'ncaaf', role: 'skill',
                        position: slot.pos, team: slot.team, opponent: slot.opponent,
                        teamId: slot.teamId, oppTeamId: slot.oppTeamId, gamePk: slot.gamePk,
                        oppDef: null, gameTime: slot.gameTime, headshot: slot.headshot, status: 'ACTIVE',
                        statsByKey, gameLogByKey, stats: {}, gameLog: [],
                        _allLines: lines, _isCfb: true, _detailLoaded: glRows.length > 0,
                        _seasonPerGame: perGameFor
                    };
                    props = sortPropsByEdge(player, props);
                    if (!props.length) return;
                    player.props = props;
                    player.stats = statsByKey[props[0].statKey] || {};
                    player.gameLog = gameLogByKey[props[0].statKey] || [];
                    player._noLiveLines = !props.some(pr => pr.lineSource);
                    built.push(player);
                });
                try { localStorage.setItem(SNAP_KEY, JSON.stringify(nextSnap)); } catch (e) { }
                if (gone()) return [];
                markFresh();
                setPropLineSource(built.length ? 'live' : 'sample');
                setProplineError(built.length ? null : 'PropLine reached but produced no CFB props for this slate.');
                return built;
            };

            const fetchCfbPlayerDetail = async (player) => {
                let glRows;
                try { glRows = await cfbGamelogMulti(player.id); } catch (e) { return; }
                if (!glRows.length) {
                    setPlayersData(prev => prev.map(p => p.id === player.id && p.sport === 'ncaaf' ? { ...p, _detailLoaded: true } : p));
                    return;
                }
                setPlayersData(prev => prev.map(p => {
                    if (p.id !== player.id || p.sport !== 'ncaaf') return p;
                    const lineFor = {};
                    (p.props || []).forEach(pr => { lineFor[pr.statKey] = pr.line; });
                    const { statsByKey, gameLogByKey } = nflComputeWindows(glRows, nflPosKeys(p.position), lineFor, p.opponent);
                    return {
                        ...p, statsByKey, gameLogByKey,
                        stats: statsByKey[p.props[0].statKey] || p.stats,
                        gameLog: gameLogByKey[p.props[0].statKey] || [],
                        _detailLoaded: true, statsSource: 'ESPN — full game log (real)'
                    };
                }));
            };

            // ═══════════════════════════════════════════════════════════════
            // NBA — real slate: ESPN keyless for identity / rosters / photos /
            // game logs, PropLine for real book lines (PrizePicks + FanDuel).
            // Basketball has its own stat set (own PROP_DEFS / windows / build)
            // but the DFS-line consolidation (nflConsolidate), the name join
            // (nflNormName) and the seed-window shape (nflSeedWindows) are
            // sport-agnostic and reused. The NBA is between seasons for part
            // of the year — when ESPN's "today" scoreboard is empty the slate
            // is driven off PropLine's OWN event list (the games that actually
            // have posted lines) so the page shows the next real slate, not
            // mock data. PropLine NBA outcomes carry no player_id → join by
            // name. `?season=` for ESPN NBA gamelogs is the year the season
            // ends in (2026 = the 2025-26 season).
            // ═══════════════════════════════════════════════════════════════
            const NBA_ESPN = 'https://site.api.espn.com/apis/site/v2/sports/basketball/nba';
            const NBA_ESPN_COMMON = 'https://site.api.espn.com/apis/common/v3/sports/basketball/nba';
            const NBA_YR_CUR = MLB_SEASON + 1;   // 2026-27
            const NBA_YR_PREV = MLB_SEASON;      // 2025-26
            const nbaCache = React.useRef({ byNorm: {}, teamMeta: {}, games: [] });

            // Static ESPN team directory — the bare `/teams` list endpoint is
            // not CORS-open (unlike scoreboard / roster / gamelog), and the 30
            // NBA franchises don't move. `id` is the ESPN team id used for
            // `/teams/{id}/roster`. Nickname is how we match PropLine's
            // "DET Pistons" / "POR Trail Blazers" / "LA Lakers" strings (their
            // abbreviations disagree with ESPN's — PHO≠PHX, WAS≠WSH, UTA≠UTAH).
            const NBA_TEAMS = [
                ['1', 'ATL', 'Hawks'], ['2', 'BOS', 'Celtics'], ['17', 'BKN', 'Nets'], ['30', 'CHA', 'Hornets'],
                ['4', 'CHI', 'Bulls'], ['5', 'CLE', 'Cavaliers'], ['6', 'DAL', 'Mavericks'], ['7', 'DEN', 'Nuggets'],
                ['8', 'DET', 'Pistons'], ['9', 'GS', 'Warriors'], ['10', 'HOU', 'Rockets'], ['11', 'IND', 'Pacers'],
                ['12', 'LAC', 'Clippers'], ['13', 'LAL', 'Lakers'], ['29', 'MEM', 'Grizzlies'], ['14', 'MIA', 'Heat'],
                ['15', 'MIL', 'Bucks'], ['16', 'MIN', 'Timberwolves'], ['3', 'NO', 'Pelicans'], ['18', 'NY', 'Knicks'],
                ['25', 'OKC', 'Thunder'], ['19', 'ORL', 'Magic'], ['20', 'PHI', '76ers'], ['21', 'PHX', 'Suns'],
                ['22', 'POR', 'Trail Blazers'], ['23', 'SAC', 'Kings'], ['24', 'SA', 'Spurs'], ['28', 'TOR', 'Raptors'],
                ['26', 'UTAH', 'Jazz'], ['27', 'WSH', 'Wizards']
            ];
            const NBA_NICK_TO_TEAM = {};
            NBA_TEAMS.forEach(([id, abbr, nick]) => {
                const t = { id, abbreviation: abbr, displayName: nick };
                const k = (s) => s.toLowerCase().replace(/[^a-z0-9]/g, '');
                NBA_NICK_TO_TEAM[k(nick)] = t;
                NBA_NICK_TO_TEAM[k(abbr)] = t;
            });
            NBA_NICK_TO_TEAM['sixers'] = NBA_NICK_TO_TEAM['76ers'];
            NBA_NICK_TO_TEAM['blazers'] = NBA_NICK_TO_TEAM['trailblazers'];
            NBA_NICK_TO_TEAM['wolves'] = NBA_NICK_TO_TEAM['timberwolves'];
            const nbaResolveTeam = (str) => {
                const raw = String(str || '');
                const k = (s) => s.toLowerCase().replace(/[^a-z0-9]/g, '');
                const noAbbr = raw.replace(/^[A-Za-z]{2,4}\s+/, '');
                return NBA_NICK_TO_TEAM[k(noAbbr)] || NBA_NICK_TO_TEAM[k(raw)] || NBA_NICK_TO_TEAM[k(raw).replace(/^[a-z]{2,4}/, '')] || null;
            };

            // The ESPN gamelog row is `names` (camelCase) zipped onto per-game
            // `stats` — same convention NFL uses. The threes field is a
            // "made-attempted" string ("3-7") — parseFloat keeps the makes.
            const NBA_3PM = 'threePointFieldGoalsMade-threePointFieldGoalsAttempted';
            const nbaPts = r => r.points || 0, nbaReb = r => r.totalRebounds || 0, nbaAst = r => r.assists || 0;
            const NBA_PROP_DEFS = {
                points:       { type: 'Points',        market: 'player_points',                  get: nbaPts },
                rebounds:     { type: 'Rebounds',      market: 'player_rebounds',                get: nbaReb },
                assists:      { type: 'Assists',       market: 'player_assists',                 get: nbaAst },
                threes:       { type: '3-PT Made',     market: 'player_threes',                  get: r => r[NBA_3PM] || 0 },
                pra:          { type: 'Pts+Reb+Ast',   market: 'player_points_rebounds_assists', get: r => nbaPts(r) + nbaReb(r) + nbaAst(r) },
                pr:           { type: 'Pts+Reb',       market: 'player_points_rebounds',         get: r => nbaPts(r) + nbaReb(r) },
                pa:           { type: 'Pts+Ast',       market: 'player_points_assists',          get: r => nbaPts(r) + nbaAst(r) },
                ra:           { type: 'Reb+Ast',       market: 'player_rebounds_assists',        get: r => nbaReb(r) + nbaAst(r) },
                steals:       { type: 'Steals',        market: 'player_steals',                  get: r => r.steals || 0 },
                blocks:       { type: 'Blocks',        market: 'player_blocks',                  get: r => r.blocks || 0 },
                turnovers:    { type: 'Turnovers',     market: 'player_turnovers',               get: r => r.turnovers || 0 },
                blocksSteals: { type: 'Blocks+Steals', market: 'player_blocks_steals',           get: r => (r.blocks || 0) + (r.steals || 0) }
            };
            const NBA_MARKET_TO_KEY = {
                ...Object.fromEntries(Object.entries(NBA_PROP_DEFS).map(([k, v]) => [v.market, k])),
                player_three_pointers_made: 'threes', player_threes_made: 'threes', 'player_3pt_made': 'threes', 'player_3-pt_made': 'threes',
                player_pts_rebs_asts: 'pra', player_pts_rebs: 'pr', player_pts_asts: 'pa', player_rebs_asts: 'ra',
                player_blocked_shots: 'blocks', player_steals_blocks: 'blocksSteals'
            };
            const NBA_STAT_CAT_ORDER = ['Points', 'Rebounds', 'Assists', 'Pts+Reb+Ast', '3-PT Made', 'Pts+Reb', 'Pts+Ast', 'Reb+Ast', 'Steals', 'Blocks', 'Turnovers', 'Blocks+Steals'];
            const nbaAllKeys = Object.keys(NBA_PROP_DEFS);

            const nbaFetchGamelog = async (id) => {
                const [cur, prev] = await Promise.all([
                    nflFetch(`${NBA_ESPN_COMMON}/athletes/${id}/gamelog?season=${NBA_YR_CUR}`).catch(() => null),
                    nflFetch(`${NBA_ESPN_COMMON}/athletes/${id}/gamelog?season=${NBA_YR_PREV}`).catch(() => null)
                ]);
                if (nflEventCount(cur) >= 3) return cur;
                if (nflEventCount(prev) > 0) return prev;
                return nflEventCount(cur) > 0 ? cur : null;
            };
            const nbaGamelogs = async (ids) => {
                const map = {};
                for (const grp of chunk([...new Set(ids)], 20)) {
                    await Promise.all(grp.map(async id => {
                        try { const gl = await nbaFetchGamelog(id); map[id] = gl ? nflParseGamelog(gl) : []; }
                        catch (e) { map[id] = []; }
                    }));
                }
                return map;
            };
            // L5 minutes vs the prior 10 — feeds the NBA "Minutes Trend" factor.
            const nbaMinutesTrend = (glRows) => {
                const mins = glRows.map(g => (g.row && g.row.minutes) || 0).filter(m => m > 0);
                if (mins.length < 6) return 0;
                const a = arr => arr.reduce((s, v) => s + v, 0) / arr.length;
                const l5 = mins.slice(-5), prior = mins.slice(-15, -5);
                return prior.length ? Math.round((a(l5) - a(prior)) * 10) / 10 : 0;
            };

            // Team defense — one keyless call gives all 30 teams' OPPONENT
            // splits (what they allow). ESPN `statistics/byteam` carries an
            // "Opponent Offensive" / "Opponent General" split per team; we
            // read points / rebounds / assists / 3PM allowed per game and
            // rank 1 (stingiest) → 30. Feeds the NBA "vs <OPP> defense"
            // factor + projection nudge + the "similar defenses" split.
            // Each slate team's schedule → is tonight the 2nd night of a
            // back-to-back (game yesterday), the 1st night (game tomorrow),
            // or a rested spot. Keyless `/teams/{id}/schedule`.
            const nbaFetchB2B = async (teamIds, gameByTeam) => {
                const DAY = 864e5;
                const out = {};
                await Promise.all(teamIds.map(async tid => {
                    const tip = gameByTeam[tid];
                    if (!tip) return;
                    let evs = [];
                    for (const yr of [NBA_YR_CUR, NBA_YR_PREV]) {
                        const s = await nflFetch(`${NBA_ESPN}/teams/${tid}/schedule?season=${yr}`).catch(() => null);
                        const list = (s && s.events) || [];
                        if (list.length) evs = evs.concat(list);
                    }
                    const times = evs.map(e => {
                        const c = e.competitions && e.competitions[0];
                        const opp = (c && (c.competitors || []).find(x => String(x.team && x.team.id) !== String(tid)));
                        return { ms: Date.parse(e.date || (c && c.date) || ''), abbr: (opp && opp.team && opp.team.abbreviation) || '' };
                    }).filter(x => Number.isFinite(x.ms)).sort((a, b) => a.ms - b.ms);
                    // nearest scheduled game to tonight = "this" game
                    let iThis = -1, best = Infinity;
                    times.forEach((t, i) => { const d = Math.abs(t.ms - tip); if (d < best) { best = d; iThis = i; } });
                    if (iThis < 0) return;
                    const prev = times[iThis - 1], next = times[iThis + 1];
                    const restDays = prev ? Math.round((times[iThis].ms - prev.ms) / DAY) : null;
                    const toNext = next ? Math.round((next.ms - times[iThis].ms) / DAY) : null;
                    out[tid] = {
                        tonight: restDays != null && restDays <= 1 ? 'second' : null,
                        first: toNext != null && toNext <= 1 ? 'first' : null,
                        restDays,
                        prevOpp: prev ? prev.abbr : null,
                        nextOpp: next ? next.abbr : null
                    };
                }));
                return out;
            };

            const nbaFetchTeamDef = async () => {
                for (const yr of [NBA_YR_PREV, NBA_YR_CUR]) {
                    try {
                        const d = await nflFetch(`https://site.api.espn.com/apis/common/v3/sports/basketball/nba/statistics/byteam?season=${yr}&seasontype=2`);
                        const teams = (d && d.teams) || [];
                        const catNames = (nm) => { const c = (d.categories || []).find(x => x.name === nm && x.names); return c ? c.names : []; };
                        const offN = catNames('offensive'), genN = catNames('general'), defN = catNames('defensive');
                        const iPts = offN.indexOf('avgPoints'), iAst = offN.indexOf('avgAssists'), iTpm = offN.indexOf('avgThreePointFieldGoalsMade');
                        const iTo = offN.indexOf('avgTurnovers'), iReb = genN.indexOf('avgRebounds');
                        const iBlk = defN.indexOf('avgBlocks'), iStl = defN.indexOf('avgSteals');
                        const rows = [];
                        teams.forEach(t => {
                            const cats = t.categories || [];
                            const oppOff = cats.find(c => c.name === 'offensive' && /opponent/i.test(c.displayName || ''));
                            const oppGen = cats.find(c => c.name === 'general' && /opponent/i.test(c.displayName || ''));
                            const oppDef = cats.find(c => c.name === 'defensive' && /opponent/i.test(c.displayName || ''));
                            const ov = (oppOff && oppOff.values) || [], gv = (oppGen && oppGen.values) || [], dv = (oppDef && oppDef.values) || [];
                            const id = String(t.team && t.team.id);
                            if (!id || !ov.length || !(ov[iPts] > 0)) return;
                            rows.push({
                                id,
                                ptsAllowed: Math.round(ov[iPts] * 10) / 10,
                                astAllowed: iAst >= 0 ? Math.round(ov[iAst] * 10) / 10 : null,
                                tpmAllowed: iTpm >= 0 ? Math.round(ov[iTpm] * 10) / 10 : null,
                                rebAllowed: iReb >= 0 && gv[iReb] != null ? Math.round(gv[iReb] * 10) / 10 : null,
                                // For a player's OWN block/steal/turnover prop, the
                                // opponent's SCORING defence is irrelevant — what
                                // matters is how block-prone / turnover-prone the
                                // opponent is. These are the opponent's own rates:
                                //   blkAllowed = shots the opponent gets blocked / game
                                //   stlAllowed = times the opponent is stripped / game
                                //   toForced   = turnovers the opponent forces / game
                                blkAllowed: iBlk >= 0 && dv[iBlk] != null ? Math.round(dv[iBlk] * 10) / 10 : null,
                                stlAllowed: iStl >= 0 && dv[iStl] != null ? Math.round(dv[iStl] * 10) / 10 : null,
                                toForced: iTo >= 0 && ov[iTo] != null ? Math.round(ov[iTo] * 10) / 10 : null
                            });
                        });
                        if (rows.length < 20) continue;
                        [['ptsAllowed', 'ptsRank'], ['rebAllowed', 'rebRank'], ['astAllowed', 'astRank'], ['tpmAllowed', 'tpmRank'],
                         ['blkAllowed', 'blkRank'], ['stlAllowed', 'stlRank'], ['toForced', 'toRank']].forEach(([f, rk]) => {
                            const s = rows.filter(r => r[f] != null).sort((a, b) => a[f] - b[f]);
                            s.forEach((r, i) => { r[rk] = i + 1; });
                        });
                        const map = {};
                        rows.forEach(r => { map[r.id] = r; });
                        return map;
                    } catch (e) { /* try the other season */ }
                }
                return {};
            };

            // Real windows for one player from their parsed game log — same
            // shape MLB/NFL use, so calculateEdgeScore / PlayerCard read it
            // unchanged.
            // Weighted-recent minutes projection for tonight (L5 heaviest).
            const nbaProjMinutes = (glRows) => {
                const mins = glRows.map(g => (g.row && g.row.minutes) || 0).filter(m => m > 0);
                if (!mins.length) return null;
                const a = (arr) => arr.length ? arr.reduce((s, v) => s + v, 0) / arr.length : 0;
                const l5 = a(mins.slice(-5)), l10 = a(mins.slice(-10)), l20 = a(mins.slice(-20));
                const w = l5 ? (0.5 * l5 + 0.3 * (l10 || l5) + 0.2 * (l20 || l10 || l5)) : (l10 || l20);
                return Math.round(w * 10) / 10;
            };

            const nbaComputeWindows = (glRows, lineFor, oppAbbr, oppRankByAbbr) => {
                const statsByKey = {}, gameLogByKey = {};
                const mean = (arr) => arr.length ? round1(arr.reduce((s, v) => s + v, 0) / arr.length) : null;
                // minutes per game, aligned to glRows order
                const minOf = glRows.map(g => (g.row && g.row.minutes) || null);
                const minMean = (arr) => { const v = arr.filter(x => x != null); return v.length ? Math.round(v.reduce((s, x) => s + x, 0) / v.length * 10) / 10 : null; };
                nbaAllKeys.forEach(k => {
                    const getV = NBA_PROP_DEFS[k].get;
                    const vals = glRows.map(g => getV(g.row) || 0);
                    const line = lineFor[k] != null ? lineFor[k] : (mean(vals) || 0);
                    const rate = (arr) => arr.length ? Math.round((arr.filter(v => v > line).length / arr.length) * 100) : null;
                    const lastN = (n) => vals.slice(-n);
                    const minN = (n) => minMean(minOf.slice(-n));
                    const sorted = [...vals].sort((a, b) => a - b);
                    const oppIdx = glRows.map((g, i) => g.opponent === oppAbbr ? i : -1).filter(i => i >= 0);
                    const oppVals = oppIdx.map(i => vals[i]);
                    statsByKey[k] = {
                        last5: { avg: mean(lastN(5)), hitRate: rate(lastN(5)), games: Math.min(5, vals.length), minAvg: minN(5) },
                        last10: { avg: mean(lastN(10)), hitRate: rate(lastN(10)), games: Math.min(10, vals.length), minAvg: minN(10) },
                        last20: { avg: mean(lastN(20)), hitRate: rate(lastN(20)), games: Math.min(20, vals.length), minAvg: minN(20) },
                        season: { avg: mean(vals), hitRate: rate(vals), games: vals.length, minAvg: minMean(minOf) },
                        vsOpp: oppVals.length
                            ? { avg: mean(oppVals), hitRate: rate(oppVals), games: oppVals.length, minAvg: minMean(oppIdx.map(i => minOf[i])) }
                            : { avg: mean(vals), hitRate: rate(vals), games: 0, minAvg: minMean(minOf) },
                        recent: { avg: mean(lastN(5)), hitRate: rate(lastN(5)), median: sorted[sorted.length >> 1] || 0, range: [sorted[0] || 0, sorted[sorted.length - 1] || 0], games: vals.length, minAvg: minN(5) }
                    };
                    // Each row carries minutes played, day-of-week, that
                    // opponent's defensive rank, and days of rest before it.
                    const _last40 = glRows.slice(-40);
                    gameLogByKey[k] = _last40.map((g, i) => {
                        const prevTs = i > 0 ? _last40[i - 1].ts : (glRows.length > _last40.length ? glRows[glRows.length - _last40.length - 1].ts : null);
                        return {
                            date: g.date, dateShort: g.dateShort, opponent: g.opponent, vsLabel: g.vsLabel,
                            points: getV(g.row) || 0, line,
                            min: (g.row && g.row.minutes) || null,
                            dow: Number.isFinite(g.ts) && g.ts > 0 ? new Date(g.ts).getDay() : null,
                            oppRank: (oppRankByAbbr && oppRankByAbbr[g.opponent]) || null,
                            rest: (Number.isFinite(g.ts) && Number.isFinite(prevTs) && prevTs > 0) ? Math.round((g.ts - prevTs) / 864e5) : null
                        };
                    });
                });
                return { statsByKey, gameLogByKey };
            };

            // Build a player's props for ONE book from their consolidated lines.
            // Mirrors nflBuildProps (goblin/demon = More-only, standard two-way,
            // sportsbook N+ rung one-way, junk-line guard, alt ladder kept).
            const nbaBuildProps = (statsByKey, allLines, book, perGameFor) => {
                const props = [];
                const seedK = (k, line) => { if (!statsByKey[k]) statsByKey[k] = nflSeedWindows(perGameFor(k, line), line); return statsByKey[k]; };
                // Sportsbook (FanDuel / DraftKings / BetMGM) consensus line per
                // stat — the "sharp" number the DFS line is compared against.
                const marketLineFor = (byBook) => {
                    const lines = ['fanduel', 'draftkings', 'betmgm', 'betrivers', 'pinnacle']
                        .map(b => { const a = byBook[b]; if (!a || !a.length) return null; const p = a.find(x => x.primary) || a[0]; return p ? p.line : null; })
                        .filter(v => v != null).sort((a, b) => a - b);
                    if (!lines.length) return null;
                    const m = lines.length >> 1;
                    return lines.length % 2 ? lines[m] : Math.round((lines[m - 1] + lines[m]) * 5) / 10;
                };
                const pushLine = (k, def, e, extraIn) => {
                    const { _stdLine, _mktLine, ...extra } = extraIn;
                    const w = seedK(k, e.line);
                    const oHR = estHitRate(w.season.avg || w.recent.avg || e.line, e.line);
                    const base = { type: def.type, statKey: k, line: e.line, ...extra };
                    // Attach the book-vs-market gap only to the MAIN, STANDARD
                    // DFS line for this stat — never a goblin/demon rung (those
                    // sit off-market by design) or a cross-book fallback.
                    if (_mktLine != null && DFS_PLATFORMS.has(extra.book) && !extra.crossBook && !extra.altLine
                        && e.primary && (e.ppType == null || e.ppType === 'standard')) {
                        base.marketLine = _mktLine;
                        base.mktGap = Math.round((e.line - _mktLine) * 10) / 10;
                    }
                    if (DFS_PLATFORMS.has(extra.book) && (e.ppType === 'goblin' || e.ppType === 'demon')) {
                        props.push({ ...base, direction: 'over', oneWay: true, ppKind: e.ppType, odds: extra.odds ?? -110, oppOdds: null, hitRate: oHR });
                        return;
                    }
                    const hasO = e.over != null, hasU = e.under != null;
                    if (hasO && hasU) {
                        props.push({ ...base, direction: 'over', odds: extra.odds ?? -110, oppOdds: extra.oppOdds ?? -110, hitRate: oHR });
                        props.push({ ...base, direction: 'under', odds: extra.oppOdds ?? -110, oppOdds: extra.odds ?? -110, hitRate: Math.max(2, 100 - oHR) });
                        return;
                    }
                    const side = hasO ? 'over' : 'under';
                    props.push({
                        ...base, direction: side, oneWay: true, ppKind: null,
                        odds: (side === 'over' ? extra.odds : extra.oppOdds) ?? -110, oppOdds: null,
                        hitRate: side === 'over' ? oHR : Math.max(2, 100 - oHR)
                    });
                };
                const bookOrder = [book, ...PROPLINE_BOOK_PRIORITY.filter(b => b !== book)];
                nbaAllKeys.forEach(k => {
                    const def = NBA_PROP_DEFS[k];
                    const byBook = allLines[k] || {};
                    const useBook = bookOrder.find(b => byBook[b] && byBook[b].length);
                    if (!useBook) return;
                    const crossBook = useBook !== book;
                    const pg = perGameFor(k);
                    const w = statsByKey[k];
                    if (w && (w.season.games || 0) >= 4) {
                        const primaryLine = ((byBook[useBook].find(e => e.primary)) || byBook[useBook][0] || {}).line || 0;
                        const hi = (w.recent && w.recent.range && w.recent.range[1]) || pg;
                        if (primaryLine > pg * 6 + 8 || primaryLine > hi * 2 + 8) return;
                    }
                    let arr = byBook[useBook];
                    if (crossBook) { const pr = arr.find(e => e.primary) || arr.slice().sort((a, c) => a.juice - c.juice)[0]; arr = pr ? [pr] : []; }
                    const sorted = arr.slice().sort((a, c) => (c.primary ? 1 : 0) - (a.primary ? 1 : 0) || a.line - c.line);
                    const multi = sorted.length > 1;
                    const stdLine = (sorted.find(e => e.over != null && e.under != null) || {}).line;
                    const mktLine = marketLineFor(byBook);
                    sorted.forEach(e => pushLine(k, def, e, {
                        lineSource: crossBook ? `${useBook} line — not posted on ${book}` : `${e._src === 'parlayapi' ? 'ParlayAPI' : 'PropLine'} · ${useBook}`,
                        book: useBook, crossBook, setAt: e.setAt, move: e.move,
                        altLine: multi && !e.primary, odds: e.over, oppOdds: e.under, _stdLine: stdLine, _mktLine: mktLine
                    }));
                });
                return props;
            };

            const fetchNbaSlate = async (date) => {
                if (!backendUrl || !proplineKey) return { slots: [], games: [] };
                const plFetch = async (path) => {
                    const [p, q] = path.replace(/^\//, '').split('?');
                    const url = `${backendUrl}/api/propline/${p}?apiKey=${encodeURIComponent(proplineKey)}${q ? '&' + q : ''}`;
                    const r = await fetch(url);
                    if (!r.ok) throw new Error('PropLine HTTP ' + r.status);
                    return r.json();
                };
                const resolveTeam = nbaResolveTeam;

                let events;
                try { events = await plFetch('/v1/sports/basketball_nba/events'); } catch (e) { return { slots: [], games: [] }; }
                const evs = (Array.isArray(events) ? events : []).filter(e => e && e.commence_time)
                    .sort((a, b) => Date.parse(a.commence_time) - Date.parse(b.commence_time));
                if (!evs.length) return { slots: [], games: [] };
                // Prefer games on the selected date; if none (offseason / nothing
                // today) fall back to the earliest 72h cluster with posted lines.
                const dayLo = Date.parse(String(date) + 'T00:00:00Z');
                const dayHi = dayLo + 30 * 3600 * 1000;
                let window = evs.filter(e => { const t = Date.parse(e.commence_time); return t >= dayLo && t <= dayHi; });
                if (!window.length) {
                    const t0 = Date.parse(evs[0].commence_time);
                    window = evs.filter(e => Date.parse(e.commence_time) <= t0 + 72 * 3600 * 1000);
                }
                const byPair = {};
                window.forEach(ev => {
                    const home = resolveTeam(ev.home_team), away = resolveTeam(ev.away_team);
                    if (!home || !away || home.id === away.id) return;
                    const key = [home.id, away.id].sort().join('-');
                    const ct = Date.parse(ev.commence_time);
                    if (!byPair[key] || ct < byPair[key].ct) byPair[key] = { evId: ev.id, ct, home, away, iso: ev.commence_time };
                });
                const teamMeta = {}, games = [];
                Object.values(byPair).forEach(g => {
                    teamMeta[g.home.id] = { abbr: g.home.abbreviation, name: g.home.displayName };
                    teamMeta[g.away.id] = { abbr: g.away.abbreviation, name: g.away.displayName };
                    const when = new Date(g.iso);
                    games.push({
                        gameId: g.evId, homeId: g.home.id, awayId: g.away.id,
                        iso: g.iso, kickoffMs: g.ct, state: 'pre', status: 'Scheduled',
                        gameTime: when.toLocaleString([], { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })
                    });
                });
                if (!games.length) return { slots: [], games: [] };

                const teamIds = [...new Set(games.flatMap(g => [g.homeId, g.awayId]))];
                const gameByTeam = {};
                games.forEach(g => { gameByTeam[g.homeId] = g.kickoffMs; gameByTeam[g.awayId] = g.kickoffMs; });
                const [rosters, teamDef, b2bByTeam] = await Promise.all([
                    Promise.all(teamIds.map(async tid => {
                        try {
                            const r = await nflFetch(`${NBA_ESPN}/teams/${tid}/roster`);
                            return { tid, athletes: r.athletes || (r.team && r.team.athletes) || [] };
                        } catch (e) { return { tid, athletes: [] }; }
                    })),
                    nbaFetchTeamDef().catch(() => ({})),
                    nbaFetchB2B(teamIds, gameByTeam).catch(() => ({}))
                ]);
                // abbr -> that team's points-allowed rank (all 30, for the
                // game-log "similar defenses" split).
                const oppRankByAbbr = {};
                NBA_TEAMS.forEach(([id, abbr]) => { const d = teamDef[id]; if (d && d.ptsRank) oppRankByAbbr[abbr] = d.ptsRank; });
                const posGroup = (raw) => /^(PG|SG|G)$/i.test(raw || '') ? 'G' : /^(SF|PF|F)$/i.test(raw || '') ? 'F' : 'C';

                const byNorm = {}, slots = [];
                rosters.forEach(({ tid, athletes }) => {
                    const g = games.find(x => x.homeId === tid || x.awayId === tid);
                    if (!g) return;
                    const isHome = g.homeId === tid;
                    const oppId = isHome ? g.awayId : g.homeId;
                    (Array.isArray(athletes) ? athletes : []).forEach(a => {
                        if (!a || !a.id || !a.fullName) return;
                        const st = a.status && (a.status.type || a.status.name || a.status);
                        if (st && /injured-reserve|g-league|suspension/i.test(String(st))) return;
                        const raw = (a.position && (a.position.abbreviation || a.position.name)) || 'G';
                        const od = teamDef[String(oppId)] || null;
                        const b2b = b2bByTeam[String(tid)] || null;
                        const rec = {
                            id: String(a.id), name: a.fullName, pos: posGroup(raw), posRaw: raw,
                            headshot: (a.headshot && a.headshot.href) || `https://a.espncdn.com/i/headshots/nba/players/full/${a.id}.png`,
                            team: (teamMeta[tid] || {}).abbr, teamId: tid,
                            opponent: (teamMeta[oppId] || {}).abbr, oppTeamId: oppId,
                            oppDef: od, oppRank: od && od.ptsRank || null,
                            gameDow: g.kickoffMs ? new Date(g.kickoffMs).getDay() : null,
                            b2b, isBackToBackTonight: !!(b2b && b2b.tonight === 'second'),
                            gamePk: g.gameId, isHome, gameTime: g.gameTime, gameState: g.state
                        };
                        byNorm[nflNormName(a.fullName)] = rec;
                        slots.push(rec);
                    });
                });
                nbaCache.current = { byNorm, teamMeta, games, teamDef, oppRankByAbbr };
                return { slots, games };
            };

            const fetchNbaPropLines = async (slate, isStale) => {
                const gone = () => typeof isStale === 'function' && isStale();
                const { games } = slate;
                if (gone()) return [];
                if (!backendUrl || !proplineKey) { setPropLineSource('sample'); return []; }
                const plFetch = async (path) => {
                    const [p, q] = path.replace(/^\//, '').split('?');
                    const url = `${backendUrl}/api/propline/${p}?apiKey=${encodeURIComponent(proplineKey)}${q ? '&' + q : ''}`;
                    const r = await fetch(url);
                    if (r.status === 401 || r.status === 403) throw new Error(`PropLine key rejected (HTTP ${r.status})`);
                    if (r.status === 429) throw new Error('PropLine rate limit hit — try again later');
                    if (!r.ok) throw new Error('PropLine HTTP ' + r.status);
                    return r.json();
                };
                // Each slate game already carries its PropLine event id as gameId
                // (the slate is built from PropLine's own event list).

                if (!wantEventIds.length) { setPropLineSource('sample'); setProplineError('No NBA games on this slate matched PropLine.'); return []; }

                const markets = [...new Set(Object.values(NBA_PROP_DEFS).map(d => d.market))].join(',');
                const books = PROPLINE_BOOK_PRIORITY.join(',');

                await Promise.all(wantEventIds.map(async eid => {
                    try {

                        (data.bookmakers || []).forEach(bm => (bm.markets || []).forEach(m => {
                            const statKey = NBA_MARKET_TO_KEY[m.key];
                            if (!statKey || m.suspended_at) return;
                            (m.outcomes || []).forEach(o => {
                                if (o.price == null || o.suspended_at) return;
                                const nm = nflNormName(o.description || o.name);
                                if (!nm) return;
                                const ppType = o.dfs_odds_type || null;
                                let line = null, side = null;
                                if (/^over$/i.test(o.name || '') && o.point != null) { line = o.point; side = 'over'; }
                                else if (/^under$/i.test(o.name || '') && o.point != null) { line = o.point; side = 'under'; }
                                else if (!DFS_PLATFORMS.has(bm.key)) { const mm = /^(\d+)\s*\+/.exec(o.name || ''); if (mm) { line = parseInt(mm[1], 10) - 0.5; side = 'over'; } }
                                if (line == null || side == null) return;
                                const t2 = (linesByName[nm] || (linesByName[nm] = {}));
                                const t3 = (t2[statKey] || (t2[statKey] = {}));
                                const arr = (t3[bm.key] || (t3[bm.key] = []));
                                const kk = ppType ? `${line}|${ppType}` : `${line}`;

                if (parlayApiKey) {
                    const pa = await fetchParlayProps('basketball_nba', PARLAY_BB_MKT);
                    setParlayCount(mergeParlay(linesByName, pa, nn => bySlot[nn] ? nn : null));
                } else { setParlaySource('off'); }
                nflConsolidate(linesByName);

                const matchedNames = Object.keys(linesByName).filter(nm => bySlot[nm]);
                if (!matchedNames.length) { setPropLineSource('sample'); setProplineError('PropLine returned NBA lines but none matched the roster scan (name join).'); return []; }

                const glMap = await nbaGamelogs(matchedNames.map(nm => bySlot[nm].id));
                const wantBook = PLATFORM_BOOK[selectedPlatform] || 'prizepicks';
                const SNAP_KEY = 'beatsedge_nba_lines_v1';
                let snap = {}; try { snap = JSON.parse(localStorage.getItem(SNAP_KEY) || '{}'); } catch (e) { }
                const nextSnap = {}, now = Date.now();

                const built = [];
                matchedNames.forEach(nm => {
                    const slot = bySlot[nm];
                    const keys = nbaAllKeys.filter(k => linesByName[nm][k]);
                    if (!keys.length) return;
                    const glRows = glMap[slot.id] || [];
                    const lineFor = {};
                    Object.keys(linesByName[nm]).forEach(k => {
                        const arr = (linesByName[nm][k][wantBook]) || [];
                        const pr = arr.find(e => e.primary) || arr[0];
                        if (pr) lineFor[k] = pr.line;
                    });
                    Object.keys(linesByName[nm]).forEach(k => {
                        const arr = (linesByName[nm][k][wantBook]) || [];
                        const pr = arr.find(e => e.primary) || arr[0];
                        if (!pr) return;
                        const id = `${slot.id}:${k}:${wantBook}`;
                        nextSnap[id] = { line: pr.line, ts: now };
                        const prev = snap[id];
                        if (prev && typeof prev.line === 'number' && prev.line !== pr.line) {

                    const perGameFor = (k) => { const w = statsByKey[k]; return (w && (w.season.avg || w.recent.avg)) || 0; };
                    let props = nbaBuildProps(statsByKey, linesByName[nm], wantBook, perGameFor);
                    const player = {
                        id: slot.id, name: slot.name, sport: 'nba', role: 'skill',
                        position: slot.pos, team: slot.team, opponent: slot.opponent,
                        teamId: slot.teamId, oppTeamId: slot.oppTeamId, gamePk: slot.gamePk,
                        gameTime: slot.gameTime, headshot: slot.headshot, status: 'ACTIVE',

                        oppDef: slot.oppDef || null, oppRank: slot.oppRank || null, gameDow: slot.gameDow,

                    };
                    props = sortPropsByEdge(player, props);
                    if (!props.length) return;

                    player._noLiveLines = !props.some(pr => pr.lineSource);

            const NBA_DVP_ABBR = { PHO: 'PHX', UTA: 'UTAH', WAS: 'WSH' };

            const NBA_DVP = (() => {
                const lines = NBA_DVP_CSV.trim().split('\n');
                const head = lines[0].split(',').map(s => s.trim());
                const ix = (n) => head.indexOf(n);
                const cols = { pts: 'pts', tpm: 'three_pm', reb: 'reb', ast: 'ast', stl: 'stl', blk: 'blk', to: 'to' };
                const out = {};

                    const c = ln.split(',');
                    if (c.length < head.length) return;
                    const pos = c[ix('position')].trim();
                    let team = c[ix('team')].trim().toUpperCase();
                    team = NBA_DVP_ABBR[team] || team;
                    const rec = {};
                    Object.entries(cols).forEach(([k, col]) => {
                        rec[k] = parseFloat(c[ix(col)]);
                        rec[k + 'Rank'] = parseInt(c[ix(col + '_rank')], 10);
                    });
                    (out[team] || (out[team] = {}))[pos] = rec;
                });
                return out;
            })();

            const NBA_DVP_STATS = ['pts', 'tpm', 'reb', 'ast', 'stl', 'blk', 'to'];

                const out = {};
                Object.entries(NBA_DVP).forEach(([team, byPos]) => {

                        NBA_DVP_STATS.forEach(st => {

            const NBA_POS_GROUP = (raw) => /^(PG|SG|G)$/i.test(raw || '') ? 'G' : /^(SF|PF|F)$/i.test(raw || '') ? 'F' : 'C';
            // 1-150 rank → bucket (matches the site's Top 50 / Middle 50 / Bottom 50)
            const nbaDvpBucket = (rank) => rank == null ? null : rank <= 50 ? 'tough' : rank >= 101 ? 'soft' : 'mid';

            // Sync — the `opponentDefense` object every NBA player gets at
            // slate-build time (no fetch, no modal wait).
            const nbaDvpFor = (oppAbbr, playerPos) => {
                const team = NBA_DVP_GFC[String(oppAbbr || '').toUpperCase()];
                if (!team) return null;
                const SUBS = { G: ['PG', 'SG'], F: ['SF', 'PF'], C: ['C'] };
                const grp = NBA_POS_GROUP(playerPos);
                const subTxt = (k) => SUBS[k].map(p => team[k].sub[p] ? `${p} #${team[k].sub[p].ptsRank}` : null).filter(Boolean).join(', ');
                const byPosition = {};
                ['G', 'F', 'C'].forEach(k => {
                    const t = team[k]; if (!t || t.pts == null) return;
                    byPosition[k] = {
                        pointsAllowed: t.pts, reboundsAllowed: t.reb, assistsAllowed: t.ast,
                        threesAllowed: t.tpm, stealsAllowed: t.stl, blocksAllowed: t.blk, turnoversAllowed: t.to,
                        rank: t.ptsRank, rebRank: t.rebRank, astRank: t.astRank, tpmRank: t.tpmRank,
                        stlRank: t.stlRank, blkRank: t.blkRank, toRank: t.toRank,
                        sub: subTxt(k)
                    };
                });
                return {
                    team: String(oppAbbr || '').toUpperCase(),
                    overall: { rank: team[grp].ptsRank, ppg: team[grp].pts },
                    byPosition,
                    row5: { ...team.G.sub, ...team.F.sub, ...team.C.sub },  // {PG,SG,SF,PF,C} full recs
                    playerGroup: grp,
                    dataSource: `Defense vs Position — ${NBA_DVP_SOURCE} (as of ${NBA_DVP_ASOF})`,
                    isRealByPosition: true
                };
            };

            const fetchNbaPlayerDetail = async (player) => {
                let glRows;
                try { const gl = await nbaFetchGamelog(player.id); glRows = gl ? nflParseGamelog(gl) : []; }
                catch (e) { return; }
                if (!glRows.length) {
                    setPlayersData(prev => prev.map(p => p.id === player.id && p.sport === 'nba' ? { ...p, _detailLoaded: true } : p));
                    return;
                }
                // Opponent DvP is a sync CSV lookup — already set at slate build;
                // this just makes sure it's there.
                const oppDefObj = nbaDvpFor(player.opponent, player.position);
                setPlayersData(prev => prev.map(p => {
                    if (p.id !== player.id || p.sport !== 'nba') return p;
                    const lineFor = {};
                    (p.props || []).forEach(pr => { lineFor[pr.statKey] = pr.line; });
                    const { statsByKey, gameLogByKey } = nbaComputeWindows(glRows, lineFor, p.opponent, nbaCache.current.oppRankByAbbr);
                    return {
                        ...p, statsByKey, gameLogByKey,
                        stats: statsByKey[p.props[0].statKey] || p.stats,
                        gameLog: gameLogByKey[p.props[0].statKey] || [],
                        minutesTrend: nbaMinutesTrend(glRows), projMin: nbaProjMinutes(glRows),
                        opponentDefense: oppDefObj || p.opponentDefense || null,
                        _detailLoaded: true, statsSource: 'ESPN — full game log (real)'
                    };
                }));
            };

            // Multi-season NBA game logs for the backtest (one season is ~70
            // games — pull two so the walk-forward has a real sample).
            const nbaGamelogsMulti = async (ids, years) => {
                const map = {};
                for (const grp of chunk([...new Set(ids)], 16)) {
                    await Promise.all(grp.map(async id => {
                        const rows = [];
                        for (const yr of years) {
                            try { const gl = await nflFetch(`${NBA_ESPN_COMMON}/athletes/${id}/gamelog?season=${yr}`); if (gl && nflEventCount(gl) > 0) rows.push(...nflParseGamelog(gl)); }
                            catch (e) { /* skip year */ }
                        }
                        rows.sort((a, b) => (a.ts || 0) - (b.ts || 0));
                        map[id] = rows;
                    }));
                }
                return map;
            };

            // Walk-forward for ONE NBA player-stat series. The fake player
            // carries the model context that can be rebuilt HONESTLY from
            // games before game i — trailing windows, projected & trending
            // minutes, rest, home/road, recent-vs-opponent.
            //
            // What it deliberately does NOT carry: Defense-vs-Position and
            // opponent team-defense rank. Both of those only exist as a single
            // CURRENT-season snapshot (NBA_DVP_CSV / statistics/byteam), so
            // feeding them to a 2024-25 or mid-2025-26 game would be
            // look-ahead leakage — the prediction would "know" how the
            // defense played the rest of that season. They stay in the LIVE
            // model (there they're best-available info, not leakage); they're
            // just out of the backtest until we have dated DvP snapshots
            // (archiveDvpSnapshot, seeded now, usable in a few weeks).
            const nbaBacktestSeries = (vals, mins, opps, tss, homes, group, statKey, acc) => {
                const MIN = 14;
                const mMean = (a) => { const v = a.filter(x => x != null); return v.length ? Math.round(v.reduce((s, x) => s + x, 0) / v.length * 10) / 10 : null; };
                for (let i = MIN; i < vals.length; i++) {
                    const hv = vals.slice(0, i), hm = mins.slice(0, i), ho = opps.slice(0, i), ht = tss.slice(0, i), hh = homes.slice(0, i);
                    const seasonAvg = hv.reduce((s, v) => s + v, 0) / hv.length;
                    if (seasonAvg <= 0) continue;
                    let line = null, bestGap = 99;
                    for (let cand = 0.5; cand <= seasonAvg * 2.2 + 1; cand += 1) {
                        const over = hv.filter(v => v > cand).length / hv.length;
                        const gap = Math.abs(over - 0.48);
                        if (gap < bestGap) { bestGap = gap; line = cand; }
                    }
                    if (line == null || line <= 0) continue;
                    const actual = vals[i], tonightOpp = opps[i];
                    if (actual === line) continue;
                    const w = btWindowsAsOf(hv, ho, tonightOpp, line);
                    w.last5.minAvg = mMean(hm.slice(-5)); w.last10.minAvg = mMean(hm.slice(-10));
                    w.last20.minAvg = mMean(hm.slice(-20)); w.season.minAvg = mMean(hm);
                    w.vsOpp.minAvg = w.season.minAvg; w.recent.minAvg = w.last5.minAvg;
                    const glHist = hv.map((v, j) => ({
                        points: v, line, opponent: ho[j],
                        vsLabel: (hh[j] ? 'vs ' : '@ ') + ho[j],
                        dow: Number.isFinite(ht[j]) && ht[j] > 0 ? new Date(ht[j]).getDay() : null,
                        oppRank: null,  // leak-safe: no as-of opponent-strength snapshot exists
                        rest: j > 0 && Number.isFinite(ht[j]) && Number.isFinite(ht[j - 1]) && ht[j - 1] > 0 ? Math.round((ht[j] - ht[j - 1]) / 864e5) : null
                    }));
                    const tRest = Number.isFinite(tss[i]) && Number.isFinite(tss[i - 1]) && tss[i - 1] > 0 ? Math.round((tss[i] - tss[i - 1]) / 864e5) : null;
                    const projMin = nbaProjMinutes(hm.map(m => ({ row: { minutes: m } })));
                    const fake = {
                        sport: 'nba', position: group, opponent: tonightOpp,
                        statsByKey: { [statKey]: w }, gameLogByKey: { [statKey]: glHist },
                        opponentDefense: null,  // leak-safe — see note above (DvP is a current-season-only snapshot)
                        oppRank: null,          // leak-safe — team-defense rank is a full-season aggregate
                        gameDow: Number.isFinite(tss[i]) && tss[i] > 0 ? new Date(tss[i]).getDay() : null,
                        b2b: tRest != null ? { restDays: tRest, tonight: tRest <= 1 ? 'second' : null, first: null } : null,
                        isHomeTonight: !!homes[i],
                        minutesTrend: nbaMinutesTrend(hm.map(m => ({ row: { minutes: m } }))),
                        projMin,
                        opponentContext: null, oppDef: null, situational: null
                    };
                    for (const dir of ['over', 'under']) {
                        const e = calculateEdgeScore(fake, { statKey, type: statKey, line, direction: dir, lineSource: 'backtest' });
                        const hit = dir === 'over' ? actual > line : actual < line;
                        const g = acc[e.grade] || (acc[e.grade] = { n: 0, hit: 0 });
                        g.n++; if (hit) g.hit++;
                        acc._total.n++; if (hit) acc._total.hit++;
                        btFileProb(acc, e.modelProbPct, e.rawModelProbPct, hit);
                        btFileAlign(acc, e.greenCount, e.totalFactors, hit);
                        btFileGradeConf(acc, e.grade, e.greenCount, e.totalFactors, hit);
                        btFileConfEdge(acc, e.greenCount, e.totalFactors, e.edgeSignalPct, hit);
                        btFileGCE(acc, e.grade, e.greenCount, e.totalFactors, e.edgeSignalPct, hit);
                        const b = Math.max(0, Math.min(19, Math.floor(e.gradeScore * 20)));
                        const sb = acc.score[b] || (acc.score[b] = { n: 0, hit: 0 });
                        sb.n++; if (hit) sb.hit++;
                        e.factors.forEach(f => {
                            if (!f.supports) return;
                            const name = /^[A-Z]{2,4} vs (guards|forwards|centers)$/.test(f.name) ? 'Defense vs position' : /^vs\s+[A-Z]{2,4}$/.test(f.name) ? 'Recent vs opponent' : f.name;
                            const fb = acc.factors[name] || (acc.factors[name] = { n: 0, hit: 0 });
                            fb.n++; if (hit) fb.hit++;
                        });
                    }
                }
            };

            // ── Run the walk-forward backtest over every player on the current
            // slate (their full real game logs), for the current sport.
            const runBacktest = async () => {
                if (backtestRunning) return;
                setBacktestRunning(true);
                try {
                    const roster = (Array.isArray(playersData) ? playersData : []).filter(p => p.sport === selectedSport);
                    let evaluated = 0;

                    // Gather the raw series data ONCE (the async part), then expose
                    // a synchronous `runPass(acc)` that tallies it. That lets us
                    // run the walk-forward twice: pass 1 derives this sport's
                    // grade cutoffs, pass 2 re-tallies WITH those cutoffs so the
                    // grade distribution we show reflects them — not whatever was
                    // in GRADE_CUTOFFS from the previous run.
                    let runPass = null;

                    if (selectedSport === 'mlb') {
                        const seen = new Set();
                        const gathered = [];
                        for (const grp of chunk(roster.filter(p => !seen.has(p.id) && seen.add(p.id)), 6)) {
                            await Promise.all(grp.map(async p => {
                                const isPitcher = !!p._isPitcher || p.role === 'pitcher';
                                try {
                                    const data = await mlbFetch(`/people/${p.id}/stats?stats=gameLog&group=${isPitcher ? 'pitching' : 'hitting'}&season=${MLB_SEASON}`);
                                    const splits = (data.stats && data.stats[0] && data.stats[0].splits) || [];
                                    if (splits.length < 12) return;
                                    const opps = splits.map(sp => (sp.opponent && (mlbCache.current.abbrById[sp.opponent.id] || sp.opponent.name)) || '');
                                    gathered.push({ p, isPitcher, splits, opps });
                                } catch (e) { /* skip this player */ }
                            }));
                        }
                        runPass = (acc) => {
                            gathered.forEach(({ p, isPitcher, splits, opps }) => {
                                Object.keys(MLB_PROP_DEFS).forEach(k => {
                                    const def = MLB_PROP_DEFS[k];
                                    if (!!def.pitcher !== isPitcher) return;
                                    const vals = splits.map(sp => def.get(sp.stat || {}) || 0);
                                    if (vals.every(v => v === 0)) return;
                                    backtestSeries(vals, opps, 'mlb', p.position, acc);
                                    evaluated++;
                                });
                            });
                        };
                    } else if (selectedSport === 'nfl') {
                        const ids = [...new Set(roster.map(p => p.id))];
                        // one NFL season is only ~17 games — pull several so the
                        // walk-forward has a real sample.
                        const years = [NFL_SEASON - 1, NFL_SEASON - 2, NFL_SEASON - 3];
                        const glMap = await nflGamelogsMulti(ids, years);
                        runPass = (acc) => {
                            roster.forEach(p => {
                                const rows = glMap[p.id] || [];
                                if (rows.length < 10) return;
                                const opps = rows.map(r => r.opponent || '');
                                nflPosKeys(p.position).forEach(k => {
                                    const def = NFL_PROP_DEFS[k];
                                    const vals = rows.map(r => def.get(r.row) || 0);
                                    if (vals.every(v => v === 0)) return;
                                    backtestSeries(vals, opps, 'nfl', p.position, acc, 6);
                                    evaluated++;
                                });
                            });
                        };
                    } else if (selectedSport === 'nba') {
                        const ids = [...new Set(roster.map(p => p.id))];
                        const glMap = await nbaGamelogsMulti(ids, [NBA_YR_PREV, NBA_YR_PREV - 1]);
                        runPass = (acc) => {
                            roster.forEach(p => {
                                const rows = glMap[p.id] || [];
                                if (rows.length < 20) return;
                                const group = /^(PG|SG|G)$/i.test(p.position || '') ? 'G' : /^(SF|PF|F)$/i.test(p.position || '') ? 'F' : 'C';
                                const opps = rows.map(r => r.opponent || '');
                                const tss = rows.map(r => r.ts || 0);
                                const mins = rows.map(r => (r.row && r.row.minutes) || null);
                                const homes = rows.map(r => !/^@/.test(r.vsLabel || ''));
                                nbaAllKeys.forEach(k => {
                                    const vals = rows.map(r => NBA_PROP_DEFS[k].get(r.row) || 0);
                                    if (vals.every(v => v === 0)) return;
                                    nbaBacktestSeries(vals, mins, opps, tss, homes, group, k, acc);
                                    evaluated++;
                                });
                            });
                        };
                    } else {
                        setBacktestRunning(false);
                        return;
                    }

                    // Pass 1 — tally with whatever cutoffs / calibration are live,
                    // then derive this sport's own from pass-1 outcomes: grade
                    // cutoffs from the (cutoff-independent) gradeScore histogram,
                    // and the probability curve from the RAW-estimate buckets
                    // (acc1.probRaw, so it's always a raw→actual map).
                    const acc1 = emptyBacktestAcc();
                    runPass(acc1);
                    const cutoffs = deriveGradeCutoffs(acc1.score);
                    const probCal = deriveProbCalib(acc1.probRaw);

                    // Pass 2 — apply the new cutoffs + calibration and re-tally, so
                    // the reported grade hit-rates AND the probability-calibration
                    // table reflect THIS run's corrections (not the previous run's).
                    let acc = acc1;
                    if (cutoffs || probCal) {
                        if (cutoffs) {
                            GRADE_CUTOFFS = { ...GRADE_CUTOFFS, [selectedSport]: cutoffs };
                            try { localStorage.setItem('beatsedge_grade_cutoffs_v1', JSON.stringify(GRADE_CUTOFFS)); } catch (e) { }
                        }
                        if (probCal) {
                            PROB_CALIB = { ...PROB_CALIB, [selectedSport]: probCal };
                            try { localStorage.setItem('beatsedge_prob_calib_v1', JSON.stringify(PROB_CALIB)); } catch (e) { }
                        }
                        evaluated = 0;
                        acc = emptyBacktestAcc();
                        runPass(acc);
                        bumpEdgeCache();
                        setGradeVersion(v => v + 1); // invalidate memoized grades
                    }

                    const grades = {};
                    ['A', 'B', 'C', 'D'].forEach(g => {
                        const b = acc[g] || { n: 0, hit: 0 };
                        grades[g] = { n: b.n, hit: b.hit, rate: b.n ? Math.round((b.hit / b.n) * 100) : null };
                    });
                    const factors = {};
                    Object.entries(acc.factors).forEach(([name, b]) => {
                        if (b.n >= 30) factors[name] = { n: b.n, rate: Math.round((b.hit / b.n) * 100) };
                    });
                    // Probability calibration — the % the app SHOWS vs what
                    // actually landed (acc.prob is post-calibration). `probRaw`
                    // keeps the pre-calibration picture for the "before" note.
                    const prob = {}, probRaw = {};
                    BT_PROB_BUCKETS.forEach(k => {
                        const b = acc.prob[k];
                        if (b && b.n >= 20) prob[k] = { n: b.n, rate: Math.round((b.hit / b.n) * 100), mid: b.sumPct != null && b.n ? Math.round((b.sumPct / b.n) * 10) / 10 : BT_PROB_MID[k] };
                        const r = acc.probRaw[k];
                        if (r && r.n >= 20) probRaw[k] = { n: r.n, rate: Math.round((r.hit / r.n) * 100), mid: r.sumPct != null && r.n ? Math.round((r.sumPct / r.n) * 10) / 10 : BT_PROB_MID[k] };
                    });
                    // Factor confluence — hit rate by number of aligned factors.
                    const align = {};
                    Object.keys(acc.align).forEach(k => {
                        const b = acc.align[k];
                        if (b && b.n >= 20) align[k] = { n: b.n, rate: Math.round((b.hit / b.n) * 100), avgTotal: Math.round((b.totTot / b.n) * 10) / 10 };
                    });
                    // Grade × confluence cross-tab.
                    const gradeConf = {};
                    Object.keys(acc.gradeConf).forEach(k => {
                        const b = acc.gradeConf[k];
                        if (b && b.n >= 20) gradeConf[k] = { n: b.n, rate: Math.round((b.hit / b.n) * 100) };
                    });
                    // Confluence × model-edge cross-tab.
                    const confEdge = {};
                    Object.keys(acc.confEdge).forEach(k => {
                        const b = acc.confEdge[k];
                        if (b && b.n >= 20) confEdge[k] = { n: b.n, rate: Math.round((b.hit / b.n) * 100) };
                    });
                    // Full grade × confluence × edge (n>=15 — cells are thinner 3 deep).
                    const gce = {};
                    Object.keys(acc.gce).forEach(k => {
                        const b = acc.gce[k];
                        if (b && b.n >= 15) gce[k] = { n: b.n, rate: Math.round((b.hit / b.n) * 100) };
                    });
                    const result = {
                        sport: selectedSport, ranAt: Date.now(), seriesEvaluated: evaluated, cutoffs: cutoffs || null,
                        total: { n: acc._total.n, rate: acc._total.n ? Math.round((acc._total.hit / acc._total.n) * 100) : null },
                        grades, factors, prob, probRaw, align, gradeConf, confEdge, gce,
                        probCurve: (PROB_CALIB && PROB_CALIB[selectedSport]) || null
                    };
                    setBacktest(prev => {
                        const base = (prev && !prev.grades) ? prev : {}; // drop legacy single-object shape
                        const next = { ...base, [selectedSport]: result };
                        try { localStorage.setItem('beatsedge_backtest_v1', JSON.stringify(next)); } catch (e) { }
                        return next;
                    });
                } catch (e) {
                    console.error('Backtest failed:', e);
                } finally {
                    setBacktestRunning(false);
                }
            };

            const fetchPlayerProps = () => {
                // ⚠️ HONEST NOTE ON DATA SOURCES:
                // Player prop LINES (the actual over/under numbers PrizePicks,
                // FanDuel, and Underdog post) are proprietary sportsbook data.

            const ParlayBuilderModal = () => {
                if (!showParlayBuilder) return null;

                const parlayOdds = calculateParlayOdds();
                const combinedHitRate = selectedProps.length > 0

                return (
                    <div className="modal-overlay" onClick={() => setShowParlayBuilder(false)}>
                        <div className="modal" onClick={(e) => e.stopPropagation()}>

                                        <div style={{ fontSize: '1.2rem', fontWeight: 600, marginBottom: '0.5rem' }}>
                                            No props selected
                                        </div>
                                        <div style={{ fontSize: '0.9rem' }}>
                                            Select props with 80%+ hit rate to build your parlay
