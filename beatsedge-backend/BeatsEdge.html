                                        dataSource: 'Your backend (real nflverse data)',
                                        isRealByPosition: true
                                    }
                                };
                            }));
                        } catch (e) {
                            // This opponent keeps its sample defense numbers — no crash, no silent lie.
                        }
                    }
                    return;
                }

                const espnPath = ESPN_SPORT_PATHS[selectedSport];
                const isBasketball = selectedSport === 'nba' || selectedSport === 'wnba';
                const opponents = Array.from(new Set(players.map(p => p.opponent).filter(Boolean)));

                for (const teamAbbr of opponents) {
                    let realPpgAllowed = null;
                    let sourceLabel = null;
                    let realByPosition = null; // genuinely computed, not scaled — from your own backend

                    // 0) Your own backend (see beatsedge-backend/), if configured.
                    //    This is the ONLY source that returns real, computed
                    //    defense-by-position numbers rather than a scaled estimate.
                    if (backendUrl && isBasketball) {
                        try {
                            const season = '2025-26';
                            const url = `${backendUrl}/api/defense/combined/${selectedSport}/${season}/${teamAbbr}`;
                            const res = await fetch(url);
                            if (res.ok) {
                                const data = await res.json();
                                if (data.overall && typeof data.overall.oppPointsAllowed === 'number') {
                                    realPpgAllowed = data.overall.oppPointsAllowed;
                                    sourceLabel = data.overallSource || 'Your backend';
                                }
                                if (data.byPosition && Object.keys(data.byPosition).length > 0) {
                                    realByPosition = data.byPosition;
                                    sourceLabel = (sourceLabel ? sourceLabel + ' + ' : '') + 'Your backend (computed DvP)';
                                }
                                setBackendDataSource('live');
                                setBackendError(null);
                            }
                        } catch (e) {
                            setBackendDataSource('sample');
                            setBackendError('Could not reach backend at ' + backendUrl + ' — ' + e.message);
                        }
                    }

                    // 1) Best-effort: official league stats (NBA.com/WNBA.com for
                    //    basketball). Expected to fail in most browsers — see note above.
                    //    Skipped if the backend already gave us a real number.
                    if (isBasketball && realPpgAllowed === null) {
                        try {
                            const host = selectedSport === 'wnba' ? 'https://stats.wnba.com' : 'https://stats.nba.com';
                            const url = `${host}/stats/leaguedashteamstats?Season=2025-26&SeasonType=Regular+Season&PerMode=PerGame&MeasureType=Opponent`;
                            const data = await fetchJSONWithFallback(url);
                            const rs = data.resultSets && data.resultSets[0];
                            if (rs) {
                                const abbrevIdx = rs.headers.indexOf('TEAM_ABBREVIATION');
                                const oppPtsIdx = rs.headers.indexOf('OPP_PTS');
                                const row = rs.rowSet.find(r => r[abbrevIdx] === teamAbbr);
                                if (row && oppPtsIdx >= 0) {
                                    realPpgAllowed = row[oppPtsIdx];
                                    sourceLabel = selectedSport === 'wnba' ? 'WNBA.com' : 'NBA.com';
                                }
                            }
                        } catch (e) {
                            // Expected: stats.nba.com/wnba.com block headers a browser can't set.
                        }
                    }

                    // 2) ESPN — the source that reliably works from a browser.
                    //    Used standalone for football/college, and as a cross-check
                    //    (or primary fallback) for basketball.
                    try {
                        if (espnPath) {
                            const url = `https://site.api.espn.com/apis/site/v2/sports/${espnPath}/standings`;
                            const data = await fetchJSONWithFallback(url);
                            const entries = []
                                .concat((data.children || []).flatMap(c => (c.standings && c.standings.entries) || []))
                                .concat((data.standings && data.standings.entries) || []);
                            const entry = entries.find(e => e.team && e.team.abbreviation === teamAbbr);
                            if (entry) {
                                const stat = (entry.stats || []).find(s =>
                                    s.name === 'avgPointsAgainst' || s.abbreviation === 'PA' || s.name === 'pointsAgainst'
                                );
                                if (stat && typeof stat.value === 'number') {
                                    if (realPpgAllowed === null) {
                                        realPpgAllowed = stat.value;
                                        sourceLabel = 'ESPN';
                                    } else {
                                        sourceLabel = sourceLabel + ' + ESPN';
                                    }
                                }
                            }
                        }
                    } catch (e) {
                        // ESPN unreachable too — this opponent keeps its modeled/sample numbers.
                    }

                    if (realPpgAllowed !== null || realByPosition !== null) {
                        setPlayersData(prev => prev.map(p => {
                            if (p.opponent !== teamAbbr || !p.opponentDefense) return p;

                            let finalByPosition;
                            if (realByPosition) {
                                // Genuinely computed per-position data from your own backend —
                                // use it directly, no scaling/estimating needed.
                                finalByPosition = { ...p.opponentDefense.byPosition };
                                Object.entries(realByPosition).forEach(([pos, stats]) => {
                                    if (finalByPosition[pos]) {
                                        finalByPosition[pos] = { ...finalByPosition[pos], ...stats };
                                    }
                                });
                            } else {
                                // Fallback: scale the estimate by the real overall number.
                                const oldPpg = p.opponentDefense.overall.ppg || realPpgAllowed;
                                const scale = oldPpg ? (realPpgAllowed / oldPpg) : 1;
                                finalByPosition = {};
                                Object.entries(p.opponentDefense.byPosition).forEach(([pos, stats]) => {
                                    finalByPosition[pos] = {
                                        ...stats,
                                        pointsAllowed: Math.round(stats.pointsAllowed * scale * 10) / 10
                                    };
                                });
                            }

                            return {
                                ...p,
                                opponentDefense: {
                                    ...p.opponentDefense,
                                    overall: realPpgAllowed !== null
                                        ? { ...p.opponentDefense.overall, ppg: Math.round(realPpgAllowed * 10) / 10 }
                                        : p.opponentDefense.overall,
                                    byPosition: finalByPosition,
                                    dataSource: sourceLabel,
                                    isRealByPosition: !!realByPosition
                                }
                            };
                        }));
                    }
                }
            };

            // ============================================================
            // BALLDONTLIE — real season averages + game log
            // ============================================================
            // Free tier requires your own key (5 req/min, core NBA endpoints).
            // Powers the L5/L10/season pieces of the edge engine with real
            // numbers instead of sample data, when a key is provided.
            const BDL_BASE = 'https://api.balldontlie.io/v1';

            const bdlFetch = async (path) => {
                const res = await fetch(`${BDL_BASE}${path}`, {
                    headers: { 'Authorization': balldontlieKey }
                });
                if (res.status === 401) throw new Error('Invalid or missing BallDontLie API key');
                if (res.status === 429) throw new Error('BallDontLie rate limit hit (free tier: 5 req/min) — try again shortly');
                if (!res.ok) throw new Error('BallDontLie HTTP ' + res.status);
                return res.json();
            };

            const fetchBallDontLieStats = async (players) => {
                if (!balldontlieKey || selectedSport !== 'nba') {
                    setStatsDataSource(balldontlieKey ? 'sample' : 'sample');
                    return;
                }

                try {
                    setBdlError(null);
                    for (const player of players) {
                        // 1) Find the player's BallDontLie ID by name
                        const [firstName, ...rest] = player.name.split(' ');
                        const lastName = rest.join(' ');
                        const searchData = await bdlFetch(`/players?search=${encodeURIComponent(lastName || player.name)}`);
                        const match = (searchData.data || []).find(p =>
                            `${p.first_name} ${p.last_name}`.toLowerCase() === player.name.toLowerCase()
                        ) || (searchData.data || [])[0];

                        if (!match) continue;

                        // 2) Real season average
                        const seasonData = await bdlFetch(`/season_averages?season=2025&player_ids[]=${match.id}`);
                        const seasonStats = (seasonData.data || [])[0];

                        // 3) Real recent game log (used for L5/L10)
                        const statsData = await bdlFetch(`/stats?player_ids[]=${match.id}&seasons[]=2025&per_page=20`);
                        const games = (statsData.data || [])
                            .filter(g => g.min && g.min !== '00' && g.min !== '0')
                            .sort((a, b) => new Date(b.game.date) - new Date(a.game.date));

                        if (games.length === 0 && !seasonStats) continue;

                        const avgOf = (arr, key) => arr.length ? Math.round((arr.reduce((s, g) => s + (g[key] || 0), 0) / arr.length) * 10) / 10 : null;

                        const updates = {};
                        if (games.length) {
                            const l5 = games.slice(0, 5);
                            const l10 = games.slice(0, 10);
                            updates.last5 = { hitRate: player.stats.last5.hitRate, avg: avgOf(l5, 'pts'), games: l5.length };
                            updates.last10 = { hitRate: player.stats.last10.hitRate, avg: avgOf(l10, 'pts'), games: l10.length };
                        }
                        if (seasonStats) {
                            updates.season = { hitRate: player.stats.season.hitRate, avg: seasonStats.pts, games: seasonStats.games_played };
                        }

                        setPlayersData(prev => prev.map(p => {
                            if (p.id !== player.id) return p;
                            return {
                                ...p,
                                stats: { ...p.stats, ...updates },
                                statsSource: 'BallDontLie (live)'
                            };
                        }));
                    }
                    setStatsDataSource('live');
                } catch (err) {
                    console.warn('BallDontLie fetch failed, keeping sample stats:', err.message);
                    setStatsDataSource('sample');
                    setBdlError(err.message);
                }
            };

            // Real back-to-back and home/away splits, from your own backend
            // (see beatsedge-backend/lib/situationalEngine.js) — computed by
            // joining actual box scores to the actual schedule, not modeled.
            // Requires the "Your Backend" URL to be set in Data Sources.
            // `isHomeTonight` / `isBackToBackTonight` on each mock player are
            // placeholders for demo purposes — in production these come from
            // the ESPN scoreboard fetch already wired in above, which reports
            // home/away directly per game.
            const fetchPlayerSituationalData = async (players) => {
                if (!backendUrl || selectedSport !== 'nba') return;

                for (const player of players) {
                    try {
                        const url = `${backendUrl}/api/player/situational/${encodeURIComponent(player.name)}`;
                        const res = await fetch(url);
                        if (!res.ok) continue;
                        const data = await res.json();

                        setPlayersData(prev => prev.map(p => {
                            if (p.id !== player.id) return p;
                            return { ...p, situational: data };
                        }));
                    } catch (e) {
                        // This player's situational data just isn't available — the
                        // Edge Score engine already treats missing situational data
                        // as "omit these factors", not an error state.
                    }
                }
            };

            // ============================================================
            // MLB REAL FULL SLATE — statsapi.mlb.com (keyless, CORS-open)
            // ============================================================
            // Replaces the 2 hand-picked MLB sample players with every
            // probable pitcher + every lineup hitter for the selected date's
            // real games. Identity, positions, matchups, season stats, and
            // L5/L10 recent form are all REAL. Prop LINES are still sample
            // values — anchored to each player's real season production —
            // because no free source publishes real sportsbook prop lines
            // (same honest limitation as every other sport in this app).
            //
            // One primary prop per player for this pass (Total Bases for
            // hitters, Strikeouts for pitchers), kept in that player's real
            // stat unit so the Edge Score engine's math stays coherent.
            // Multi-prop-per-player needs per-prop stat windows — that's a
            // later roadmap step (frontend/backend stat matching), not faked
            // in here.
            const MLB_API = 'https://statsapi.mlb.com/api/v1';
            const MLB_SEASON = new Date(selectedDate + 'T12:00:00').getFullYear();
            const mlbHeadshot = (id) => `https://img.mlbstatic.com/mlb-photos/image/upload/w_120,q_auto:best/v1/people/${id}/headshot/67/current`;
            const roundHalf = (n) => Math.round(n * 2) / 2;
            const round1 = (n) => Math.round(n * 10) / 10;
            const num = (v) => { const f = parseFloat(v); return Number.isFinite(f) ? f : null; };
            // Rough placeholder hit-rate until the real per-game series is
            // pulled on card-expand. Not shown as authoritative anywhere the
            // real number would be.
            const estHitRate = (avg, line) => Math.max(15, Math.min(90, Math.round(50 + (avg - line) * 22)));

            // Small caches / lookups populated during a slate build.
            const mlbCache = React.useRef({ rosters: {}, abbrById: {} });

            const mlbFetch = async (path) => {
                const res = await fetch(`${MLB_API}${path}`);
                if (!res.ok) throw new Error('MLB API HTTP ' + res.status + ' — ' + path);
                return res.json();
            };
            const chunk = (arr, n) => { const o = []; for (let i = 0; i < arr.length; i += n) o.push(arr.slice(i, i + n)); return o; };

            const HITTER_POS_TYPES = new Set(['Catcher', 'First Base', 'Second Base', 'Third Base', 'Shortstop', 'Infielder', 'Outfielder', 'Designated Hitter', 'Hitter', 'Two-Way Player']);

            // Pull season hitting + pitching for a batch of person ids in one call.
            const mlbSeasonStatsFor = async (ids) => {
                const map = {};
                for (const group of chunk(Array.from(new Set(ids.filter(Boolean))), 40)) {
                    const data = await mlbFetch(`/people?personIds=${group.join(',')}&hydrate=stats(group=[hitting,pitching],type=[season],season=${MLB_SEASON})`);
                    (data.people || []).forEach(p => {
                        const entry = { id: p.id, name: p.fullName, position: p.primaryPosition, hit: null, pitch: null };
                        (p.stats || []).forEach(s => {
                            const stat = s.splits && s.splits[0] && s.splits[0].stat;
                            if (!stat) return;
                            if (s.group && s.group.displayName === 'pitching') entry.pitch = stat;
                            else if (s.group && s.group.displayName === 'hitting') entry.hit = stat;
                        });
                        map[p.id] = entry;
                    });
                }
                return map;
            };

            // Build one player object in the same shape generateMockPlayerData
            // produces, so PlayerCard / calculateEdgeScore / TopPicksView all
            // work unchanged.
            const buildMlbPlayer = (slot, people, teamBattingByTeamId) => {
                const me = people[slot.personId];
                if (!me) return null;
                const common = {
                    id: slot.personId,
                    sport: 'mlb',
                    role: slot.role,
                    name: me.name,
                    team: slot.teamAbbr,
                    opponent: slot.oppAbbr,
                    teamId: slot.teamId,
                    oppTeamId: slot.oppTeamId,
                    gamePk: slot.gamePk,
                    position: (me.position && me.position.abbreviation) || slot.position || (slot.role === 'pitcher' ? 'P' : '-'),
                    gameTime: slot.gameTime,
                    status: 'ACTIVE',
                    injury: null,
                    isHomeTonight: !!slot.isHome,
                    paceRating: 'neutral',
                    paceDetail: 'No pace-equivalent factor for MLB in this pass',
                    headshot: mlbHeadshot(slot.personId),
                    minutesTrend: 0,
                    gameLog: [],
                    _detailLoaded: false
                };

                if (slot.role === 'pitcher') {
                    const ps = me.pitch || {};
                    const gs = ps.gamesStarted || ps.gamesPlayed || 0;
                    const kPerStart = gs > 0 ? ps.strikeOuts / gs : 0;
                    const avg = round1(kPerStart);
                    // SAMPLE line anchored to the pitcher's own season K/start
                    // rate (rounded to .5). Edge then comes from recent form and
                    // the opposing lineup, not from the line being soft — so the
                    // A/B/C/D grade actually discriminates. Still a sample line.
                    const line = Math.max(3.5, roundHalf(kPerStart));
                    const hr = estHitRate(avg, line);
                    const seedWin = (games) => ({ hitRate: hr, avg, games: games || gs });
                    const tb = teamBattingByTeamId[slot.oppTeamId] || null;
                    return {
                        ...common,
                        props: [{ type: 'Strikeouts', statKey: 'strikeouts', line, hitRate: hr, odds: -110, direction: 'over' }],
                        stats: {
                            recent: { hitRate: hr, avg, median: Math.round(kPerStart), range: [Math.max(0, Math.floor(kPerStart - 4)), Math.ceil(kPerStart + 5)], games: gs },
                            last5: seedWin(5), last10: seedWin(10), last20: seedWin(20),
                            season: seedWin(gs), vsOpp: seedWin(0)
                        },
                        statsSource: 'statsapi.mlb.com — season (real); recent form loading',
                        opponentContext: tb ? { teamBatting: tb } : {},
                        matchupDataSource: tb ? 'statsapi.mlb.com — real opposing lineup profile' : null,
                        opponentDefense: null
                    };
                }

                // batter
                const hs = me.hit || {};
                const g = hs.gamesPlayed || 0;
                const tbPerGame = g > 0 ? (hs.totalBases || 0) / g : 0;
                const avg = round1(tbPerGame);
                // SAMPLE line anchored to the hitter's own season TB/game rate
                // (rounded to .5, floor 1.5). Projecting the edge off recent
                // form + the opposing pitcher rather than off a soft flat line
                // is what makes the A/B/C/D grade mean something. Still a
                // sample line — no free source publishes real prop lines.
                const line = Math.max(1.5, roundHalf(tbPerGame));
                const hr = estHitRate(avg, line);
                const seedWin = (games) => ({ hitRate: hr, avg, games: games || g });
                const opp = people[slot.oppPitcherId];
                const ops = opp && opp.pitch;
                let pitcherCtx = null;
                if (ops && num(ops.inningsPitched) > 0) {
                    pitcherCtx = {
                        id: slot.oppPitcherId,
                        name: slot.oppPitcherName || (opp && opp.name) || 'Opposing Starter',
                        era: num(ops.era),
                        whip: num(ops.whip),
                        kPer9: round1((ops.strikeOuts / num(ops.inningsPitched)) * 9)
                    };
                }
                return {
                    ...common,
                    props: [{ type: 'Total Bases', statKey: 'totalBases', line, hitRate: hr, odds: -120, direction: 'over' }],
                    stats: {
                        recent: { hitRate: hr, avg, median: Math.round(tbPerGame), range: [0, Math.max(4, Math.ceil(tbPerGame * 3))], games: g },
                        last5: seedWin(5), last10: seedWin(10), last20: seedWin(20),
                        season: seedWin(g), vsOpp: seedWin(0)
                    },
                    statsSource: 'statsapi.mlb.com — season (real); recent form loading',
                    opponentContext: pitcherCtx
                        ? { pitcher: pitcherCtx }
                        : { pitcherName: slot.oppPitcherName || null },
                    matchupDataSource: pitcherCtx ? 'statsapi.mlb.com — real probable pitcher' : null,
                    opponentDefense: null
                };
            };

            const fetchMlbSlate = async (date) => {
                const cache = mlbCache.current;
                cache.abbrById = {};
                const sched = await mlbFetch(`/schedule?sportId=1&date=${date}&hydrate=probablePitcher,lineups,team`);
                const games = (sched.dates && sched.dates[0] && sched.dates[0].games) || [];
                if (!games.length) return [];

                // Register team abbreviations for gamelog opponent resolution.
                games.forEach(gm => {
                    ['home', 'away'].forEach(side => {
                        const t = gm.teams[side].team;
                        if (t && t.id) cache.abbrById[t.id] = t.abbreviation || t.name;
                    });
                });

                const slots = [];
                const rosterNeeded = new Set();

                for (const gm of games) {
                    const when = new Date(gm.gameDate);
                    const gameTime = when.toLocaleString([], { weekday: 'short', hour: 'numeric', minute: '2-digit' })
                        + (gm.status && gm.status.detailedState && gm.status.detailedState !== 'Scheduled' && gm.status.detailedState !== 'Warmup'
                            ? ` · ${gm.status.detailedState}` : '');
                    const sides = [
                        { side: 'home', teamKey: 'home', oppKey: 'away', isHome: true },
                        { side: 'away', teamKey: 'away', oppKey: 'home', isHome: false }
                    ];
                    for (const s of sides) {
                        const meT = gm.teams[s.teamKey].team;
                        const oppT = gm.teams[s.oppKey].team;
                        const myProb = gm.teams[s.teamKey].probablePitcher;
                        const oppProb = gm.teams[s.oppKey].probablePitcher;
                        const base = {
                            teamAbbr: meT.abbreviation, teamId: meT.id,
                            oppAbbr: oppT.abbreviation, oppTeamId: oppT.id,
                            gamePk: String(gm.gamePk), isHome: s.isHome, gameTime
                        };

                        if (myProb && myProb.id) {
                            slots.push({ ...base, personId: String(myProb.id), role: 'pitcher', position: 'SP' });
                        }

                        const lineup = gm.lineups && gm.lineups[s.side + 'Players'];
                        if (Array.isArray(lineup) && lineup.length) {
                            lineup.forEach(pl => slots.push({
                                ...base, personId: String(pl.id), role: 'batter',
                                position: pl.primaryPosition && pl.primaryPosition.abbreviation,
                                oppPitcherId: oppProb && oppProb.id ? String(oppProb.id) : null,
                                oppPitcherName: oppProb && oppProb.fullName
                            }));
                        } else {
                            rosterNeeded.add(JSON.stringify({ tId: meT.id, ...base, oppPitcherId: oppProb && oppProb.id ? String(oppProb.id) : null, oppPitcherName: oppProb && oppProb.fullName }));
                        }
                    }
                }

                // Lineups not posted yet (future games) — fall back to the
                // team's active roster, position players only.
                for (const raw of rosterNeeded) {
                    const info = JSON.parse(raw);
                    let roster = cache.rosters[info.tId];
                    if (!roster) {
                        try {
                            const r = await mlbFetch(`/teams/${info.tId}/roster?rosterType=active`);
                            roster = r.roster || [];
                            cache.rosters[info.tId] = roster;
                        } catch (e) { roster = []; }
                    }
                    roster
                        .filter(p => p.position && HITTER_POS_TYPES.has(p.position.type))
                        .forEach(p => slots.push({
                            teamAbbr: info.teamAbbr, teamId: info.tId, oppAbbr: info.oppAbbr, oppTeamId: info.oppTeamId,
                            gamePk: info.gamePk, isHome: info.isHome, gameTime: info.gameTime,
                            personId: String(p.person.id), role: 'batter',
                            position: p.position.abbreviation,
                            oppPitcherId: info.oppPitcherId, oppPitcherName: info.oppPitcherName
                        }));
                }

                // Real league-wide team batting (for pitcher matchup context + rank).
                let teamBattingByTeamId = {};
                try {
                    const tstats = await mlbFetch(`/teams/stats?stats=season&group=hitting&season=${MLB_SEASON}&sportIds=1`);
                    const splits = (tstats.stats && tstats.stats[0] && tstats.stats[0].splits) || [];
                    const rows = splits.map(sp => {
                        const st = sp.stat || {};
                        const pa = st.plateAppearances || st.atBats || 1;
                        return {
                            teamId: sp.team && sp.team.id,
                            teamAvg: num(st.avg),
                            kRate: st.strikeOuts != null ? st.strikeOuts / pa : null,
                            runsPerGame: st.gamesPlayed ? round1(st.runs / st.gamesPlayed) : null
                        };
                    });
                    const ranked = [...rows].filter(r => r.kRate != null).sort((a, b) => a.kRate - b.kRate);
                    ranked.forEach((r, i) => { r.rank = i + 1; });
                    rows.forEach(r => { teamBattingByTeamId[r.teamId] = r; });
                } catch (e) { /* pitcher cards just omit rank/lineup context */ }

                // One batched season-stats fetch for everyone on the slate,
                // plus the opposing probable pitchers referenced by hitters.
                const ids = [];
                slots.forEach(s => { ids.push(s.personId); if (s.oppPitcherId) ids.push(s.oppPitcherId); });
                const people = await mlbSeasonStatsFor(ids);

                // De-dupe (a hitter can appear once per game only, but guard anyway).
                const seen = new Set();
                const players = [];
                for (const slot of slots) {
                    const key = slot.personId + ':' + slot.role;
                    if (seen.has(key)) continue;
                    seen.add(key);
                    const built = buildMlbPlayer(slot, people, teamBattingByTeamId);
                    if (!built) continue;
                    // Drop hitters with no real season signal (September call-ups,
                    // bench arms listed as position players, etc.).
                    if (built.role === 'batter' && (!people[slot.personId].hit || (people[slot.personId].hit.gamesPlayed || 0) < 15)) continue;
                    players.push(built);
                }

                // Pitchers first, then by game time, then name — a stable,
                // readable order until sorting/filters land (Phase 2).
                players.sort((a, b) =>
                    (a.role === b.role ? 0 : a.role === 'pitcher' ? -1 : 1) ||
                    String(a.gameTime).localeCompare(String(b.gameTime)) ||
                    a.name.localeCompare(b.name));
                return players;
            };

            // Layer real L5 / L10 recent-form averages (in each player's prop
            // unit) on top of the season-seeded numbers, in two batched calls.
            const warmMlbSlateForm = async (players) => {
                const wantGroups = {}; // id -> 'hitting' | 'pitching'
                players.forEach(p => { wantGroups[p.id] = p.role === 'pitcher' ? 'pitching' : 'hitting'; });
                const ids = Object.keys(wantGroups);

                const fetchWindow = async (limit) => {
                    const map = {};
                    for (const group of chunk(ids, 40)) {
                        try {
                            const data = await mlbFetch(`/people?personIds=${group.join(',')}&hydrate=stats(group=[hitting,pitching],type=[lastXGames],limit=${limit},season=${MLB_SEASON})`);
                            (data.people || []).forEach(p => {
                                (p.stats || []).forEach(s => {
                                    const stat = s.splits && s.splits[0] && s.splits[0].stat;
                                    if (stat && s.group) map[p.id + ':' + s.group.displayName] = stat;
                                });
                            });
                        } catch (e) { /* leave season-seeded */ }
                    }
                    return map;
                };

                const [l5, l10] = await Promise.all([fetchWindow(5), fetchWindow(10)]);

                const winAvg = (stat, role) => {
                    if (!stat) return null;
                    if (role === 'pitcher') {
                        const gs = stat.gamesStarted || stat.gamesPlayed || 0;
                        return gs > 0 ? round1(stat.strikeOuts / gs) : null;
                    }
                    const g = stat.gamesPlayed || 0;
                    return g > 0 ? round1((stat.totalBases || 0) / g) : null;
                };

                setPlayersData(prev => prev.map(p => {
                    if (p.sport !== 'mlb') return p;
                    const grp = wantGroups[p.id];
                    const a5 = winAvg(l5[p.id + ':' + grp], p.role);
                    const a10 = winAvg(l10[p.id + ':' + grp], p.role);
                    if (a5 == null && a10 == null) return p;
                    const line = p.props[0].line;
                    const next = { ...p.stats };
                    if (a5 != null) next.last5 = { ...next.last5, avg: a5, hitRate: estHitRate(a5, line) };
                    if (a10 != null) {
                        next.last10 = { ...next.last10, avg: a10, hitRate: estHitRate(a10, line) };
                        next.recent = { ...next.recent, avg: a10 };
                    }
                    return { ...p, stats: next, statsSource: 'statsapi.mlb.com — season + L5/L10 (real)' };
                }));
            };

            // ============================================================
            // PropLine — real prop LINES (prop-line.com). Requires a key
            // (Data Sources settings). Replaces the season-anchored SAMPLE
            // line on each MLB player's single prop with a real book line.
            // PropLine's player_id is the statsapi id ("mlb:682829"), so the
            // join is exact — no name matching.
            //
            // api.prop-line.com sends NO Access-Control-Allow-Origin, so a
            // browser can't call it directly. It's routed through your
            // beatsedge-backend's /api/propline/* passthrough (which adds CORS).
            // So this needs BOTH a PropLine key AND "Your Backend" URL set.
            // ============================================================
            // Sharp sportsbooks first, then the DFS apps this app is themed
            // around. First book in this list that has a line for a player wins.
            const PROPLINE_BOOK_PRIORITY = ['draftkings', 'fanduel', 'betmgm', 'betrivers', 'caesars', 'pinnacle', 'prizepicks', 'underdog', 'sleeper', 'bovada'];

            const fetchMlbPropLines = async (players) => {
                if (!backendUrl) {
                    setPropLineSource('sample');
                    setProplineError('PropLine has no CORS — set "Your Backend" URL too so it can be proxied.');
                    return;
                }
                const plFetch = async (path) => {
                    // path like "/v1/sports/baseball_mlb/events" -> proxied
                    const [p, q] = path.replace(/^\//, '').split('?');
                    const url = `${backendUrl}/api/propline/${p}?apiKey=${encodeURIComponent(proplineKey)}${q ? '&' + q : ''}`;
                    const r = await fetch(url);
                    if (r.status === 401 || r.status === 403) throw new Error(`PropLine key rejected (HTTP ${r.status})`);
                    if (r.status === 429) throw new Error('PropLine rate limit hit — try again later');
                    if (!r.ok) throw new Error('PropLine HTTP ' + r.status);
                    return r.json();
                };

                // 1. PropLine events -> match to our slate games by MLB team-id pair
                //    (PropLine uses "mlb:145" = the same statsapi team id).
                const events = await plFetch('/v1/sports/baseball_mlb/events');
                const evByPair = {};
                (Array.isArray(events) ? events : []).forEach(ev => {
                    const h = String(ev.home_team_id || '').replace('mlb:', '');
                    const a = String(ev.away_team_id || '').replace('mlb:', '');
                    if (h && a) { evByPair[h + '-' + a] = ev.id; evByPair[a + '-' + h] = ev.id; }
                });

                const wantEventIds = new Set();
                const seenGames = new Set();
                players.forEach(p => {
                    if (seenGames.has(p.gamePk)) return;
                    seenGames.add(p.gamePk);
                    const eid = evByPair[String(p.teamId) + '-' + String(p.oppTeamId)];
                    if (eid) wantEventIds.add(eid);
                });
                if (!wantEventIds.size) { setPropLineSource('sample'); setProplineError('No PropLine events matched tonight\'s games.'); return; }

                // 2. One odds call per matched game (batter TB + pitcher K).
                const books = PROPLINE_BOOK_PRIORITY.join(',');
                const linesByPid = {}; // '682829' -> { totalBases:{line,over,under,book}, strikeouts:{...} }
                await Promise.all([...wantEventIds].map(async eid => {
                    try {
                        const data = await plFetch(`/v1/sports/baseball_mlb/events/${eid}/odds?markets=batter_total_bases,pitcher_strikeouts&bookmakers=${books}`);
                        (data.bookmakers || []).forEach(bm => {
                            const rank = PROPLINE_BOOK_PRIORITY.indexOf(bm.key);
                            (bm.markets || []).forEach(m => {
                                const stat = m.key === 'batter_total_bases' ? 'totalBases'
                                    : (m.key === 'pitcher_strikeouts' ? 'strikeouts' : null);
                                if (!stat) return;
                                const over = (m.outcomes || []).find(o => o.name === 'Over');
                                const under = (m.outcomes || []).find(o => o.name === 'Under');
                                if (!over || over.point == null) return;
                                const pid = String(over.player_id || '').replace('mlb:', '');
                                if (!pid) return;
                                const cand = {
                                    line: over.point, over: over.price, under: under ? under.price : null,
                                    book: bm.key, rank: rank < 0 ? 99 : rank,
                                    juice: Math.abs(over.price || 0) // main line has price closest to even; alternates are juiced
                                };
                                const cur = linesByPid[pid] || (linesByPid[pid] = {});
                                const ex = cur[stat];
                                if (!ex || cand.rank < ex.rank || (cand.rank === ex.rank && cand.juice < ex.juice)) {
                                    cur[stat] = cand;
                                }
                            });
                        });
                    } catch (e) { /* this game keeps its sample lines */ }
                }));

                // 3. Merge onto each player's single prop.
                const realFor = (p) => {
                    if (p.sport !== 'mlb' || !p.props || !p.props.length) return null;
                    const k = p.props[0].statKey === 'totalBases' ? 'totalBases'
                        : (p.props[0].statKey === 'strikeouts' ? 'strikeouts' : null);
                    if (!k) return null;
                    return (linesByPid[String(p.id)] || {})[k] || null;
                };
                const matched = players.filter(realFor).length;

                setPlayersData(prev => prev.map(p => {
                    const real = realFor(p);
                    if (!real) return p;
                    const prop = {
                        ...p.props[0],
                        line: real.line,
                        odds: real.over,
                        underOdds: real.under,
                        hitRate: estHitRate(p.stats.season.avg, real.line),
                        lineSource: `PropLine · ${real.book}`
                    };
                    return { ...p, props: [prop], realPropLine: true, _detailLoaded: false };
                }));
                setPropLineSource(matched > 0 ? 'live' : 'sample');
                setProplineError(matched > 0 ? null
                    : 'PropLine reached, but no lines matched tonight\'s slate (games may already be final).');
            };

            // On card-expand: pull the real per-game series and compute real
            // hit rates per window, a real game-log chart, and the real
            // vs-opponent split. Runs once per player.
            const fetchMlbPlayerDetail = async (player) => {
                const group = player.role === 'pitcher' ? 'pitching' : 'hitting';
                const statKey = player.role === 'pitcher' ? 'strikeOuts' : 'totalBases';
                let splits;
                try {
                    const data = await mlbFetch(`/people/${player.id}/stats?stats=gameLog&group=${group}&season=${MLB_SEASON}`);
                    splits = (data.stats && data.stats[0] && data.stats[0].splits) || [];
                } catch (e) { return; }
                if (!splits.length) {
                    setPlayersData(prev => prev.map(p => p.id === player.id && p.role === player.role ? { ...p, _detailLoaded: true } : p));
                    return;
                }

                const abbrById = mlbCache.current.abbrById;
                const series = splits.map(sp => ({
                    date: (sp.date || '').slice(5).replace('-', '/'),
                    rawDate: sp.date,
                    opponent: (sp.opponent && (abbrById[sp.opponent.id] || sp.opponent.name)) || '',
                    oppId: sp.opponent && sp.opponent.id,
                    value: (sp.stat && sp.stat[statKey]) || 0
                }));
                const line = player.props[0].line;
                const hitRateOf = (arr) => arr.length ? Math.round((arr.filter(v => v > line).length / arr.length) * 100) : null;
                const vals = series.map(s => s.value);
                const lastN = (n) => vals.slice(-n);
                const mean = (arr) => arr.length ? round1(arr.reduce((s, v) => s + v, 0) / arr.length) : null;
                const sorted = [...vals].sort((a, b) => a - b);
                const median = sorted.length ? sorted[Math.floor(sorted.length / 2)] : 0;
                const oppVals = series.filter(s => s.opponent === player.opponent).map(s => s.value);

                const gameLog = series.slice(-10).map(s => ({ date: s.date, opponent: s.opponent, points: s.value, line }));

                setPlayersData(prev => prev.map(p => {
                    if (p.id !== player.id || p.role !== player.role) return p;
                    const s = { ...p.stats };
                    s.last5 = { ...s.last5, avg: mean(lastN(5)), hitRate: hitRateOf(lastN(5)) };
                    s.last10 = { ...s.last10, avg: mean(lastN(10)), hitRate: hitRateOf(lastN(10)) };
                    s.last20 = { ...s.last20, avg: mean(lastN(20)), hitRate: hitRateOf(lastN(20)) };
                    s.season = { ...s.season, avg: mean(vals), hitRate: hitRateOf(vals), games: vals.length };
                    s.recent = { ...s.recent, avg: mean(lastN(10)), median, range: [sorted[0] || 0, sorted[sorted.length - 1] || 0], games: vals.length };

                                        <div className="defense-source-note">
                                            Overall PPG: {player.opponentDefense.dataSource ? `🟢 Live — ${player.opponentDefense.dataSource}` : '🟡 Sample data'}.{' '}
                                            {player.opponentDefense.isRealByPosition
                                                ? 'Position splits below are computed from real box scores by your own backend — not an estimate.'
                                                : 'Position splits below are a modeled estimate — no free source (NBA.com, WNBA.com, or ESPN) publishes defense allowed by position directly. Connect your own backend (Data Sources settings) for real computed numbers.'}
                                        </div>

                                        <div className="defense-stats-grid">
                                            {(POSITIONS_BY_SPORT[player.sport || 'nba'] || POSITIONS_BY_SPORT.nba)
                                                .filter(pos => player.opponentDefense.byPosition[pos]).map((position) => {
                                                const stats = player.opponentDefense.byPosition[position];
                                                const displayFields = getDefenseDisplayFields(player.sport || 'nba', position);
                                                // Rank colored: Green (20+), Yellow (10-19), Red (<10)
                                                const rankTier = stats.rank >= 20 ? 'green' : (stats.rank >= 10 ? 'yellow' : 'red');
                                                const isFavorable = rankTier === 'green';
                                                return (
                                                    <div key={position} className="defense-stat-card">
                                                        <div className="defense-position">{position}</div>

                                                        {displayFields.map(field => (
                                                            <div className="defense-stat-row" key={field.key}>
                                                                <div className="defense-stat-label">{field.label}</div>
                                                                <div className="defense-stat-value">
                                                                    {stats[field.key] !== undefined ? stats[field.key] : '—'}
                                                                </div>
                                                            </div>
                                                        ))}

                                                        <div className="defense-stat-row" style={{ borderBottom: 'none', paddingTop: '0.6rem' }}>
                                                            <div className="defense-stat-label">League Rank</div>
                                                            <span className={`defense-rank-badge ${rankTier}`}>
                                                                #{stats.rank}
                                                            </span>
                                                        </div>

                                                        {isFavorable && (
                                                            <div style={{ 
                                                                marginTop: '0.6rem', 
                                                                paddingTop: '0.6rem', 
                                                                borderTop: '1px solid var(--border-color)' 
                                                            }}>
                                                                <span className="defense-trend-indicator favorable">
                                                                    ✓ Favorable Matchup
                                                                </span>
                                                            </div>
                                                        )}
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}
                    </div>
                );
            };

            const SettingsModal = () => {
                if (!showSettings) return null;
                return (
                    <div className="modal-overlay" onClick={() => setShowSettings(false)}>
                        <div className="modal" onClick={(e) => e.stopPropagation()}>
                            <div className="modal-header">
                                <div className="modal-title">Data Sources</div>
                                <button className="close-btn" onClick={() => setShowSettings(false)}>×</button>
                            </div>
                            <div className="settings-modal-body">
                                <div className="settings-source-row">
                                    <div className="settings-source-name">
                                        <span>Your Backend (real defense-vs-position)</span>
                                        <span className={`source-pill ${backendDataSource}`}>
                                            {backendDataSource === 'live' ? '🟢 LIVE' : (backendDataSource === 'sample' ? '🟡 NOT CONNECTED' : '⏳ CHECKING')}
                                        </span>
                                    </div>
                                    <input
                                        type="text"
                                        className="settings-input"
                                        placeholder="https://your-app.onrender.com"
                                        value={backendUrlInput}
                                        onChange={(e) => setBackendUrlInput(e.target.value)}
                                    />
                                    <div className="settings-note">
                                        Deploy the free beatsedge-backend (see its README) to Render, then paste
                                        the URL here. This is the ONLY source that gives you real, computed
                                        points/rebounds/assists allowed by position — not an estimate.
                                    </div>
                                    {backendError && <div className="settings-error">⚠ {backendError}</div>}
                                    <button
                                        className="settings-save-btn"
                                        onClick={() => { saveBackendUrl(backendUrlInput); setShowSettings(false); }}
                                    >
                                        Save & Refresh
                                    </button>
                                </div>

                                <div className="settings-source-row">
                                    <div className="settings-source-name">
                                        <span>PropLine (real MLB prop lines)</span>
                                        <span className={`source-pill ${propLineSource === 'live' ? 'live' : (propLineSource === 'sample' ? 'sample' : 'checking')}`}>
                                            {propLineSource === 'live' ? '🟢 LIVE' : (propLineSource === 'sample' ? '🟡 NOT ACTIVE' : '⏳ CHECKING')}
                                        </span>
                                    </div>
                                    <input
                                        type="text"
                                        className="settings-input"
                                        placeholder="Paste your PropLine API key"
                                        value={proplineKeyInput}
                                        onChange={(e) => setProplineKeyInput(e.target.value)}
                                    />
                                    <div className="settings-note">
                                        Get a key at prop-line.com. Stored only in this browser's local storage.
                                        PropLine has no browser CORS, so it's proxied through your backend —
                                        <strong> "Your Backend" URL above must also be set</strong>. Replaces the
                                        sample MLB prop lines (Total Bases / Strikeouts) with real book lines,
                                        joined by MLB player id. Only games that haven't finished have live lines.
                                    </div>
                                    {proplineError && <div className="settings-error">⚠ {proplineError}</div>}
                                    <button
                                        className="settings-save-btn"
                                        onClick={() => { saveProplineKey(proplineKeyInput); setShowSettings(false); }}
                                    >
                                        Save & Refresh
                                    </button>
                                </div>

                                <div className="settings-source-row">
                                    <div className="settings-source-name">
                                        <span>BallDontLie (NBA stats)</span>
                                        <span className={`source-pill ${statsDataSource}`}>
                                            {statsDataSource === 'live' ? '🟢 LIVE' : (statsDataSource === 'sample' ? '🟡 SAMPLE' : '⏳ CHECKING')}
                                        </span>
                                    </div>
                                    <input
                                        type="text"
                                        className="settings-input"
                                        placeholder="Paste your free BallDontLie API key"
                                        value={keyInput}
                                        onChange={(e) => setKeyInput(e.target.value)}
                                    />
                                    <div className="settings-note">
                                        Get a free key at app.balldontlie.io. Stored only in this browser's
                                        local storage — never sent anywhere except directly to BallDontLie's API.
                                        Powers real season/L5/L10 averages for NBA. Free tier: 5 requests/minute.
                                    </div>
                                    {bdlError && <div className="settings-error">⚠ {bdlError}</div>}
                                    <button
                                        className="settings-save-btn"
                                        onClick={() => { saveApiKey(keyInput); setShowSettings(false); }}
                                    >
                                        Save & Refresh
                                    </button>
                                </div>

                                <div className="settings-source-row">
                                    <div className="settings-source-name">
                                        <span>ESPN (injuries, scoreboard, logos)</span>
                                        <span className="source-pill live">🟢 No key needed</span>
                                    </div>
                                    <div className="settings-note">Free and keyless — always on automatically.</div>
                                </div>

                                <div className="settings-source-row">
                                    <div className="settings-source-name">
                                        <span>NBA.com / WNBA.com (opponent defense)</span>
                                        <span className="source-pill sample">🟡 Best-effort</span>
                                    </div>
                                    <div className="settings-note">
                                        No key exists for these — but browsers block a header these sites
                                        require, so this usually falls back to ESPN automatically. No action needed.
                                    </div>
                                </div>

                                <div className="settings-source-row">
                                    <div className="settings-source-name">
                                        <span>Prop lines (PrizePicks / FanDuel / Underdog)</span>
                                        <span className="source-pill sample">🟡 Sample only</span>
                                    </div>
                                    <div className="settings-note">
                                        No free or public API exists for real sportsbook prop lines. This app
                                        does not scrape these platforms. The Odds API (the-odds-api.com) offers
                                        a free-tier key for game odds, but not player props on the free plan.
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            };

            const ParlayBuilderModal = () => {
                if (!showParlayBuilder) return null;

                const parlayOdds = calculateParlayOdds();
                const combinedHitRate = selectedProps.length > 0
                    ? selectedProps.reduce((acc, prop) => acc * (prop.hitRate / 100), 1) * 100
                    : 0;

                return (
                    <div className="modal-overlay" onClick={() => setShowParlayBuilder(false)}>
                        <div className="modal" onClick={(e) => e.stopPropagation()}>
                            <div className="modal-header">
                                <div className="modal-title">Smart Parlay Builder</div>
                                <button className="close-btn" onClick={() => setShowParlayBuilder(false)}>×</button>
                            </div>
                            <div className="modal-body">
                                {selectedProps.length === 0 ? (
                                    <div style={{ textAlign: 'center', padding: '3rem', color: 'var(--text-secondary)' }}>
                                        <div style={{ fontSize: '3rem', marginBottom: '1rem' }}>🎯</div>
                                        <div style={{ fontSize: '1.2rem', fontWeight: 600, marginBottom: '0.5rem' }}>
                                            No props selected
                                        </div>
                                        <div style={{ fontSize: '0.9rem' }}>
                                            Select props with 80%+ hit rate to build your parlay
                                        </div>
                                    </div>
                                ) : (
                                    <>
                                        <div style={{ marginBottom: '1rem', fontSize: '0.9rem', color: 'var(--text-secondary)' }}>
                                            Only props with 80%+ hit rate can be added for optimal performance
                                        </div>
                                        {selectedProps.map(prop => (
                                            <div key={prop.id} className="parlay-item">
                                                <div className="parlay-item-info">
                                                    <div className="parlay-item-player">
                                                        {prop.player} ({prop.team})
                                                    </div>
                                                    <div className="parlay-item-prop">
                                                        {prop.prop} O{prop.line} • Hit Rate: {prop.hitRate}%
                                                    </div>
                                                </div>
                                                <div className="parlay-item-odds">
                                                    {prop.odds > 0 ? '+' : ''}{prop.odds}
                                                </div>
                                                <button 
                                                    className="remove-btn"
                                                    onClick={() => setSelectedProps(selectedProps.filter(p => p.id !== prop.id))}
                                                >
                                                    Remove
                                                </button>
                                            </div>
                                        ))}
                                        <div className="parlay-summary">
                                            <div className="parlay-summary-row">
                                                <span>Legs:</span>
                                                <span>{selectedProps.length}</span>
                                            </div>
                                            <div className="parlay-summary-row">
                                                <span>Combined Hit Rate:</span>
                                                <span>{combinedHitRate.toFixed(1)}%</span>
                                            </div>
                                            <div className="parlay-summary-row">
                                                <span>Parlay Odds:</span>
                                                <span>{parlayOdds > 0 ? '+' : ''}{parlayOdds}</span>
                                            </div>
                                            <div className="parlay-summary-row">
                                                <span>Potential Payout ($100):</span>
                                                <span>${parlayOdds > 0 ? 100 + parlayOdds : (100 + (10000 / Math.abs(parlayOdds))).toFixed(2)}</span>
                                            </div>
                                        </div>
                                    </>
                                )}
                            </div>
                        </div>
                    </div>
                );
            };

            const basePlayers = Array.isArray(playersData) ? playersData : [];
            const filteredPlayers = React.useMemo(() => {
                const list = basePlayers.map(p => ({ p, g: playerBestGrade(p) }));
                const cmp = {
                    grade: (a, b) => (GRADE_RANK[a.g.grade] - GRADE_RANK[b.g.grade])
                        || (b.g.gradeScore - a.g.gradeScore)
                        || (Math.abs(b.g.edge) - Math.abs(a.g.edge)),
                    edge: (a, b) => (b.g.edge - a.g.edge),
                    time: (a, b) => String(a.p.gameTime || '').localeCompare(String(b.p.gameTime || '')),
                    name: (a, b) => String(a.p.name).localeCompare(String(b.p.name))
                }[sortBy] || (() => 0);
                return list.sort(cmp).map(x => x.p);
            }, [basePlayers, sortBy]);

            return (
                <div className="app-container">
                    <header className="header">
                        <div className="header-content">
                            <div className="logo">Beats<span className="logo-accent">Edge</span></div>
                            <div className="view-toggle">
                                <button
                                    className={`view-toggle-btn ${currentView === 'picks' ? 'active' : ''}`}
                                    onClick={() => setCurrentView('picks')}
                                >
                                    Top Picks
                                </button>
                                <button
                                    className={`view-toggle-btn ${currentView === 'browse' ? 'active' : ''}`}
                                    onClick={() => setCurrentView('browse')}
                                >
                                    Browse
                                </button>
                            </div>
                            <div className="sport-switcher">
                                {sports.map(sport => (
                                    <button
                                        key={sport}
                                        className={`sport-switcher-btn ${selectedSport === sport ? 'active' : ''} ${SPORT_STATUS[sport] === 'soon' ? 'disabled' : ''}`}
                                        onClick={() => { if (SPORT_STATUS[sport] === 'ready') setSelectedSport(sport); }}
                                        title={SPORT_STATUS[sport] === 'soon' ? 'Coming soon' : ''}
                                    >
                                        {sport.toUpperCase()}{SPORT_STATUS[sport] === 'soon' ? ' 🔒' : ''}
                                    </button>
                                ))}
                            </div>
                            <button
                                className="settings-btn"
                                onClick={() => { setKeyInput(balldontlieKey); setBackendUrlInput(backendUrl); setProplineKeyInput(proplineKey); setShowSettings(true); }}
                                title="Data source settings"
                            >
                                ⚙️ Data Sources
                            </button>
                            <button 
                                className="parlay-builder-btn"
                                onClick={() => setShowParlayBuilder(true)}
                            >
                                🎯 Smart Parlay
                                {selectedProps.length > 0 && (
                                    <span className="parlay-count">{selectedProps.length}</span>
                                )}
                            </button>
                        </div>
                    </header>

                    {currentView === 'browse' && (
                    <div className="platform-tabs">
                        <div className="platform-tabs-inner">
                            {platforms.map(platform => (
                                <button
                                    key={platform.id}
                                    className={`platform-tab ${selectedPlatform === platform.id ? 'active' : ''}`}
                                    onClick={() => setSelectedPlatform(platform.id)}
                                >
                                    {platform.name}
                                </button>
                            ))}
                        </div>
                    </div>
                    )}

                    <main className="main-content">
                        {currentView === 'browse' && (
                        <React.Fragment>
                        <div className="data-source-bar">
                            {selectedSport === 'mlb' && (
                                <span className={`source-pill ${mlbSlateSource}`}>
                                    {mlbSlateSource === 'live' ? '🟢 LIVE' : (mlbSlateSource === 'sample' ? '🟡 SAMPLE' : '⏳ CHECKING')} — MLB Slate (statsapi.mlb.com, real players &amp; stats)
                                </span>
                            )}
                            <span className={`source-pill ${injuryDataSource}`}>
                                {injuryDataSource === 'live' ? '🟢 LIVE' : (injuryDataSource === 'sample' ? '🟡 SAMPLE' : '⏳ CHECKING')} — ESPN Injuries
                            </span>
                            <span className={`source-pill ${scoreboardSource}`}>
                                {scoreboardSource === 'live' ? '🟢 LIVE' : (scoreboardSource === 'sample' ? '🟡 SAMPLE' : '⏳ CHECKING')} — ESPN Scoreboard
                            </span>
                            {selectedSport === 'mlb' ? (
                                <span className={`source-pill ${propLineSource === 'live' ? 'live' : (propLineSource === 'sample' ? 'sample' : 'checking')}`}>
                                    {propLineSource === 'live'
                                        ? '🟢 LIVE — Prop Lines (PropLine)'
                                        : (propLineSource === 'sample'
                                            ? (!proplineKey ? '🟡 SAMPLE — Prop Lines (add a PropLine key in Data Sources)'
                                                : (!backendUrl ? '🟡 SAMPLE — Prop Lines (PropLine needs "Your Backend" URL set too)'
                                                    : '🟡 SAMPLE — Prop Lines (PropLine had none for this slate)'))
                                            : '⏳ CHECKING — Prop Lines')}
                                </span>
                            ) : (
                                <span className="source-pill sample">
                                    🟡 SAMPLE — Prop Lines (no free source publishes these)
                                </span>
                            )}
                        </div>

                        {Array.isArray(liveGames) && liveGames.length > 0 && scoreboardSource === 'live' && (
                            <div className="live-games-ticker">
                                <span className="live-games-label">Today's Games (ESPN, live):</span>
                                {liveGames.map(g => (
                                    <span key={g.id} className="live-game-chip">
                                        {g.away} @ {g.home} <span className="live-game-status">{g.status}</span>
                                    </span>
                                ))}
                            </div>
                        )}

                        {Array.isArray(injuryNews) && injuryNews.length > 0 && (
                            <div className="news-banner">
                                <div className="news-icon">⚠️</div>
                                <div className="news-content">
                                    <div className="news-title">
                                        Injury Updates {injuryDataSource === 'live' ? '(Live from ESPN)' : '(Sample)'}
                                    </div>
                                    <div className="news-text">
                                        {injuryNews.map(news => `${news.player} (${news.status})`).join(' • ')}
                                    </div>
                                </div>
                            </div>
                        )}

                        <div className="content-header">
                            <div className="page-title">
                                {selectedPlatform === 'all' ? 'All Platforms' : platforms.find(p => p.id === selectedPlatform)?.name} Props
                            </div>
                            <div className="filters">
                                <input
                                    type="date"
                                    className="date-input"
                                    value={selectedDate}
                                    onChange={(e) => setSelectedDate(e.target.value)}
                                />
                                <select
                                    className="filter-select"
                                    value={sortBy}
                                    onChange={(e) => setSortBy(e.target.value)}
                                    title="Sort players"
                                >
                                    <option value="grade">Sort: Grade (A→D)</option>
                                    <option value="edge">Sort: Model edge</option>
                                    <option value="time">Sort: Game time</option>
                                    <option value="name">Sort: Name (A→Z)</option>
                                </select>
                            </div>
                        </div>

                        {loading ? (
                            <div className="loading">
                                <div className="spinner"></div>
                                <div>Loading real-time data...</div>
                            </div>
                        ) : (
                            <div className="players-grid">
                                {filteredPlayers.map(player => (
                                    <PlayerCard key={player.id} player={player} />
                                ))}
                            </div>
                        )}
                        </React.Fragment>
                        )}

                        {currentView === 'picks' && (
                            <TopPicksView
                                playersData={playersData}
                                loading={loading}
                                selectedSport={selectedSport}
                                onSwitchSport={(sport, view) => { setSelectedSport(sport); setCurrentView(view); }}
                            />
                        )}
                    </main>

                    <ParlayBuilderModal />
                    <SettingsModal />
                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
