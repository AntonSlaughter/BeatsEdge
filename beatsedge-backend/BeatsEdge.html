                        detail: `${prop.book === 'prizepicks' ? 'PrizePicks' : prop.book} ${prop.line} vs sportsbooks ${prop.marketLine} (${prop.mktGap > 0 ? '+' : ''}${prop.mktGap}) — ${better ? 'the better number' : 'the worse number'} for the ${direction}`
                    });
                }
            }

            // Factor 5: Pace. For MLB/NHL there is no real pace-equivalent
            // input (paceRating is always 'neutral'), so this factor is dropped
            // entirely for those sports rather than counting as a free green.
            // NBA/NFL behaviour is unchanged.
            const paceRating = player.paceRating || 'neutral';
            const paceIsRealInput = !((sport === 'mlb' || sport === 'nhl' || sport === 'nfl' || sport === 'ncaaf' || sport === 'nba') && paceRating === 'neutral');
            if (paceIsRealInput) {
                const paceSupports = direction === 'over' ? paceRating !== 'unfavorable' : paceRating !== 'favorable';
                factors.push({
                    key: 'pace',
                    name: 'Pace',
                    supports: paceSupports,
                    detail: player.paceDetail || `Pace rated ${paceRating}`
                });
            }

            // Factor 6: Rest / Back-to-Back — REAL data when your backend is
            // connected (see Data Sources settings), joining this player's
            // actual box scores to the actual schedule. No backend, or too
            // small a real sample for this exact situation, and this factor
            // is simply omitted rather than faked or defaulted to "supports".
            // NBA is EXCLUDED: the backend's situational splits are points-only
            // (`pointsAvg`), which is the wrong stat for a rebounds / blocks /
            // steals prop — NBA gets a per-stat rest + venue split from the
            // real game log in the sport block above instead.
            if (sport !== 'nba' && player.situational && player.situational.backToBack && player.situational.rested) {
                const isB2BTonight = !!player.isBackToBackTonight;
                const relevantGames = isB2BTonight ? player.situational.backToBack.games : player.situational.rested.games;
                if (relevantGames >= 5) {
                    const relevantAvg = isB2BTonight ? player.situational.backToBack.pointsAvg : player.situational.rested.pointsAvg;
                    const otherAvg = isB2BTonight ? player.situational.rested.pointsAvg : player.situational.backToBack.pointsAvg;
                    const restSupports = direction === 'over' ? relevantAvg >= otherAvg : relevantAvg <= otherAvg;
                    factors.push({
                        key: 'rest',
                        name: isB2BTonight ? 'Back-to-Back Tonight' : 'Rested',
                        supports: restSupports,
                        detail: `${relevantAvg} avg in this situation (${relevantGames} real games) vs ${otherAvg} otherwise`
                    });
                }
            }

            // Factor 7: Home / Away — REAL data, same source and same
            // sample-size honesty rule as above. NBA excluded (see Factor 6).
            if (sport !== 'nba' && player.situational && player.situational.home && player.situational.away) {
                const isHomeTonight = !!player.isHomeTonight;
                const relevantGames = isHomeTonight ? player.situational.home.games : player.situational.away.games;
                if (relevantGames >= 5) {
                    const relevantAvg = isHomeTonight ? player.situational.home.pointsAvg : player.situational.away.pointsAvg;
                    const otherAvg = isHomeTonight ? player.situational.away.pointsAvg : player.situational.home.pointsAvg;
                    const venueSupports = direction === 'over' ? relevantAvg >= otherAvg : relevantAvg <= otherAvg;
                    factors.push({
                        key: 'venue',
                        name: isHomeTonight ? 'Home' : 'Away',
                        supports: venueSupports,
                        detail: `${relevantAvg} avg ${isHomeTonight ? 'at home' : 'on the road'} (${relevantGames} real games) vs ${otherAvg} the other way`
                    });
                }
            }

            const greenCount = factors.filter(f => f.supports).length;
            const totalFactors = factors.length;
            const confidence = Math.round((greenCount / totalFactors) * 100);

            // Model Projection: weighted blend of recent form, season, and vs-opponent history,
            // nudged by how far the positional defense rank sits from league-average (15.5).
            // (MLB doesn't have this rank concept — see the matchup factor above instead;
            // its pitcher/lineup context isn't folded into this numeric nudge in this pass.)
            const vsOppAvg = s.vsOpp ? s.vsOpp.avg : seasonAvg;
            const last10Avg = s.last10 ? s.last10.avg : seasonAvg;
            let projection = (recentAvg * 0.35) + (seasonAvg * 0.25) + (last10Avg * 0.25) + (vsOppAvg * 0.15);

            if (posDefense && posDefense.rank !== undefined) {
                const defAdjustment = (posDefense.rank - 15.5) * 0.12; // weak D (high rank) nudges projection up
                projection += defAdjustment;
            }
            // Football: nudge by how leaky the opposing defense is, scaled to
            // the size of the number (±6% at the extremes of the rank scale).
            if ((sport === 'nfl' || sport === 'ncaaf') && player.oppDef && player.oppDef.rank) {
                const _span = sport === 'ncaaf' ? 65 : 15.5, _mid = sport === 'ncaaf' ? 67 : 16.5;
                projection *= 1 + ((player.oppDef.rank - _mid) / _span) * 0.06;
            }
            // NBA: nudge by tonight's opponent's Defense-vs-Position rank for
            // THIS stat (1 = toughest → project down, 150 = softest → project
            // up). ±7% at the extremes.
            if (sport === 'nba' && player.opponentDefense && player.opponentDefense.byPosition) {
                const grp = /^(PG|SG|G)$/i.test(player.position || '') ? 'G' : /^(SF|PF|F)$/i.test(player.position || '') ? 'F' : 'C';
                const pd = player.opponentDefense.byPosition[grp];
                const rkField = {
                    points: 'rank', pra: 'rank', pr: 'rank', pa: 'rank',
                    rebounds: 'rebRank', ra: 'rebRank', assists: 'astRank', threes: 'tpmRank',
                    blocks: 'blkRank', blocksSteals: 'blkRank', steals: 'stlRank', turnovers: 'toRank'
                }[prop.statKey];
                const rk = pd && rkField && pd[rkField];
                if (rk) projection *= 1 + ((rk - 75.5) / 74.5) * 0.07;
            }
            // MLB batter: nudge by the platoon + batter-vs-starter splits,
            // relative to the player's own season baseline. Each capped, total
            // clamped ±20%. Needs a real sample or it doesn't move.
            if (sport === 'mlb' && player.role === 'batter') {
                const baseR = mlbOffRate(player._seasonStat, prop.statKey);
                let mult = 1;
                const nudge = (st, minN, cap) => {
                    if (!st || mlbSplitN(st) < minN || baseR == null || baseR <= 0) return;
                    const r = mlbOffRate(st, prop.statKey);
                    if (r == null) return;
                    mult *= 1 + Math.max(-cap, Math.min(cap, r / baseR - 1));
                };
                const hnd = player.oppPitcherHand;
                nudge(player.splitBy && (hnd === 'L' ? player.splitBy.vl : hnd === 'R' ? player.splitBy.vr : null), 50, 0.12);
                nudge(player.bvp, 12, 0.10);
                projection *= Math.max(0.80, Math.min(1.20, mult));
            }
            if (paceRating === 'favorable') projection += 0.6;
            if (paceRating === 'unfavorable') projection -= 0.6;

            projection = Math.round(projection * 10) / 10;

            const edge = direction === 'over' ? (projection - line) : (line - projection);

            let matchupLabel = 'MIXED MATCHUP';
            if (greenCount === totalFactors) matchupLabel = 'GREEN MATCHUP';
            else if (greenCount <= 1) matchupLabel = 'RED MATCHUP';
            else if (greenCount >= totalFactors - 1) matchupLabel = 'GREEN MATCHUP';
            else if (greenCount <= 2) matchupLabel = 'RED MATCHUP';

            // ---- Letter grade (A/B/C/D) --------------------------------------
            // A transparent blend of factor confluence (how many independent
            // factors align) and model edge (projection vs the line, as a % of
            // the line). It is NOT yet calibrated against historical outcomes —
            // it grades how strongly the available factors + the model favor
            // this side, not a proven hit probability. (Backtest = later step.)
            const roundedEdge = Math.round(edge * 10) / 10;
            // Grade edge-axis:
            //  - REAL line present (prop.lineSource set, e.g. PropLine): use the
            //    true bet edge, (projection vs the real line) / line.
            //  - SAMPLE line: use (projection vs the player's OWN season
            //    baseline) instead, so the grade isn't driven by the artifact
            //    of rounding a made-up line to the nearest .5.
            const usingRealLine = !!prop.lineSource;
            // `roundedEdge` already flips for direction (line - projection for
            // an under), so edge/line is the right directional signal for a
            // real line. For a SAMPLE line, use distance from the player's own
            // baseline, sign-flipped for unders (trending BELOW their norm
            // helps an under).
            const baseSignal = seasonAvg > 0 ? (projection - seasonAvg) / seasonAvg : 0;
            const signal = usingRealLine
                ? (line > 0 ? roundedEdge / line : 0)
                : (direction === 'over' ? baseSignal : -baseSignal);
            // Smooth (tanh) instead of a hard clamp so a big edge and a small
            // edge don't both pile up at 1.0 — the backtest needs that spread
            // to tell whether more edge actually means a higher hit rate.
            const edgeComponent = 0.5 + Math.tanh(signal * (usingRealLine ? 3 : 3.5)) * 0.5;
            // Model edge (which direction the projection leans vs the line) is
            // by far the most predictive input in the backtest, so it carries
            // most of the weight; factor confluence is a modifier.
            const gradeScore = 0.25 * (confidence / 100) + 0.75 * edgeComponent;
            let grade;
            const cut = GRADE_CUTOFFS && GRADE_CUTOFFS[sport];
            if (cut) {
                // Cutoffs derived from THIS sport's backtest so the letters are
                // anchored to real outcomes.
                grade = gradeScore >= cut.A ? 'A'
                    : gradeScore >= cut.B ? 'B'
                        : gradeScore >= cut.C ? 'C' : 'D';
            } else if (gradeScore >= 0.86 && confidence >= 80) grade = 'A';
            else if (gradeScore >= 0.68 && confidence >= 50) grade = 'B';
            else if (gradeScore >= 0.46) grade = 'C';
            else grade = 'D';
            // A RED matchup (most factors against) can't be graded A or B,
            // however good the raw number looks.
            if (matchupLabel === 'RED MATCHUP' && (grade === 'A' || grade === 'B')) grade = 'C';

            // Thin sample (injured star / rookie / deep backup with almost no
            // game log) or an implausible gap between model and a real posted
            // line (usually bad line data or a stale projection): don't let
            // either manufacture a top-grade pick.
            const sampleGames = (s.season && s.season.games) || 0;
            const edgeRatio = (usingRealLine && line > 0) ? Math.abs(roundedEdge) / line : 0;
            // Backtest showed the model's MOST extreme edges regress (they're
            // usually a hot/cold streak about to mean-revert) — its moderate
            // calls calibrate best. So an oversized gap can't be a top grade.
            const _football = sport === 'nfl' || sport === 'ncaaf';
            const wildGap = edgeRatio > 0.5                                    // model & line disagree by a lot → regression risk
                || (_football && sampleGames < 6 && edgeRatio > 0.30);        // small sample + big gap
            // A cross-book line (shown because the selected DFS site hasn't
            // posted this number) isn't actually pickable there — never let it
            // grade above C.
            const thinData = sampleGames < (_football ? 4 : 3) || wildGap || !!prop.crossBook;
            if (thinData && (grade === 'A' || grade === 'B')) grade = 'C';

            // Football has no opponent-defense factor wired yet, so an "A" would
            // rest on 2-3 correlated prior-season signals — not enough. Require
            // the hit-rate AND vs-opponent factors to have fired (real sample)
            // for a football A; otherwise the best it earns is a B. College
            // adds a season-not-started guard (Week 1-3 = prior-year logs only).
            if (_football && grade === 'A' && totalFactors < 4) grade = 'B';
            if (sport === 'ncaaf' && grade === 'A' && (s.season && s.season.games || 0) < 6) grade = 'B';

            // ---- Model probability + betting edge --------------------------
            // P(this side hits) — a calibrated ESTIMATE, not a lock. Three
            // transparent stages, each captured in `probSteps` for the modal's
            // "how this was calculated" breakdown:
            //   1. Distribution — how far the model projection sits past the
            //      line, measured in this stat's own game-to-game swing; a
            //      normal CDF turns that into a base probability.
            //   2. History — blend toward how often the player has ACTUALLY
            //      landed on this side (season, then last-10), weighted by
            //      sample size. The projection is the anchor; history is a prior.
            //   3. Factors — the matchup / context factors that AREN'T already
            //      inside the projection nudge it a little, capped so they
            //      modulate rather than dominate.
            const probSteps = [];
            const projSd = projStdDev(projection, prop.statKey, s);
            const zOver = projSd > 0 ? (projection - line) / projSd : 0;
            const zPick = direction === 'over' ? zOver : -zOver;
            const pDistRaw = Math.max(0.02, Math.min(0.98, normalCdf(zPick)));
            // Regression to the mean. Player projections are noisy and the
            // model runs a little hot, so pull the raw distribution estimate
            // toward a coin flip: harder when the game log is short. This is
            // what keeps a lucky 12-game hot streak from reading as "88%".
            const shrink = Math.min(0.80, 0.45 + Math.min(sampleGames, 40) / 40 * 0.35);
            const pDist = 0.5 + (pDistRaw - 0.5) * shrink;
            probSteps.push({
                label: 'Base rate from the projection',
                p: pDist,
                detail: `model ${projection} vs a ${line} line — ${Math.abs(Math.round((projection - line) * 10) / 10)} ${projection >= line ? 'above' : 'below'}; this stat swings ~±${Math.round(projSd * 10) / 10}/game and the estimate is pulled ${Math.round((1 - shrink) * 100)}% toward 50% for regression (${sampleGames} game sample)`
            });

            // Directional hit rate at THIS prop's exact line. Recompute it from
            // the raw game log whenever we have one — the pre-baked
            // statsByKey[k].hitRate is a single number set against whatever
            // line the window builder happened to pick, which is WRONG for any
            // stat that has several lines (goblins / demons / alts). Only fall
            // back to the window's estimate when there's no game log yet.
            const dirRate = (hitRate) => hitRate == null ? null : (direction === 'over' ? hitRate / 100 : 1 - hitRate / 100);
            const _glRows = (player.gameLogByKey && player.gameLogByKey[prop.statKey]) || null;
            const _glVals = Array.isArray(_glRows)
                ? _glRows.map(g => (g && typeof g.points === 'number') ? g.points : null).filter(v => v != null)
                : [];
            const _hasGl = _glVals.length >= 5;
            const rateAt = (vals) => {
                if (!vals.length) return null;
                const over = vals.filter(v => v > line).length / vals.length;
                return direction === 'over' ? over : 1 - over;
            };
            const priors = [];
            if (_hasGl) {
                priors.push({ p: rateAt(_glVals), w: Math.min(0.30, _glVals.length / 100 * 0.30), games: _glVals.length, name: 'game-log hit rate' });
                const l10 = _glVals.slice(-10);
                if (l10.length >= 5) priors.push({ p: rateAt(l10), w: 0.15, games: l10.length, name: 'last-10 hit rate' });
            } else if (typeof prop.hitRate === 'number' && prop.hitRate >= 0 && prop.hitRate <= 100) {
                // No game log yet (MLB pre-modal). prop.hitRate is estHitRate at
                // THIS prop's line, already directional — the best available.
                priors.push({ p: prop.hitRate / 100, w: 0.20, games: sampleGames || 20, name: 'estimated hit rate' });
            } else {
                if (s.season && typeof s.season.hitRate === 'number' && (s.season.games || 0) >= 5) {
                    priors.push({ p: dirRate(s.season.hitRate), w: Math.min(0.30, (s.season.games / 100) * 0.30), games: s.season.games, name: 'season hit rate (est.)' });
                }
                if (s.last10 && typeof s.last10.hitRate === 'number' && (s.last10.games || 0) >= 5) {
                    priors.push({ p: dirRate(s.last10.hitRate), w: 0.15, games: s.last10.games, name: 'last-10 hit rate (est.)' });
                }
            }
            const wHist = priors.reduce((a, x) => a + x.w, 0);
            let pBlend = pDist * (1 - wHist) + priors.reduce((a, x) => a + x.p * x.w, 0);
            priors.forEach(pr => probSteps.push({
                label: `Blend in ${pr.name}`,
                p: pr.p, weight: pr.w,
                detail: `hit this side in ${Math.round(pr.p * 100)}% of ${pr.games} games — weighted ${Math.round(pr.w * 100)}%`
            }));
            if (priors.length) probSteps.push({ label: 'After history blend', p: pBlend, subtotal: true });

            // per-factor nudges — skip the two already inside `projection`
            const FACTOR_STEP = 0.02, FACTOR_CAP = 0.08;
            let factorAdjRaw = 0;
            factors.forEach(f => {
                if (f.key === 'recent' || f.key === 'season') { f.probDelta = 0; f.inProjection = true; return; }
                f.probDelta = (f.supports ? 1 : -1) * FACTOR_STEP;
                factorAdjRaw += f.probDelta;
            });
            let factorAdj = Math.max(-FACTOR_CAP, Math.min(FACTOR_CAP, factorAdjRaw));
            if (factorAdjRaw !== 0 && factorAdj !== factorAdjRaw) {
                const scale = factorAdj / factorAdjRaw;
                factors.forEach(f => { if (f.probDelta) f.probDelta = Math.round(f.probDelta * scale * 1000) / 1000; });
            }
            const pAdj = pBlend + factorAdj;
            if (Math.abs(factorAdj) > 0.0001) {
                probSteps.push({
                    label: 'Matchup / context factor adjustment',
                    delta: factorAdj,
                    detail: `${factors.filter(f => !f.inProjection && f.supports).length} support, ${factors.filter(f => !f.inProjection && !f.supports).length} against (capped at ±${Math.round(FACTOR_CAP * 100)} pts)`
                });
            }

            // Raw estimate — kept inside the band the estimator was tuned for.
            const RAW_FLOOR = 0.22, RAW_CEIL = 0.78;
            const rawModelProb = Math.max(RAW_FLOOR, Math.min(RAW_CEIL, pAdj));
            // Map the raw estimate onto how often calls at that confidence have
            // ACTUALLY landed for this sport (see PROB_CALIB / the backtest).
            // No curve stored (well-calibrated sport, or never backtested) → the
            // raw estimate passes straight through. The calibrated value is
            // allowed a wider band (a backtested "90%" should be able to say so).
            const pCal = applyProbCalib(rawModelProb, sport);
            const modelProb = Math.max(0.03, Math.min(0.97, pCal));
            if (Math.abs(modelProb - rawModelProb) >= 0.01) {
                probSteps.push({
                    label: 'Backtest calibration',
                    p: modelProb,
                    detail: `raw estimate ${Math.round(rawModelProb * 100)}% → ${Math.round(modelProb * 100)}%, matching ${String(sport || '').toUpperCase()} calls at this confidence to how often they've actually hit walk-forward`
                });
            }
            probSteps.push({
                label: 'Model probability',
                p: modelProb, subtotal: true, final: true
            });

            // implied probability from the posted price, de-vigged when both
            // sides are priced. DFS pick'em (+100/+100, or no price) → 50%.
            const impOver = impliedFromAmerican(prop.odds);
            const impUnder = impliedFromAmerican(prop.oppOdds);
            let impliedProb = null, vig = 0;
            if (impOver != null && impUnder != null && impOver + impUnder > 0) {
                vig = impOver + impUnder - 1;
                impliedProb = (direction === 'over' ? impOver : impUnder) / (impOver + impUnder);
            } else if (direction === 'over' && impOver != null) impliedProb = impOver;
            else if (direction === 'under' && impUnder != null) impliedProb = impUnder;
            const hasRealPrice = !!prop.lineSource && prop.lineSource !== 'backtest' && (impOver != null || impUnder != null);
            if (impliedProb == null) impliedProb = 0.5; // DFS pick'em / unpriced baseline
            const edgePct = Math.round((modelProb - impliedProb) * 1000) / 10;

            // Keep the letter honest against a REAL market price: an A/B claims
            // a genuine edge over the book, so if the model doesn't actually
            // beat the (de-vigged) price it's a C at best. Same spirit as the
            // RED MATCHUP / thinData / crossBook caps above.
            if (hasRealPrice && (grade === 'A' || grade === 'B') && modelProb <= impliedProb) grade = 'C';
            // The letter and the probability must never openly contradict:
            //  - model has this side below a coin flip → not an A/B.
            //  - model actively dislikes this side → D, whatever the raw
            //    factor/edge score said (this catches a sample-line pick whose
            //    projection beats the player's own average but still misses the
            //    posted number).
            // Skipped in backtest mode, where grade and probability are already
            // driven by the same signal (nothing to reconcile) and the
            // calibration must stay stable.
            if (prop.lineSource !== 'backtest') {
                if ((grade === 'A' || grade === 'B') && modelProb < 0.50) grade = 'C';
                if (grade !== 'D' && modelProb < 0.44) grade = 'D';
                // ...and the reverse: don't call it a D if the model clearly
                // likes the side (keeps the letter from disagreeing with a
                // 58%+ probability). C is as high as this bump goes — a true
                // A/B still has to earn it through the factor + edge score.
                if (grade === 'D' && modelProb >= 0.58) grade = 'C';
            }

            const pickRate = (hr) => (hr == null ? null : (direction === 'over' ? Math.round(hr) : Math.round(100 - hr)));
            // Real per-line hit rates from the game log when we have one, so the
            // "reference" numbers match THIS prop's line — not the pre-baked
            // window hitRate (see the priors block above for why).
            const _glPick = (vals) => vals.length < 3 ? null
                : Math.round((direction === 'over' ? vals.filter(v => v > line).length : vals.filter(v => v <= line).length) / vals.length * 100);
            const _glOver = (vals) => vals.length < 3 ? null : Math.round(vals.filter(v => v > line).length / vals.length * 100);
            const _glOppVals = Array.isArray(_glRows) && player.opponent
                ? _glRows.filter(g => g && g.opponent === player.opponent && typeof g.points === 'number').map(g => g.points)
                : [];
            const hitRates = _hasGl ? {
                season: { pick: _glPick(_glVals), over: _glOver(_glVals), games: _glVals.length },
                last10: { pick: _glPick(_glVals.slice(-10)), over: _glOver(_glVals.slice(-10)), games: Math.min(10, _glVals.length) },
                last5: { pick: _glPick(_glVals.slice(-5)), over: _glOver(_glVals.slice(-5)), games: Math.min(5, _glVals.length) },
                vsOpp: _glOppVals.length ? { pick: _glPick(_glOppVals), over: _glOver(_glOppVals), games: _glOppVals.length } : null
            } : {
                season: s.season && s.season.games ? { pick: pickRate(s.season.hitRate), over: s.season.hitRate, games: s.season.games } : null,
                last10: s.last10 && s.last10.games ? { pick: pickRate(s.last10.hitRate), over: s.last10.hitRate, games: s.last10.games } : null,
                last5: s.last5 && s.last5.games ? { pick: pickRate(s.last5.hitRate), over: s.last5.hitRate, games: s.last5.games } : null,
                vsOpp: s.vsOpp && s.vsOpp.games ? { pick: pickRate(s.vsOpp.hitRate), over: s.vsOpp.hitRate, games: s.vsOpp.games } : null
            };

            return {
                factors,
                greenCount,
                totalFactors,
                confidence,
                projection,
                thinData,
                edge: roundedEdge,
                edgeSignalPct: Math.round(signal * 1000) / 10, // directional (projection vs line) / line, %
                matchupLabel,
                grade,
                gradeScore: Math.round(gradeScore * 100) / 100,
                // probability layer (all estimates, not guarantees)
                modelProb,
                modelProbPct: Math.round(modelProb * 100),
                rawModelProbPct: Math.round(rawModelProb * 100),
                impliedProb,
                impliedProbPct: Math.round(impliedProb * 100),
                hasRealPrice,
                vigPct: Math.round(vig * 1000) / 10,
                edgePct,
                hitRates,
                probSteps
            };
        }

        // A→D ordering + per-grade colour/label, used by the badge and by the
        // "Sort by grade" control in Browse.
        const GRADE_RANK = { A: 0, B: 1, C: 2, D: 3 };
        const GRADE_META = {
            A: { cls: 'grade-a', label: 'Strong factor + edge alignment' },
            B: { cls: 'grade-b', label: 'Solid lean' },
            C: { cls: 'grade-c', label: 'Marginal / mixed' },
            D: { cls: 'grade-d', label: 'Factors lean against this side' }
        };
        // Best (lowest-ranked letter) grade across all of a player's props,
        // with the model edge of that best prop for tie-breaking.
        function playerBestGrade(player, typeFilter) {
            if (!player || !player.props || !player.props.length) return { grade: 'D', gradeScore: 0, edge: 0 };
            const consider = (skipAlt) => {
                let best = null;
                player.props.forEach(prop => {
                    if (typeFilter && typeFilter !== 'all' && prop.type !== typeFilter) return;
                    if (skipAlt && prop.altLine) return; // headline grade = the standard board, not a Goblin
                    const e = calculateEdgeScore(player, prop);
                    if (!best || GRADE_RANK[e.grade] < GRADE_RANK[best.grade] ||
                        (e.grade === best.grade && e.gradeScore > best.gradeScore)) {
                        best = { grade: e.grade, gradeScore: e.gradeScore, edge: e.edge };
                    }
                });
                return best;
            };
            return consider(true) || consider(false) || { grade: 'D', gradeScore: 0, edge: 0 };
        }

        // Picks the single best-supported prop across every player/prop combo
        // for a sport, using the same calculateEdgeScore engine as the Browse
        // tab — not a separate, less-tested "top picks" heuristic. "Best" here
        // means highest letter grade, ties broken by gradeScore then |edge|.
        function findTopPick(players) {
            return findTopPicks(players, 1)[0] || null;
        }

        // Top N best-supported picks across EVERY player and EVERY one of their
        // props, using the same calculateEdgeScore engine as Browse (not a
        // separate heuristic). One entry per player so the list stays varied.
        // Ranked: letter grade, then gradeScore, then |model edge|. Pass
        // `direction` ('over' | 'under') to restrict to that side only — used
        // by the research page to show the best overs and the best unders.
        function findTopPicks(players, n = 6, direction = null) {
            const rank = (e) => [GRADE_RANK[e.grade], -e.gradeScore, -Math.abs(e.edge)];
            const rows = [];
            (players || []).forEach(player => {
                if (player.status === 'OUT' || !Array.isArray(player.props) || !player.props.length) return;
                // Mirror the Browse "live lines only" filter so every top pick
                // is a card that actually renders (and its modal can open).
                if (player.sport === 'mlb' && player._allLines && player._noLiveLines) return;
                let bestForPlayer = null;
                player.props.forEach((prop, idx) => {
                    // Rank on the MAIN posted line only — alt lines (e.g. an
                    // "over 0.5" goblin) would otherwise dominate with trivially
                    // high hit rates and crowd out real picks.
                    if (prop.altLine || prop.crossBook) return;
                    if (direction && (prop.direction || 'over') !== direction) return;
                    const edge = calculateEdgeScore(player, prop);
                    if (edge.thinData) return; // not enough game log to trust the projection
                    if (!bestForPlayer) { bestForPlayer = { player, prop, propIdx: idx, edge }; return; }
                    const [ar, ag, ae] = rank(edge);
                    const [br, bg, be] = rank(bestForPlayer.edge);
                    if (ar < br || (ar === br && ag < bg) || (ar === br && ag === bg && ae < be)) {
                        bestForPlayer = { player, prop, propIdx: idx, edge };
                    }
                });
                if (bestForPlayer) rows.push(bestForPlayer);
            });
            rows.sort((a, b) => {
                const [ar, ag, ae] = rank(a.edge);
                const [br, bg, be] = rank(b.edge);
                return ar - br || ag - bg || ae - be;
            });
            return rows.slice(0, n);
        }

        // The research page's picks: the 2 best OVERs + the 2 best UNDERs for a
        // sport (4 total). De-duped so the same player/prop can't be both.
        function findResearchPicks(players) {
            const overs = findTopPicks(players, 3, 'over');
            const unders = findTopPicks(players, 3, 'under');
            const seen = new Set();
            const take = (list, k) => {
                const out = [];
                for (const r of list) {
                    const id = r.player.id + ':' + r.prop.statKey;
                    if (seen.has(id)) continue;
                    seen.add(id); out.push(r);
                    if (out.length === k) break;
                }
                return out;
            };
            return { overs: take(overs, 2), unders: take(unders, 2) };
        }

        const SPORT_LABELS = { nba: 'NBA', nfl: 'NFL', nhl: 'NHL', mlb: 'MLB', ncaaf: 'CFB' };
        const SPORT_ICONS = { nba: '🏀', nfl: '🏈', nhl: '🏒', mlb: '⚾', ncaaf: '🎓' };

        // ── Walk-forward backtest of the grade engine ─────────────────────
        // No historical prop lines exist (PropLine only serves upcoming games),
        // so this validates the MODEL, not the market: for each of a player's
        // past games, rebuild the windows from the games BEFORE it, set a
        // market-like synthetic line (their trailing average, ± a tick), grade
        // BOTH sides with the exact live calculateEdgeScore, and check what
        // actually happened. Aggregated grade → hit-rate over the whole slate
        // tells you whether an "A" is real signal or noise.
        function btWindowsAsOf(hist, opps, tonightOpp, line) {
            const mean = a => a.length ? Math.round((a.reduce((s, v) => s + v, 0) / a.length) * 10) / 10 : 0;
            const rate = a => a.length ? Math.round((a.filter(v => v > line).length / a.length) * 100) : null;
            const lastN = n => hist.slice(-n);
            const oppVals = hist.filter((_, i) => opps[i] === tonightOpp);
            const sorted = [...hist].sort((a, b) => a - b);
            return {
                last5: { avg: mean(lastN(5)), hitRate: rate(lastN(5)), games: Math.min(5, hist.length) },
                last10: { avg: mean(lastN(10)), hitRate: rate(lastN(10)), games: Math.min(10, hist.length) },
                last20: { avg: mean(lastN(20)), hitRate: rate(lastN(20)), games: Math.min(20, hist.length) },
                season: { avg: mean(hist), hitRate: rate(hist), games: hist.length },
                vsOpp: oppVals.length ? { avg: mean(oppVals), hitRate: rate(oppVals), games: oppVals.length } : { avg: mean(hist), hitRate: rate(hist), games: 0 },
                recent: { avg: mean(lastN(5)), hitRate: rate(lastN(5)), median: sorted[sorted.length >> 1] || 0, range: [sorted[0] || 0, sorted[sorted.length - 1] || 0], games: hist.length }
            };
        }
        // Feeds each graded (grade, side) result into `acc` — { [grade]: {n, hit},
        // factors: {name:{n,hit}} }.
        function backtestSeries(vals, opps, sport, position, acc, minGames) {
            const MIN = minGames || 10;
            for (let i = MIN; i < vals.length; i++) {
                const hv = vals.slice(0, i), ho = opps.slice(0, i);
                const seasonAvg = hv.reduce((s, v) => s + v, 0) / hv.length;
                if (seasonAvg <= 0) continue;
                // A book sets a HALF-POINT line that splits the player's own
                // distribution near a coin flip (slightly under, ~48% over).
                // Pick the training-set line closest to that — using round(avg)
                // would land on integers and bias the whole test toward unders.
                let line = null, bestGap = 99;
                for (let cand = 0.5; cand <= seasonAvg * 2.2 + 1; cand += 1) {
                    const over = hv.filter(v => v > cand).length / hv.length;
                    const gap = Math.abs(over - 0.48);
                    if (gap < bestGap) { bestGap = gap; line = cand; }
                }
                if (line == null || line <= 0) continue;
                const actual = vals[i], tonightOpp = opps[i];
                if (actual === line) continue;
                const w = btWindowsAsOf(hv, ho, tonightOpp, line);
                const fake = { sport, position, opponent: tonightOpp, statsByKey: { X: w }, opponentDefense: null, oppDef: null, situational: null };
                for (const dir of ['over', 'under']) {
                    const e = calculateEdgeScore(fake, { statKey: 'X', type: 'X', line, direction: dir, lineSource: 'backtest' });
                    const hit = dir === 'over' ? actual > line : actual < line;
                    const g = acc[e.grade] || (acc[e.grade] = { n: 0, hit: 0 });
                    g.n++; if (hit) g.hit++;
                    acc._total.n++; if (hit) acc._total.hit++;
                    btFileProb(acc, e.modelProbPct, e.rawModelProbPct, hit);
                    btFileAlign(acc, e.greenCount, e.totalFactors, hit);
                    btFileGradeConf(acc, e.grade, e.greenCount, e.totalFactors, hit);
                    btFileConfEdge(acc, e.greenCount, e.totalFactors, e.edgeSignalPct, hit);
                    btFileGCE(acc, e.grade, e.greenCount, e.totalFactors, e.edgeSignalPct, hit);
                    // gradeScore -> hit, bucketed at 0.05, to re-derive letter cutoffs
                    const b = Math.max(0, Math.min(19, Math.floor(e.gradeScore * 20)));
                    const sb = acc.score[b] || (acc.score[b] = { n: 0, hit: 0 });
                    sb.n++; if (hit) sb.hit++;
                    e.factors.forEach(f => {
                        if (!f.supports) return;
                        // collapse the 32 "vs <TEAM>" factors into one line
                        const name = /^vs\s+[A-Z]{2,4}$/.test(f.name) ? 'Recent vs opponent' : f.name;
                        const fb = acc.factors[name] || (acc.factors[name] = { n: 0, hit: 0 });
                        fb.n++; if (hit) fb.hit++;
                    });
                }
            }
        }
        function emptyBacktestAcc() { return { _total: { n: 0, hit: 0 }, factors: {}, score: {}, prob: {}, probRaw: {}, align: {}, gradeConf: {}, confEdge: {}, gce: {} }; }

        // Factor-confluence buckets. File every graded side by how many of its
        // factors point at the chosen side ("8/9 aligned" in the UI). Tells you
        // whether more agreement actually means a higher hit rate, or whether
        // factor COUNT is mostly cosmetic.
        function btFileAlign(acc, greenCount, totalFactors, hit) {
            if (greenCount == null || !isFinite(greenCount)) return;
            const b = acc.align[greenCount] || (acc.align[greenCount] = { n: 0, hit: 0, totTot: 0 });
            b.n++; if (hit) b.hit++; b.totTot += (totalFactors || 0);
        }

        // Grade × confluence cross-tab. Confluence tier = share of the factor set
        // that points at this side (denominator-independent, so it works whatever
        // the sport's factor count is). Shows whether the letter and the
        // aligned-factor count carry INDEPENDENT information or just restate
        // each other.
        const BT_CONF_TIERS = ['low', 'med', 'high'];
        function btConfTier(green, total) {
            if (!total) return null;
            const f = green / total;
            return f < 0.34 ? 'low' : f < 0.67 ? 'med' : 'high';
        }
        function btFileGradeConf(acc, grade, green, total, hit) {
            const tier = btConfTier(green, total);
            if (!grade || !tier) return;
            const k = grade + '|' + tier;
            const b = acc.gradeConf[k] || (acc.gradeConf[k] = { n: 0, hit: 0 });
            b.n++; if (hit) b.hit++;
        }

        // Confluence × model-edge cross-tab. Edge tier = how far the projection
        // sits past the line, as a % of the line (`edgeSignalPct`, directional).
        // Shows whether "high confluence AND a big edge" is a materially stronger
        // group than either signal alone.
        const BT_EDGE_TIERS = ['small', 'med', 'large'];
        function btEdgeTier(sigPct) {
            if (sigPct == null || !isFinite(sigPct)) return null;
            return sigPct < 4 ? 'small' : sigPct < 11 ? 'med' : 'large';
        }
        function btFileConfEdge(acc, green, total, sigPct, hit) {
            const ct = btConfTier(green, total), et = btEdgeTier(sigPct);
            if (!ct || !et) return;
            const k = ct + '|' + et;
            const b = acc.confEdge[k] || (acc.confEdge[k] = { n: 0, hit: 0 });
            b.n++; if (hit) b.hit++;
        }
        // Full 3-way: grade × confluence × edge. Keyed "<grade>|<conf>|<edge>".
        function btFileGCE(acc, grade, green, total, sigPct, hit) {
            const ct = btConfTier(green, total), et = btEdgeTier(sigPct);
            if (!grade || !ct || !et) return;
            const k = grade + '|' + ct + '|' + et;
            const b = acc.gce[k] || (acc.gce[k] = { n: 0, hit: 0 });
            b.n++; if (hit) b.hit++;
        }

        // Probability-calibration buckets. Every graded side is filed by the
        // model's stated P(this side hits); comparing that to how often the
        // side ACTUALLY landed tells you whether a "70%" is really a 70% or an
        // overconfident 57%.
        const BT_PROB_BUCKETS = ['<50', '50-54', '55-59', '60-64', '65-69', '70-74', '75+'];
        const BT_PROB_MID = { '<50': 46, '50-54': 52, '55-59': 57, '60-64': 62, '65-69': 67, '70-74': 72, '75+': 77 };
        function btProbBucket(pct) {
            if (pct == null || !isFinite(pct)) return null;
            if (pct < 50) return '<50';
            if (pct < 55) return '50-54';
            if (pct < 60) return '55-59';
            if (pct < 65) return '60-64';
            if (pct < 70) return '65-69';
            if (pct < 75) return '70-74';
            return '75+';
        }
        // `pct` = the probability the app SHOWS (post-calibration) → acc.prob,
        // used for the displayed calibration table. `rawPct` = the model's raw
        // estimate → acc.probRaw, which is what `deriveProbCalib` fits the curve
        // to (so replacing the curve is always raw→actual, never curve-on-curve).
        function btFileProb(acc, pct, rawPct, hit) {
            const k = btProbBucket(pct);
            if (k) { const b = acc.prob[k] || (acc.prob[k] = { n: 0, hit: 0, sumPct: 0 }); b.n++; if (hit) b.hit++; b.sumPct += pct; }
            const rk = btProbBucket(rawPct == null ? pct : rawPct);
            if (rk) { const rb = acc.probRaw[rk] || (acc.probRaw[rk] = { n: 0, hit: 0, sumPct: 0 }); rb.n++; if (hit) rb.hit++; rb.sumPct += (rawPct == null ? pct : rawPct); }
        }

        // Daily line archive — snapshot every STANDARD posted line so that, after
        // a few weeks, a REAL market backtest (line + juice + settled result)
        // becomes possible. Keeps ~21 days, keyed "<date>|<sport>".
        const LINE_ARCHIVE_KEY = 'beatsedge_line_archive_v1';
        function archiveLines(sport, date, players) {
            try {
                const store = JSON.parse(localStorage.getItem(LINE_ARCHIVE_KEY) || '{}');
                const rows = [];
                (players || []).forEach(p => {
                    if (p.sport !== sport || !Array.isArray(p.props)) return;
                    p.props.forEach(pr => {
                        if (!pr.lineSource || pr.altLine || pr.ppKind || pr.crossBook || pr.direction !== 'over') return;
                        rows.push({
                            p: p.name, tm: p.team, opp: p.opponent, pos: p.position || '',
                            k: pr.statKey, t: pr.type, ln: pr.line, b: pr.book || '',
                            o: pr.odds ?? null, u: pr.oppOdds ?? null
                        });
                    });
                });
                if (!rows.length) return;
                store[`${date}|${sport}`] = { at: Date.now(), rows };
                // prune: keep the 42 most-recent (date|sport) keys (~21 days × 2 sports)
                const keys = Object.keys(store).sort((a, b) => (store[b].at || 0) - (store[a].at || 0));
                keys.slice(42).forEach(k => delete store[k]);
                localStorage.setItem(LINE_ARCHIVE_KEY, JSON.stringify(store));
            } catch (e) { /* localStorage full / disabled — archive is best-effort */ }
        }

        // Daily Defense-vs-Position + team-defense snapshot. The backtest can't
        // test the DvP / opponent-strength factors yet because we only hold ONE
        // current-season DvP table (feeding it to a past game = look-ahead).
        // Snapshotting it dated, starting now, means an as-of DvP is available
        // for every future date — so in a few weeks those factors CAN be
        // walk-forward tested honestly. Keeps ~120 daily keys.
        const DVP_ARCHIVE_KEY = 'beatsedge_dvp_archive_v1';
        // dvpByTeam = NBA_DVP shape {TEAM: {POS: {ptsRank, rebRank, astRank, tpmRank, stlRank, blkRank, toRank}}}
        function archiveDvpSnapshot(date, dvpByTeam, teamDefByAbbr) {
            try {
                if (!dvpByTeam || typeof dvpByTeam !== 'object') return;
                const store = JSON.parse(localStorage.getItem(DVP_ARCHIVE_KEY) || '{}');
                if (store[date]) return; // one snapshot per calendar day
                const rows = [];
                Object.entries(dvpByTeam).forEach(([team, byPos]) => {
                    Object.entries(byPos).forEach(([pos, r]) => {
                        rows.push({ t: team, p: pos, pts: r.ptsRank, reb: r.rebRank, ast: r.astRank, tpm: r.tpmRank, stl: r.stlRank, blk: r.blkRank, to: r.toRank });
                    });
                });
                if (!rows.length) return;
                store[date] = { at: Date.now(), dvp: rows, teamDef: teamDefByAbbr || null };
                const keys = Object.keys(store).sort();
                keys.slice(0, Math.max(0, keys.length - 120)).forEach(k => delete store[k]);
                localStorage.setItem(DVP_ARCHIVE_KEY, JSON.stringify(store));
            } catch (e) { /* best-effort */ }
        }

        // From the bucketed (gradeScore -> hit) data, derive the gradeScore
        // cutoffs that make the LETTERS monotonic: A ≥ 57% real, B ≥ 53%,
        // C ≥ 50%, else D. calculateEdgeScore reads these when present so the
        // grade you see is anchored to what actually happened.
        function deriveGradeCutoffs(scoreBuckets) {
            // Histogram of gradeScore at 0.05 resolution.
            const cnt = [];
            for (let b = 0; b < 20; b++) cnt.push((scoreBuckets[b] || { n: 0 }).n);
            const tot = cnt.reduce((a, x) => a + x, 0);
            if (tot < 4000) return null;
            // Quantile-based cutoffs so every letter is a non-empty tier and the
            // ordering can't invert; the DISPLAYED hit rate is the truth about
            // how much separation there actually is.  A=top 12%, B=next 18%,
            // C=next 35%, D=bottom 35%.
            const scoreAtPct = (p) => {
                const want = tot * (1 - p); // count from the bottom
                let acc = 0;
                for (let b = 0; b < 20; b++) { acc += cnt[b]; if (acc >= want) return b / 20; }
                return 0.95;
            };
            let A = scoreAtPct(0.28), B = scoreAtPct(0.50);
            // D = the model's clear anti-picks (both factors against + projection
            // on the wrong side); C is the mushy middle above that.
            let C = Math.max(scoreAtPct(0.72), 0.14);
            if (B >= A) B = Math.max(C + 0.03, A - 0.05);
            if (C >= B) C = Math.max(0.14, B - 0.05);
            return { A: Math.round(A * 100) / 100, B: Math.round(B * 100) / 100, C: Math.round(C * 100) / 100 };
        }
        // Per-sport grade cutoffs, populated by each sport's backtest.
        // Shape: { mlb: {A,B,C}, nfl: {A,B,C} }.
        let GRADE_CUTOFFS = {};
        try {
            const raw = JSON.parse(localStorage.getItem('beatsedge_grade_cutoffs_v1') || 'null');
            // migrate the old single-object shape → {mlb: ...}
            if (raw && typeof raw.A === 'number') GRADE_CUTOFFS = { mlb: raw };
            else if (raw) GRADE_CUTOFFS = raw;
        } catch (e) { }

        // Per-sport PROBABILITY calibration curve, populated by each sport's
        // backtest. The model's raw probability is a good RANKING but the scale
        // can be off (MLB backtest: raw "75%" calls actually landed ~94%, raw
        // "45%" calls ~33% — the estimate was squashed toward 50%). This maps
        // the raw estimate onto the frequency those estimates have actually hit.
        // Shape: { mlb: [[rawPct, actualPct], ...] } sorted by rawPct.
        let PROB_CALIB = {};
        try {
            const raw = JSON.parse(localStorage.getItem('beatsedge_prob_calib_v1') || 'null');
            if (raw && typeof raw === 'object') PROB_CALIB = raw;
        } catch (e) { }
        // Build a raw→actual curve from a backtest's probability buckets
        // ({ '<50': {n, hit, sumPct}, ... }). Returns null when the sample is
        // thin or the model is already well calibrated (nothing to correct).
        function deriveProbCalib(probBuckets) {
            const pts = [];
            let tot = 0;
            BT_PROB_BUCKETS.forEach(k => {
                const b = probBuckets[k];
                if (b && b.n >= 200 && b.sumPct != null) { pts.push({ x: b.sumPct / b.n, y: (b.hit / b.n) * 100, n: b.n }); tot += b.n; }
            });
            if (pts.length < 3 || tot < 4000) return null;
            pts.sort((a, b) => a.x - b.x);
            // Enforce a non-decreasing curve (weighted pool-adjacent-violators).
            for (let i = 1; i < pts.length; i++) {
                if (pts[i].y < pts[i - 1].y) {
                    const w = pts[i - 1].n + pts[i].n;
                    const m = (pts[i - 1].y * pts[i - 1].n + pts[i].y * pts[i].n) / w;
                    pts[i - 1].y = pts[i].y = m;
                }
            }
            const maxDev = Math.max(...pts.map(p => Math.abs(p.y - p.x)));
            if (maxDev < 3) return null; // already calibrated — don't store noise
            return pts.map(p => [Math.round(p.x * 10) / 10, Math.round(p.y * 10) / 10]);
        }
        // Apply the stored curve to a 0-1 probability. Piecewise-linear between
        // anchors; OUTSIDE the fitted range the endpoint value is held flat
        // (no extrapolation — there's no data out there, and a steep last
        // segment would otherwise fling an 80% raw estimate to 99%). Monotone,
        // re-clamped 1-99%.
        function applyProbCalib(p01, sport) {
            const cal = PROB_CALIB && PROB_CALIB[sport];
            if (!Array.isArray(cal) || cal.length < 2) return p01;
            const x = p01 * 100;
            if (x <= cal[0][0]) return Math.max(0.01, Math.min(0.99, cal[0][1] / 100));
            if (x >= cal[cal.length - 1][0]) return Math.max(0.01, Math.min(0.99, cal[cal.length - 1][1] / 100));
            let seg;
            for (let i = 1; i < cal.length; i++) { if (x <= cal[i][0]) { seg = [cal[i - 1], cal[i]]; break; } }
            const [[x0, y0], [x1, y1]] = seg;
            const y = y0 + (y1 - y0) * (x - x0) / ((x1 - x0) || 1);
            return Math.max(0.01, Math.min(0.99, y / 100));
        }

        // ESPN returns some fields (injury type, status) as either a plain
        // string OR an object like {name, description, abbreviation}. Everything
        // that reaches React as text must be flattened first, or it throws
        // "Objects are not valid as a React child" and blanks the whole page.
        function strOf(v) {
            if (v == null) return '';
            if (typeof v === 'string') return v;
            if (typeof v === 'number' || typeof v === 'boolean') return String(v);
            if (typeof v === 'object') return v.description || v.name || v.displayName || v.abbreviation || v.text || v.type || '';
            return String(v);
        }

        // ESPN / MLB status strings -> one of our tags. Softer statuses first.
        function normInjuryStatus(raw) {
            const s = strOf(raw).toUpperCase().trim();
            if (!s || s === 'ACTIVE') return null;
            if (/DOUBT/.test(s)) return 'DOUBTFUL';
            if (/PROBABLE/.test(s)) return 'PROBABLE';
            if (/QUESTION|DAY[- ]TO[- ]DAY|GAME[- ]TIME|GTD/.test(s)) return 'QUESTIONABLE';
            if (/\bIL\b|INJURED RESERVE|\b(7|10|15|60)[- ]DAY\b|SUSPEND|RESTRICTED|PATERNITY|BEREAVEMENT|SEASON[- ]ENDING|\bNFI\b|\bPUP\b/.test(s)) return 'OUT';
            if (/^OUT\b|\bOUT$/.test(s)) return 'OUT';
            return 'QUESTIONABLE';
        }
        // Loose position bucket so "same-spot backup" comparisons work.
        function posBucket(pos) {
            const p = (pos || '').toUpperCase();
            // NFL skill — the only spots where an injury actually redistributes
            // touches/targets to players we track props for.
            if (['RB', 'HB', 'FB', 'TB'].includes(p)) return 'RB';
            if (['WR', 'SE', 'FL'].includes(p)) return 'WR';
            if (p === 'TE') return 'TE';
            if (p === 'QB') return 'QB';
            // NFL non-skill (OL / DL / LB / DB / special teams) — no fantasy "next man up"
            if (['OG', 'OT', 'OL', 'OC', 'G', 'T', 'DE', 'DT', 'NT', 'DL', 'EDGE',
                 'LB', 'ILB', 'OLB', 'CB', 'FS', 'SAF', 'DB', 'LS', 'KR', 'PR'].includes(p)) return 'NONSKILL';
            // MLB
            if (['LF', 'CF', 'RF', 'OF'].includes(p)) return 'OF';
            if (['2B', 'SS', 'MIF'].includes(p)) return 'MIF';
            if (['1B', '3B', 'CIF'].includes(p)) return 'COR';
            if (['SP', 'RP'].includes(p)) return 'P';
            if (p === 'C') return 'C';
            if (p === 'DH') return 'DH';
            return p || '?';
        }
        // Injured-position buckets that have a meaningful "next man up" among
        // the players we actually track props for. NBA is loose — a hurt
        // guard's minutes spread across the other guards/wings — so G/F/C
        // all qualify.
        const NEXT_MAN_UP_BUCKETS = new Set(['RB', 'WR', 'TE', 'QB', 'OF', 'MIF', 'COR', 'C', 'DH', 'G', 'F']);
        const STATUS_ORDER = { OUT: 0, DOUBTFUL: 1, QUESTIONABLE: 2, PROBABLE: 3 };
        // How likely the sidelined player actually SITS (drives how big a bump
        // his backup gets, and whether we surface it at all).
        const SIDELINED_LIKELIHOOD = {
            OUT: { w: 1, label: 'out' },
            DOUBTFUL: { w: 0.8, label: 'doubtful — likely out' },
            QUESTIONABLE: { w: 0.5, label: 'questionable — 50/50' }
        };
        const VOLUME_WORD = { mlb: 'at-bats / innings', nba: 'minutes & usage', nfl: 'touches & targets', nhl: 'ice time' };

        // Which PropLine bookmaker key each platform tab maps to.
        const PLATFORM_BOOK = {
            prizepicks: 'prizepicks', underdog: 'underdog', sleeper: 'sleeper',
            parlayplay: 'parlayplay', betr: 'betr', pick6: 'pick6',
            fanduel: 'fanduel', draftkings: 'draftkings', betmgm: 'betmgm'
        };
        const DFS_PLATFORMS = new Set(['prizepicks', 'underdog', 'sleeper', 'parlayplay', 'betr', 'pick6']);

        // ── ParlayAPI (parlay-api.com) — optional SECOND DFS line source ─────
        // Fills the DFS books PropLine is thin on (Sleeper) and adds
        // ParlayPlay / Betr / Pick6. Merged as gap-fill only — PropLine stays
        // primary where both have a line. Rows carry no player_id → name join.
        const PARLAY_DFS_BOOKS = 'prizepicks,underdog,sleeper,parlayplay,betr,pick6';
        // ParlayAPI market_key → BeatsEdge statKey. Only the clean, gradeable
        // ones; its DFS-oddity markets ("halves with 25+ rec yds") are skipped.
        const PARLAY_MLB_MKT = {
            player_hits: 'hits', player_total_bases: 'totalBases', player_home_runs: 'homeRuns',
            player_rbis: 'rbis', player_runs: 'runs', player_singles: 'singles', player_doubles: 'doubles',
            player_triples: 'triples', player_stolen_bases: 'stolenBases',
            player_hits_runs_rbis: 'hitsRunsRbis', player_hits__runs__rbis: 'hitsRunsRbis',
            player_walks: 'batterWalks', player_batter_walks: 'batterWalks', player_bat_walks: 'batterWalks',
            player_hitter_strikeouts: 'batterStrikeouts',
            player_pitcher_strikeouts: 'strikeouts', player_strikeouts: 'strikeouts',
            player_earned_runs: 'earnedRuns', player_hits_allowed: 'hitsAllowed', player_pitching_outs: 'pitcherOuts'
        };
        const PARLAY_FB_MKT = {
            player_pass_yds: 'passYds', player_passing_yards: 'passYds', player_pass_yards: 'passYds',
            player_pass_tds: 'passTds', player_passing_touchdowns: 'passTds',
            player_pass_attempts: 'passAttempts', player_passing_attempts: 'passAttempts',
            player_pass_completions: 'passCompletions', player_completions: 'passCompletions',
            player_interceptions: 'interceptions',
            player_rush_yds: 'rushYds', player_rushing_yards: 'rushYds', player_rush_yards: 'rushYds',
            player_rush_attempts: 'rushAttempts', player_rushing_attempts: 'rushAttempts',
            player_rush_tds: 'rushTds', player_longest_rush: 'longRush',
            player_receiving_yards: 'recYds', player_rec_yds: 'recYds',
            player_receptions: 'receptions', player_rec_tds: 'recTds', player_receiving_tds: 'recTds',
            player_longest_reception: 'longRec', player_longest_rec: 'longRec',
            'player_rush+rec_yds': 'rushRecYds', player_rushing_and_receiving_yards: 'rushRecYds',
            'player_pass+rush_yds': 'passRushYds', player_pass_rush_yds: 'passRushYds',
            player_kicking_points: 'kickingPts', player_field_goal_made: 'fgMade', player_field_goals_made: 'fgMade'
        };
        const PARLAY_BB_MKT = {
            player_points: 'points', player_pts: 'points',
            player_rebounds: 'rebounds', player_reb: 'rebounds', player_total_rebounds: 'rebounds',
            player_assists: 'assists', player_ast: 'assists',
            'player_3-pt_made': 'threes', player_threes: 'threes', player_three_pointers_made: 'threes', player_3pt_made: 'threes',
            player_points_rebounds_assists: 'pra', player_pts_rebs_asts: 'pra', 'player_pts+rebs+asts': 'pra',
            player_points_rebounds: 'pr', player_pts_rebs: 'pr', 'player_pts+rebs': 'pr',
            player_points_assists: 'pa', player_pts_asts: 'pa', 'player_pts+asts': 'pa',
            player_rebounds_assists: 'ra', player_rebs_asts: 'ra', 'player_rebs+asts': 'ra',
            player_steals: 'steals', player_stl: 'steals',
            player_blocks: 'blocks', player_blk: 'blocks', player_blocked_shots: 'blocks',
            player_turnovers: 'turnovers', player_to: 'turnovers',
            player_blocks_steals: 'blocksSteals', player_steals_blocks: 'blocksSteals', 'player_blks+stls': 'blocksSteals'
        };

        // The dedicated "Injuries" page — plain-English: who's hurt, how fresh
        // the report is (that's the edge — act before the line moves), and who
        // stands to absorb the vacated playing time.
        function InjuriesView({ injuryNews, playersData, selectedSport, injuryDataSource, onOpenPlayer }) {
            const list = Array.isArray(injuryNews) ? injuryNews : [];
            const roster = Array.isArray(playersData) ? playersData : [];

            const nextManUp = (inj) => {
                if (!inj.team) return [];
                const b = posBucket(inj.position);
                // Only when the injured player's role actually redistributes to
                // someone we track props for — not an O-lineman, kicker, DB, or
                // an unknown position (news items with no position attached).
                if (!NEXT_MAN_UP_BUCKETS.has(b)) return [];
                return roster
                    .filter(p => (p.team || '').toUpperCase() === inj.team.toUpperCase()
                        && p.name !== inj.player
                        && (p.status === 'ACTIVE' || p.status === 'PROBABLE' || !p.status)
                        && posBucket(p.position) === b
                        && Array.isArray(p.props) && p.props.length)
                    .sort((a, c) => ((c._seasonStat && c._seasonStat.gamesPlayed) || 0) - ((a._seasonStat && a._seasonStat.gamesPlayed) || 0))
                    .slice(0, 2);
            };

            // A just-downgraded status (e.g. Questionable → Doubtful) is the
            // moment to bet the backup — float those to the very top.
            const sorted = [...list].sort((a, b) =>
                (b.statusTrend === 'down' ? 1 : 0) - (a.statusTrend === 'down' ? 1 : 0)
                || (STATUS_ORDER[a.status] ?? 4) - (STATUS_ORDER[b.status] ?? 4)
                || (Date.parse(b.timestamp) || 0) - (Date.parse(a.timestamp) || 0));

            return (
                <div className="injuries-view">
                    <div className="top-picks-intro">
                        <h1 className="top-picks-heading">Injury Wire</h1>
                        <p className="top-picks-subhead">
                            The edge in props isn't the model — it's <em>timing</em>. When a starter is
                            ruled out, the book takes minutes-to-hours to re-price everyone around him.
                            This page pulls the fastest free feeds (ESPN news headlines, the ESPN injury
                            report{selectedSport === 'mlb' ? ', and MLB transaction logs' : ''}), shows
                            <strong> how long ago</strong> each item broke, and names who should soak up
                            the freed-up {VOLUME_WORD[selectedSport] || 'usage'} so you can hit the
                            backup's line before it corrects.
                        </p>
                    </div>

                    {sorted.length === 0 ? (
                        <div className="loading" style={{ padding: '3rem' }}>
                            {injuryDataSource === 'checking' ? 'Checking the injury feeds…' : 'No injuries reported for today\'s slate.'}
                        </div>
                    ) : (
                        <div className="injury-list">
                            {sorted.map((inj, i) => {
                                const backups = nextManUp(inj);
                                const cls = inj.status === 'OUT' ? 'out' : inj.status === 'DOUBTFUL' ? 'doubtful'
                                    : inj.status === 'PROBABLE' ? 'probable' : 'questionable';
                                const likely = inj.status === 'PROBABLE' ? 'likely plays'
                                    : inj.status === 'QUESTIONABLE' ? '50/50'
                                    : inj.status === 'DOUBTFUL' ? 'likely sits' : 'out';
                                return (
                                    <div key={i} className={`injury-row ${inj.statusTrend === 'down' ? 'trend-down' : ''}`}>
                                        <div className="injury-row-head">
                                            <div className="injury-row-name">
                                                {inj.player}
                                                <span className="injury-row-team">{inj.team || '—'}{inj.position ? ` · ${inj.position}` : ''}</span>
                                            </div>
                                            <span className={`injury-status-pill ${cls}`}>{inj.status}</span>
                                        </div>
                                        <div className="injury-row-detail">
                                            {inj.injury && inj.injury !== 'Injury' ? <strong>{inj.injury}. </strong> : ''}
                                            {inj.update || 'No further detail.'}
                                        </div>
                                        <div className="injury-row-meta">
                                            <span title="How likely this player actually sits">{likely}</span>
                                            {inj.statusTrend === 'down' && inj.prevStatus && (
                                                <span className="status-trend"> · ▼ downgraded from {inj.prevStatus} — act before the line moves</span>
                                            )}
                                            {inj.statusTrend === 'up' && inj.prevStatus && (
                                                <span className="status-trend up"> · ▲ upgraded from {inj.prevStatus}</span>
                                            )}
                                            {' · '}{(inj.sources || []).join(' + ') || inj.source || 'feed'}
                                            {inj.ageLabel ? <span className="injury-fresh"> · {inj.ageLabel}</span> : ''}
                                        </div>
                                        {backups.length > 0 && (
                                            <div className="injury-nmu">
                                                <span className="injury-nmu-label">{inj.statusTrend === 'down' ? '🔥 ➜ Next man up' : '➜ Next man up'}</span>
                                                <div className="injury-nmu-text">
                                                    {backups.map((b, bi) => (
                                                        <span key={bi}>
                                                            <span
                                                                className="injury-nmu-name"
                                                                onClick={() => onOpenPlayer && onOpenPlayer(b)}
                                                            >{b.name}</span>
                                                            {b.position ? ` (${b.position})` : ''}{b.status === 'PROBABLE' ? ' — himself probable, but expected to play' : ''}{bi < backups.length - 1 ? ', then ' : ''}
                                                        </span>
                                                    ))}
                                                    {' '}— {inj.status === 'QUESTIONABLE' ? 'in line for' : 'likely to absorb'} {inj.player.split(' ').slice(-1)[0]}'s{' '}
                                                    {VOLUME_WORD[selectedSport] || 'role'} {inj.status === 'PROBABLE' ? 'if he sits' : `while he's ${inj.status.toLowerCase()}`}.
                                                    {inj.statusTrend === 'down' && <strong style={{ color: '#FF6B5F' }}> The book usually lags a downgrade by minutes-to-hours — hit their line now.</strong>}
                                                    {' '}<span className="injury-nmu-cta" onClick={() => backups[0] && onOpenPlayer && onOpenPlayer(backups[0])}>Check their props →</span>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                );
                            })}
                        </div>
                    )}
                </div>
            );
        }

        // ── News page — starting lineups first, then the wider news wire ────
        const NEWS_KIND_META = {
            lineup:  { badge: 'LINEUP',  cls: 'lineup',  icon: '📋' },
            injury:  { badge: 'INJURY',  cls: 'injury',  icon: '🩹' },
            roster:  { badge: 'ROSTER',  cls: 'roster',  icon: '🔁' },
            weather: { badge: 'WEATHER', cls: 'weather', icon: '🌦' },
            recap:   { badge: 'RECAP',   cls: 'recap',   icon: '📈' },
            news:    { badge: 'NEWS',    cls: 'news',     icon: '📰' }
        };
        const NEWS_KIND_ORDER = { lineup: 0, injury: 1, roster: 2, weather: 3, news: 4, recap: 5 };

        function NewsView({ lineups, lineupSource, slateNews, slateNewsSource, selectedSport, playersData, onOpenPlayer }) {
            const roster = Array.isArray(playersData) ? playersData : [];
            const findPlayer = (name) => {
                if (!name) return null;
                const n = name.toLowerCase();
                return roster.find(p => (p.name || '').toLowerCase() === n)
                    || roster.find(p => { const ln = (p.name || '').toLowerCase().split(' ').slice(-1)[0]; return ln && n.endsWith(ln) && n.split(' ')[0][0] === (p.name || '')[0].toLowerCase(); })
                    || null;
            };
            const PlayerLink = ({ name }) => {
                const p = findPlayer(name);
                return p
                    ? <span className="news-player-link" onClick={() => onOpenPlayer && onOpenPlayer(p)}>{name}</span>
                    : <span>{name}</span>;
            };

            const games = Array.isArray(lineups) ? lineups : [];
            const upcoming = games.filter(g => g.state !== 'Final' && g.state !== 'post');
            const finals = games.filter(g => g.state === 'Final' || g.state === 'post');

            const news = (Array.isArray(slateNews) ? slateNews : [])
                .slice()
                .sort((a, b) =>
                    (NEWS_KIND_ORDER[a.kind] ?? 4) - (NEWS_KIND_ORDER[b.kind] ?? 4)
                    || (Date.parse(b.published) || 0) - (Date.parse(a.published) || 0));
            const lineupNews = news.filter(n => n.kind === 'lineup');
            const otherNews = news.filter(n => n.kind !== 'lineup');

            const LineupCard = ({ g }) => (
                <div className="lineup-card">
                    <div className="lineup-card-head">
                        <div className="lineup-matchup">
                            <strong>{g.away}</strong> <span className="lineup-at">@</span> <strong>{g.home}</strong>
                            {(() => {
                                const live = g.state === 'in' || g.state === 'post' || g.state === 'Live' || g.state === 'Final'
                                    || /progress|final|delay|postpon|suspend/i.test(g.statusText || '');
                                const st = live && g.statusText ? ' · ' + String(g.statusText).replace(/^STATUS_/, '').replace(/_/g, ' ').toLowerCase().replace(/\b\w/g, c => c.toUpperCase()) : '';
                                return <span className="lineup-time">{g.startLabel}{st}</span>;
                            })()}
                        </div>
                        <span className={`lineup-status-pill ${g.confirmed ? 'confirmed' : 'projected'}`}>
                            {g.confirmed ? '✓ CONFIRMED' : '⏳ NOT POSTED'}
                        </span>
                    </div>

                    {(g.awayProb || g.homeProb) && (
                        <div className="lineup-probables">
                            <span className="lineup-probables-label">{selectedSport === 'mlb' ? 'Probable pitchers' : 'Starting QB'}</span>
                            <div><strong>{g.away}</strong> <PlayerLink name={g.awayProb || 'TBD'} /></div>
                            <div><strong>{g.home}</strong> <PlayerLink name={g.homeProb || 'TBD'} /></div>
                        </div>
                    )}

                    {(g.awayLineup && g.awayLineup.length >= 9) ? (
                        <div className="lineup-orders">
                            {[['away', g.away, g.awayLineup], ['home', g.home, g.homeLineup]].map(([side, abbr, ln]) => (
                                <div key={side} className="lineup-order-col">
                                    <div className="lineup-order-team">{abbr}</div>
                                    <ol className="lineup-order-list">
                                        {ln.map(s => (
                                            <li key={s.order}>
                                                <PlayerLink name={s.name} /> <span className="lineup-pos">{s.pos}</span>
                                            </li>
                                        ))}
                                    </ol>
                                </div>
                            ))}
                        </div>
                    ) : (
                        <div className="lineup-pending">
                            {g.note || (selectedSport === 'mlb'
                                ? 'Batting order posts ~2–3 hours before first pitch. Probable pitchers are set above.'
                                : 'Full lineup not published by a free source yet.')}
                        </div>
                    )}
                </div>
            );

            const NewsItem = ({ n }) => {
                const meta = NEWS_KIND_META[n.kind] || NEWS_KIND_META.news;
                return (
                    <div className={`news-item news-${meta.cls}`}>
                        <div className="news-item-head">
                            <span className={`news-kind ${meta.cls}`}>{meta.icon} {meta.badge}</span>
                            {n.teams && n.teams.length > 0 && <span className="news-teams">{n.teams.join(' · ')}</span>}
                            {n.ageLabel && <span className="news-age">{n.ageLabel}</span>}
                        </div>
                        <div className="news-headline">
                            {n.athlete ? <><PlayerLink name={n.athlete} />{' — '}</> : null}{n.headline}
                        </div>
                        {n.description && n.description !== n.headline && <div className="news-desc">{n.description}</div>}
                        {n.url && <a className="news-read" href={n.url} target="_blank" rel="noopener noreferrer">Read on ESPN →</a>}
                    </div>
                );
            };

            return (
                <div className="injuries-view news-view">
                    <div className="top-picks-intro">
                        <h1 className="top-picks-heading">News &amp; Lineups</h1>
                        <p className="top-picks-subhead">
                            Confirmed <strong>starting lineups</strong> are the fastest edge there is — a
                            posted batting order or a late scratch moves every related prop before the
                            book catches up. This page leads with lineups for today's slate, then the
                            wider news wire (starter calls, roster moves, weather, injuries) newest first.
                        </p>
                    </div>

                    {/* ── Starting lineups ─────────────────────────────────── */}
                    <div className="news-section-title">🏟️ Starting Lineups
                        <span className="news-section-note">
                            {lineupSource === 'checking' ? ' · loading…'
                                : lineupSource === 'unavailable' ? ' · no free lineup feed for this sport yet'
                                    : lineupSource === 'partial' ? ' · probables set, orders pending' : ' · live from statsapi'}
                        </span>
                    </div>
                    {games.length === 0 ? (
                        <div className="lineup-pending" style={{ margin: '0 0 1.5rem' }}>
                            {lineupSource === 'checking' ? 'Checking the lineup feed…' : 'No games on this slate.'}
                        </div>
                    ) : (
                        <div className="lineup-list">
                            {upcoming.map(g => <LineupCard key={g.key} g={g} />)}
                            {finals.length > 0 && (
                                <details className="lineup-finals">
                                    <summary>{finals.length} final game{finals.length === 1 ? '' : 's'} — lineups as played</summary>
                                    {finals.map(g => <LineupCard key={g.key} g={g} />)}
                                </details>
                            )}
                        </div>
                    )}

                    {/* ── Lineup / role news ───────────────────────────────── */}
                    {lineupNews.length > 0 && (
                        <>
                            <div className="news-section-title">📋 Lineup &amp; Role News</div>
                            <div className="news-wire">
                                {lineupNews.map((n, i) => <NewsItem key={i} n={n} />)}
                            </div>
                        </>
                    )}

                    {/* ── Everything else ──────────────────────────────────── */}
                    <div className="news-section-title">📰 News Wire
                        <span className="news-section-note">{slateNewsSource === 'live' ? ` · ${otherNews.length} from ESPN` : slateNewsSource === 'checking' ? ' · loading…' : ' · feed unavailable'}</span>
                    </div>
                    {otherNews.length === 0 ? (
                        <div className="lineup-pending">{slateNewsSource === 'checking' ? 'Loading the news wire…' : 'Nothing on the wire right now.'}</div>
                    ) : (
                        <div className="news-wire">
                            {otherNews.map((n, i) => <NewsItem key={i} n={n} />)}
                        </div>
                    )}
                </div>
            );
        }
        // NBA and NFL have real backend pipelines built (see beatsedge-backend).
        // NHL/MLB aren't wired up yet — shown but disabled rather than hidden,
        // so it's honest about what's coming vs. what silently doesn't exist.
        const SPORT_STATUS = { nba: 'ready', nfl: 'ready', nhl: 'ready', mlb: 'ready', ncaaf: 'ready' };

        // The backtest result for one sport (state holds { mlb: {...}, nfl: {...} }).
        function backtestForSport(backtest, sport) {
            if (!backtest) return null;
            if (backtest[sport]) return backtest[sport];            // per-sport map
            if (backtest.sport === sport) return backtest;          // legacy single-object
            return null;
        }
        // Grade → real hit rate from that sport's backtest.
        function calibrationFor(backtest, sport) {
            const bt = backtestForSport(backtest, sport);
            return bt ? bt.grades : null;
        }

        // ── Live-data freshness stamp ────────────────────────────────────────
        // Reads the ACTUAL last successful refresh time (ms epoch), not a
        // hardcoded string. Ticks itself so "32 sec ago" stays honest.
        const _TZ_ABBR = (() => {
            try {
                const p = new Intl.DateTimeFormat('en-US', { timeZoneName: 'short' }).formatToParts(new Date());
                return (p.find(x => x.type === 'timeZoneName') || {}).value || '';
            } catch (e) { return ''; }
        })();
        function LiveTimestamp({ ts, className, prefix }) {
            const [, force] = React.useState(0);
            React.useEffect(() => {
                if (!ts) return;
                const id = setInterval(() => force(n => n + 1), 10000);
                return () => clearInterval(id);
            }, [ts]);
            if (!ts) {
                return <span className={`live-ts ${className || ''}`}><span className="live-ts-dot pending" />Waiting for first data pull…</span>;
            }
            const sec = Math.max(0, Math.round((Date.now() - ts) / 1000));
            let label;
            if (sec < 60) label = `Live data · updated ${sec} sec ago`;
            else if (sec < 3600) label = `Live data · updated ${Math.round(sec / 60)} min ago`;
            else {
                const t = new Date(ts).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
                label = `Last updated ${t}${_TZ_ABBR ? ' ' + _TZ_ABBR : ''}`;
            }
            const stale = sec > 900;
            return (
                <span className={`live-ts ${className || ''}`} title={new Date(ts).toLocaleString()}>
                    <span className={`live-ts-dot ${stale ? 'stale' : 'live'}`} />
                    {prefix ? prefix + ' ' : ''}{label}
                </span>
            );
        }

        // ── Free → Pro soft gate ────────────────────────────────────────────
        function ProLock({ title, text, onUnlock, compact }) {
            return (
