                <div className={`pro-lock-card ${compact ? 'compact' : ''}`}>
                    <div className="pro-lock-title">🔒 {title}</div>
                    {text && <div className="pro-lock-text">{text}</div>}
                    <div className="pro-lock-sub">You've reached the Free plan limit.</div>
                    <button className="pro-lock-btn" onClick={onUnlock}>Unlock full BeatsEdge research</button>
                </div>
            );
        }

        function TopPicksView({ playersData, loading, selectedSport, onSwitchSport, onOpenPick, backtest, onRunBacktest, backtestRunning, isPro, onUnlock, dataUpdatedAt }) {
            const research = !loading && Array.isArray(playersData) && playersData.length > 0
                ? findResearchPicks(playersData)
                : { overs: [], unders: [] };
            const hasAny = research.overs.length + research.unders.length > 0;

            const verdictClass = (label) => label === 'GREEN MATCHUP' ? 'green' : (label === 'RED MATCHUP' ? 'red' : 'mixed');
            const otherReadySports = Object.keys(SPORT_STATUS).filter(s => SPORT_STATUS[s] === 'ready' && s !== selectedSport);
            const bt = backtestForSport(backtest, selectedSport);
            const cal = bt ? bt.grades : null;
            const canBacktest = (selectedSport === 'mlb' || selectedSport === 'nfl' || selectedSport === 'nba') && Array.isArray(playersData) && playersData.some(p => p.sport === selectedSport);

            const PickCard = ({ p, n }) => {
                const why = p.edge.factors.filter(f => f.supports).map(f => f.name);
                return (
                    <div
                        className="top-pick-card top-pick-card-click"
                        onClick={() => onOpenPick(p.player, p.propIdx)}
                        title="Tap for the full research breakdown"
                    >
                        <div className="top-pick-rank-row">
                            <div className="top-pick-sport-label">{SPORT_ICONS[selectedSport]} {SPORT_LABELS[selectedSport]}</div>
                            <div className="top-pick-rank">{p.prop.direction === 'under' ? 'U' : 'O'}#{n}</div>
                        </div>
                        <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', gap: '1rem' }}>
                            <div style={{ display: 'flex', gap: '0.7rem', alignItems: 'flex-start' }}>
                                {p.player.headshot && (
                                    <img className="edge-prop-photo" style={{ width: '40px', height: '40px' }} src={p.player.headshot} alt="" loading="lazy" onError={(e) => { e.target.style.display = 'none'; }} />
                                )}
                                <div>
                                    <div className="top-pick-player">{p.player.name}</div>
                                    <div className="top-pick-prop">
                                        {p.prop.type} {p.prop.direction === 'under' ? 'U' : 'O'}{p.prop.line}
                                        {p.prop.lineSource ? <span className="top-pick-real" title={p.prop.lineSource}> ●</span> : (p.prop.isProjection ? <span className="top-pick-proj"> proj</span> : '')}
                                    </div>
                                </div>
                            </div>
                            <div className={`grade-badge ${GRADE_META[p.edge.grade].cls}`} title={GRADE_META[p.edge.grade].label}>
                                <div className="grade-badge-letter">{p.edge.grade}</div>
                                <div className="grade-badge-caption">Grade</div>
                            </div>
                        </div>
                        <div className="top-pick-confidence-row">
                            <div className="top-pick-confidence-number">{p.edge.modelProbPct}%</div>
                            <div className="top-pick-confidence-label">model probability · {p.edge.confidence}% factor alignment</div>
                        </div>
                        <div className={`top-pick-verdict ${verdictClass(p.edge.matchupLabel)}`}>
                            {p.edge.matchupLabel} • {p.edge.greenCount}/{p.edge.totalFactors} aligned
                        </div>
                        <div className="top-pick-why">
                            <span className="top-pick-why-label">Why:</span>{' '}
                            {why.length ? why.join(' · ') : 'model edge only — factors are mixed'}
                        </div>
                        <div className="top-pick-meta">Edge: {p.edge.edgePct >= 0 ? '+' : ''}{p.edge.edgePct}% · Model: {p.edge.projection} vs {p.prop.line} ({p.edge.edge >= 0 ? '+' : ''}{p.edge.edge})</div>
                        <button
                            className="top-pick-details-btn"
                            onClick={(e) => { e.stopPropagation(); onOpenPick(p.player, p.propIdx); }}
                        >See full research →</button>
                    </div>
                );
            };

            return (
                <div className="top-picks-view">
                    <div className="top-picks-intro">
                        <h1 className="top-picks-heading">Today's BeatsEdge Research</h1>
                        <LiveTimestamp ts={dataUpdatedAt} className="research-freshness" />
                        <p className="top-picks-subhead">
                            The 2 best <strong>overs</strong> and 2 best <strong>unders</strong> for {SPORT_LABELS[selectedSport]},
                            ranked by the same grade + probability engine as full Browse. A signal to
                            evaluate, not a guarantee. Tap any card for the full factor-by-factor
                            research breakdown.
                        </p>
                    </div>

                    <div className={`backtest-panel ${!isPro ? 'pro-locked' : ''}`}>
                        {!isPro && (
                            <div className="pro-lock-overlay">
                                <ProLock compact title="Historical Model Performance"
                                    text="See how every grade has actually landed, walk-forward over hundreds of thousands of real prop-sides."
                                    onUnlock={onUnlock} />
                            </div>
                        )}
                        <div className="backtest-panel-head">
                            <div>
                                <div className="backtest-panel-title">🧪 Model accuracy — {SPORT_LABELS[selectedSport]}</div>
                                <div className="backtest-panel-sub">
                                    {bt
                                        ? `Walk-forward over ${bt.total.n.toLocaleString()} graded prop-sides from real game logs · ${new Date(bt.ranAt).toLocaleDateString()} · baseline any-side ${bt.total.rate}%`
                                        : 'Never run. This checks the grade engine against what actually happened, game by game, so the letters mean something.'}
                                </div>
                            </div>
                            {canBacktest && isPro && (
                                <button className="backtest-run-btn" disabled={backtestRunning} onClick={onRunBacktest}>
                                    {backtestRunning ? 'Running…' : (cal ? 'Re-run' : 'Run backtest')}
                                </button>
                            )}
                        </div>
                        {cal && (
                            <React.Fragment>
                                <div className="backtest-grades">
                                    {['A', 'B', 'C', 'D'].map(g => (
                                        <div key={g} className={`backtest-grade ${GRADE_META[g].cls}`}>
                                            <div className="backtest-grade-letter">{g}</div>
                                            <div className="backtest-grade-rate">{cal[g].rate != null ? `${cal[g].rate}%` : '—'}</div>
                                            <div className="backtest-grade-n">{cal[g].n.toLocaleString()} picks</div>
                                        </div>
                                    ))}
                                </div>
                                <div className="backtest-panel-note">
                                    Hit rate = how often that grade's favored side actually landed, walk-forward, one game at a time.
                                    Break-even at −110 is ~52.4%. Lines here are synthetic (the player's own coin-flip number) and
                                    juice isn't modeled, so read this as <strong>directional</strong>: how well the letter ranks a lean.
                                    {cal.A.rate != null && cal.C.rate != null && (cal.A.rate - cal.C.rate < 4)
                                        ? ' Right now A and C are close — the engine separates "bet this side" from "fade this side" (see D) better than it separates good from great.'
                                        : ''}
                                    {cal.D.rate != null && cal.D.rate <= 40
                                        ? ` D's side lands just ${cal.D.rate}% — fading D picks is the sharpest read.`
                                        : ''}
                                </div>
                                {bt.prob && Object.keys(bt.prob).length > 0 && (() => {
                                    const rows = BT_PROB_BUCKETS.filter(k => bt.prob[k]).map(k => bt.prob[k] && ({ k, ...bt.prob[k] }));
                                    const wN = rows.reduce((s, r) => s + r.n, 0);
                                    const wGap = wN ? Math.round(rows.reduce((s, r) => s + (r.rate - r.mid) * r.n, 0) / wN) : 0;
                                    const hi = rows.filter(r => r.mid >= 60);
                                    const hiN = hi.reduce((s, r) => s + r.n, 0);
                                    const hiGap = hiN ? Math.round(hi.reduce((s, r) => s + (r.rate - r.mid) * r.n, 0) / hiN) : null;
                                    const rawRows = bt.probRaw ? BT_PROB_BUCKETS.filter(k => bt.probRaw[k]).map(k => ({ k, ...bt.probRaw[k] })) : [];
                                    const rawHi = rawRows.filter(r => r.mid >= 60);
                                    const rawHiN = rawHi.reduce((s, r) => s + r.n, 0);
                                    const rawHiGap = rawHiN ? Math.round(rawHi.reduce((s, r) => s + (r.rate - r.mid) * r.n, 0) / rawHiN) : null;
                                    return (
                                        <div className="backtest-calib">
                                            <div className="backtest-calib-title">Probability calibration — when it says a number, does that side hit that often?</div>
                                            <table className="backtest-calib-tbl">
                                                <thead><tr><th>BeatsEdge says</th><th>Actually hit</th><th>Sample</th><th>Gap</th></tr></thead>
                                                <tbody>
                                                    {rows.map(r => {
                                                        const gap = Math.round((r.rate - r.mid) * 10) / 10;
                                                        const cls = Math.abs(gap) <= 3 ? 'calib-ok' : gap < 0 ? 'calib-over' : 'calib-under';
                                                        return (
                                                            <tr key={r.k}>
                                                                <td>{r.k === '<50' ? 'under 50%' : r.k === '75+' ? '75%+' : r.k + '%'}</td>
                                                                <td><strong>{r.rate}%</strong></td>
                                                                <td>{r.n.toLocaleString()}</td>
                                                                <td className={cls}>{gap >= 0 ? '+' : ''}{gap}</td>
                                                            </tr>
                                                        );
                                                    })}
                                                </tbody>
                                            </table>
                                            <div className="backtest-calib-note">
                                                Gap = actual minus what the number claims (the mean stated probability in that band).
                                                {hiGap != null && hiGap <= -4
                                                    ? ` The app's 60%+ calls still run about ${Math.abs(hiGap)} points hot — a shown 70% is really closer to ${70 + hiGap}%.`
                                                    : hiGap != null && Math.abs(hiGap) <= 3
                                                        ? ' The shown numbers land within a few points of reality — calibration looks good.'
                                                        : ` Weighted across every band the shown number runs ${wGap >= 0 ? '+' : ''}${wGap} points vs reality.`}
                                                {bt.probCurve && rawHiGap != null && Math.abs(rawHiGap) >= 4
                                                    ? ` A backtest calibration curve is applied: before it, this sport's raw 60%+ estimates were ${rawHiGap >= 0 ? '+' : ''}${rawHiGap} pts off — the shown probability is the corrected one.`
                                                    : bt.probCurve
                                                        ? ' A backtest calibration curve is applied so the shown probability tracks real frequency.'
                                                        : ''}
                                            </div>
                                        </div>
                                    );
                                })()}
                                {bt.align && Object.keys(bt.align).length > 0 && (() => {
                                    const rows = Object.keys(bt.align).map(k => ({ k: +k, ...bt.align[k] })).sort((a, b) => a.k - b.k);
                                    const solid = rows.filter(r => r.n >= 200);
                                    const lo = solid[0] || rows[0];
                                    const hiR = solid.length ? solid.reduce((a, b) => b.k > a.k ? b : a) : rows[rows.length - 1];
                                    const spread = (lo && hiR && lo !== hiR) ? hiR.rate - lo.rate : null;
                                    return (
                                        <div className="backtest-calib">
                                            <div className="backtest-calib-title">Factor confluence — does more agreement mean a higher hit rate?</div>
                                            <table className="backtest-calib-tbl">
                                                <thead><tr><th>Factors aligned</th><th>Actually hit</th><th>Sample</th></tr></thead>
                                                <tbody>
                                                    {rows.map(r => (
                                                        <tr key={r.k}>
                                                            <td>{r.k} of ~{r.avgTotal}</td>
                                                            <td><strong>{r.rate}%</strong></td>
                                                            <td>{r.n.toLocaleString()}</td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                            <div className="backtest-calib-note">
                                                {spread == null
                                                    ? 'Not enough spread in aligned-factor counts to judge.'
                                                    : spread >= 8
                                                        ? `Clear monotonic lift — going from ${lo.k} aligned to ${hiR.k} aligned moves the hit rate ${lo.rate}% → ${hiR.rate}% (${spread >= 0 ? '+' : ''}${spread} pts). Factor confluence is a real signal; the "X/Y aligned" line is earning its place.`
                                                        : spread >= 4
                                                            ? `Some lift (${lo.rate}% → ${hiR.rate}%, ${spread >= 0 ? '+' : ''}${spread} pts across the range) — confluence helps a little but isn't a dominant input.`
                                                            : `Almost flat (${lo.rate}% → ${hiR.rate}%, only ${spread} pts across the whole range). Factor COUNT is mostly cosmetic here — the model's edge is in which factors fire, not how many.`}
                                            </div>
                                        </div>
                                    );
                                })()}
                                {bt.gradeConf && Object.keys(bt.gradeConf).length >= 4 && (() => {
                                    const cell = (g, t) => bt.gradeConf[g + '|' + t] || null;

                                                    : gSpread != null && Math.abs(gSpread) < 3

                                                            : ` Grade moves it ~${tSpread == null ? '?' : tSpread} pts (confluence fixed), confluence moves it ~${gSpread == null ? '?' : gSpread} pts (grade fixed)${best ? `. Strongest cell: ${best.g} + ${tierWord[best.t]} confluence at ${best.rate}%` : ''}.`}
                                            </div>
                                        </div>
                                    );
                                })()}
                                {bt.confEdge && Object.keys(bt.confEdge).length >= 4 && (() => {

                                    const clsFor = (rate) => rate == null ? '' : rate >= 55 ? 'calib-ok' : rate >= 50 ? 'calib-under' : 'calib-over';

                                    const weak = cell('low', 'small');

                                    const edgeOnlyR = avg(edgeOnly), confOnlyR = avg(confOnly);
                                    const cornerVsWeak = (corner && weak) ? corner.rate - weak.rate : null;
                                    const tierLbl = { small: 'small edge', med: 'medium edge', large: 'large edge' };

                                                Edge tier = how far the projection sits past the line (% of the line): small &lt;4%, medium 4–11%, large ≥11%.

                                                      (edgeOnlyR != null && confOnlyR != null

                                                    : ' Not enough sample in the corner cells yet.'}

                                {bt.gce && Object.keys(bt.gce).length >= 3 && (() => {

                });
            }, [selectedSport, selectedDate, balldontlieKey, backendUrl, proplineKey, parlayApiKey]);

            // Keep the cache warm with whatever's currently loaded — but ONLY
            // under the key for the sport these players actually belong to.
            // During a sport switch this effect re-runs while playersData still
            // holds the PREVIOUS sport's roster; writing that under the new
            // sport's key poisons the cache and the restore branch above would
            // then show the wrong sport's players under the new tab.
            useEffect(() => {
                if (!Array.isArray(playersData) || !playersData.length || loading) return;
                if (!slateMatchesSport(playersData, selectedSport)) return;
                // Never cache a sample/mock fallback — it would be restored as a
                // real slate (and mislabelled "LIVE") on the next visit.
                if (playersData.some(p => p && p._mock)) return;
                slateCache.current[`${selectedSport}|${selectedDate}`] = { at: Date.now(), players: playersData };
            }, [playersData, loading, selectedSport, selectedDate]);

            // Switching the platform tab (PrizePicks / FanDuel / …) does NOT
            // refetch — every book's lines are already cached on each MLB
            // player as `_allLines`. Just rebuild `props` for the chosen book.
            useEffect(() => {
                const wantBook = PLATFORM_BOOK[selectedPlatform] || 'prizepicks';
                setPlayersData(prev => {
                    if (!prev.some(p => (p.sport === 'mlb' || p.sport === 'nfl' || p.sport === 'ncaaf' || p.sport === 'nba') && p._allLines)) return prev;
                    return prev.map(p => {
                        if (!p._allLines) return p;
                        if (p.sport === 'mlb') {
                            const nextByKey = { ...p.statsByKey };
                            let props = mlbBuildProps(p._seasonStat || {}, !!p._isPitcher, nextByKey, p._allLines, wantBook);
                            props = sortPropsByEdge({ ...p, statsByKey: nextByKey }, props);
                            return {
                                ...p, props, statsByKey: nextByKey,
                                stats: props.length ? nextByKey[props[0].statKey] : p.stats,
                                _noLiveLines: !props.some(pr => pr.lineSource)
                            };
                        }
                        if (p.sport === 'nfl' || p.sport === 'ncaaf') {
                            const nextByKey = { ...p.statsByKey };
                            const posKeys = nflPosKeys(p.position).filter(k => p._allLines[k]);
                            const perGameFor = (k) => { const w = nextByKey[k]; return (w && (w.season.avg || w.recent.avg)) || 0; };
                            let props = nflBuildProps(posKeys, nextByKey, p._allLines, wantBook, perGameFor);
                            props = sortPropsByEdge({ ...p, statsByKey: nextByKey }, props);
                            return {
                                ...p, props, statsByKey: nextByKey,
                                stats: props.length ? (nextByKey[props[0].statKey] || p.stats) : p.stats,
                                _noLiveLines: !props.some(pr => pr.lineSource)
                            };
                        }
                        if (p.sport === 'nba') {
                            const nextByKey = { ...p.statsByKey };
                            const perGameFor = (k) => { const w = nextByKey[k]; return (w && (w.season.avg || w.recent.avg)) || 0; };
                            let props = nbaBuildProps(nextByKey, p._allLines, wantBook, perGameFor);
                            props = sortPropsByEdge({ ...p, statsByKey: nextByKey }, props);
                            return {
                                ...p, props, statsByKey: nextByKey,
                                stats: props.length ? (nextByKey[props[0].statKey] || p.stats) : p.stats,
                                _noLiveLines: !props.some(pr => pr.lineSource)
                            };
                        }
                        return p;
                    });
                });
            }, [selectedPlatform]);

            // Snapshot the day's real lines to the local archive (best-effort;
            // fires once real PropLine data has merged in). ~21 days retained —
            // the seed for a future real market backtest.
            useEffect(() => {
                if (!Array.isArray(playersData)) return;
                const hasReal = playersData.some(p => Array.isArray(p.props) && p.props.some(pr => pr.lineSource && !pr.altLine && !pr.crossBook));
                if (hasReal) archiveLines(selectedSport, selectedDate, playersData);
                // NBA: also snapshot today's Defense-vs-Position + team-defense
                // ranks, dated — so those factors become walk-forward testable
                // later (right now they'd be look-ahead in the backtest).
                if (selectedSport === 'nba' && hasReal) {
                    try { archiveDvpSnapshot(new Date().toISOString().slice(0, 10), NBA_DVP, (nbaCache.current && nbaCache.current.oppRankByAbbr) || null); } catch (e) { }
                }
            }, [playersData, selectedSport, selectedDate]);

            const fetchData = async (mySeq) => {
                // True once the user has navigated to a different sport/date (or
                // the effect otherwise re-ran) while this call was awaiting.
                const stale = () => mySeq != null && loadSeqRef.current !== mySeq;
                try {
                    setLoading(true);

                    // 1. Load the base player/prop dataset first so we know which
                    //    teams are actually in play. For MLB this is now the REAL
                    //    full slate for the selected date, pulled live from
                    //    statsapi.mlb.com (keyless, CORS-open). Every other sport
                    //    still uses sample players until its real slate is wired.
                    //    Prop LINES: real for MLB when a PropLine key is set
                    //    (see fetchMlbPropLines); sample otherwise.
                    let players;
                    if (selectedSport === 'mlb') {
                        try {
                            players = await fetchMlbSlate(selectedDate);
                            setMlbSlateSource(players.length ? 'live' : 'sample');
                            if (!players.length) players = generateMockPlayerData('mlb');
                        } catch (err) {
                            console.warn('MLB live slate failed, falling back to sample data:', err.message);
                            if (!stale()) setMlbSlateSource('sample');
                            players = generateMockPlayerData('mlb');
                        }
                    } else if (selectedSport === 'nfl') {
                        setMlbSlateSource('checking');
                        try {
                            const slate = await fetchNflSlate(selectedDate);
                            if (!slate.slots.length) {
                                setNflSlateSource('sample');
                                players = generateMockPlayerData('nfl');
                            } else if (!proplineKey || !backendUrl) {
                                setNflSlateSource('sample');
                                setProplineError(!proplineKey ? 'Add a PropLine key in Data Sources for real NFL lines.' : 'PropLine needs "Your Backend" URL set too.');
                                players = generateMockPlayerData('nfl');
                            } else {
                                players = await fetchNflPropLines(slate, stale);
                                if (stale()) return;
                                setNflSlateSource(players.length ? 'live' : 'sample');
                                if (!players.length) players = generateMockPlayerData('nfl');
                            }
                        } catch (err) {
                            console.warn('NFL slate failed, falling back to sample:', err.message);
                            if (!stale()) setNflSlateSource('sample');
                            players = generateMockPlayerData('nfl');
                        }
                    } else if (selectedSport === 'ncaaf') {
                        setMlbSlateSource('checking');
                        try {
                            const slate = await fetchCfbSlate(selectedDate);
                            if (!slate.slots.length) {
                                if (!stale()) setCfbSlateSource('sample');
                                players = [];
                            } else if (!proplineKey || !backendUrl) {
                                setCfbSlateSource('sample');
                                setProplineError(!proplineKey ? 'Add a PropLine key in Data Sources for real CFB lines.' : 'PropLine needs "Your Backend" URL set too.');
                                players = [];
                            } else {
                                players = await fetchCfbPropLines(slate, stale);
                                if (stale()) return;
                                setCfbSlateSource(players.length ? 'live' : 'sample');
                            }
                        } catch (err) {
                            console.warn('CFB slate failed:', err.message);
                            if (!stale()) setCfbSlateSource('sample');
                            players = [];
                        }
                    } else if (selectedSport === 'nba') {
                        setMlbSlateSource('checking');
                        try {
                            if (!proplineKey || !backendUrl) {
                                setNbaSlateSource('sample');
                                setProplineError(!proplineKey ? 'Add a PropLine key in Data Sources for real NBA lines.' : 'PropLine needs "Your Backend" URL set too.');
                                players = generateMockPlayerData('nba');
                            } else {
                                const slate = await fetchNbaSlate(selectedDate);
                                if (!slate.slots.length) {
                                    if (!stale()) setNbaSlateSource('sample');
                                    players = generateMockPlayerData('nba');
                                } else {
                                    players = await fetchNbaPropLines(slate, stale);
                                    if (stale()) return;
                                    setNbaSlateSource(players.length ? 'live' : 'sample');
                                    if (!players.length) players = generateMockPlayerData('nba');
                                }
                            }
                        } catch (err) {
                            console.warn('NBA slate failed, falling back to sample:', err.message);
                            if (!stale()) setNbaSlateSource('sample');
                            players = generateMockPlayerData('nba');
                        }
                    } else {
                        players = await fetchPlayerProps();
                        setMlbSlateSource('checking');
                    }
                    // Bail before publishing if the user has since switched away.
                    if (stale()) return;
                    setPlayersData(players);
                    setLoading(false);
                    markFresh();

                    // 1b. For MLB, layer real recent-form windows (L5/L10) and the
                    //     real opposing-lineup batting profile on top, in a few
                    //     batched calls. Cards render immediately on season data
                    //     and upgrade in place as this resolves.
                    if (selectedSport === 'mlb' && players.length) {
                        await warmMlbSlateForm(players).catch(e => console.warn('MLB form warm-up failed:', e.message));
                        if (stale()) return;

                        // 1c. Replace the season-anchored SAMPLE prop lines with
                        //     real book lines from PropLine, when a key is set.
                        if (proplineKey) {
                            await fetchMlbPropLines(players, stale).catch(e => {
                                console.warn('PropLine fetch failed, keeping sample lines:', e.message);
                                if (stale()) return;
                                setPropLineSource('sample');
                                setProplineError(e.message);
                            });
                        } else {
                            setPropLineSource('sample');
                        }
                    }
                    if (stale()) return;

                    // 2. Layer REAL, keyless data on top from ESPN's public API:
                    //    live injury reports and today's live scoreboard. Both are
                    //    genuinely free with no signup. If ESPN is unreachable
                    //    (network/CORS in this browser), we fall back to sample
                    //    data and say so honestly in the UI.
                    await fetchLiveInjuries(players, stale);
                    if (stale()) return;
                    await fetchLiveScoreboard(stale);
                    if (stale()) return;
                    await fetchSlateLineups(players, stale);
                    if (stale()) return;
                    markFresh();
                    await fetchCombinedDefenseData(players);
                    if (stale()) return;
                    await fetchBallDontLieStats(players);
                    if (stale()) return;
                    await fetchPlayerSituationalData(players);
                    if (!stale()) markFresh();
                } catch (error) {
                    console.error('Error fetching data:', error);
                    if (!stale()) setLoading(false);
                }
            };

            // Try a direct fetch first; if that fails (CORS/network), retry once
            // through a public CORS-relay. If both fail, caller falls back to sample data.
            const fetchJSONWithFallback = async (url) => {
                try {
                    const res = await fetch(url);
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    return await res.json();
                } catch (directErr) {
                    try {
                        const proxied = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(url);
                        const res2 = await fetch(proxied);
                        if (!res2.ok) throw new Error('HTTP ' + res2.status);
                        return await res2.json();
                    } catch (proxyErr) {
                        throw proxyErr;
                    }
                }
            };

            // "3m ago" / "2h ago" — freshness is the whole point of an injury
            // feed: you want the news before the book corrects the line.
            const agoLabel = (ts) => {
                const t = Date.parse(ts);
                if (!t) return '';
                const m = Math.round((Date.now() - t) / 60000);
                if (m < 1) return 'just now';
                if (m < 60) return `${m}m ago`;
                if (m < 60 * 36) return `${Math.round(m / 60)}h ago`;
                return `${Math.round(m / 1440)}d ago`;
            };
            const NEWS_INJURY_RE = /\b(out|questionable|doubtful|day-to-day|dtd|injur|ruled out|will not play|won'?t play|placed on|activat|reinstat|return|left the game|exits?|leaves?|scratched|game-time|IL|DL|concussion|strain|sprain|soreness|surgery|MRI)\b/i;
            // Lineup / role news — the News page's top priority. Deliberately
            // strict: bare "start" / "starter" matches recaps and scheduling
            // blurbs ("to start a 3-game series"), so require lineup-specific
            // phrasing.
            const LINEUP_NEWS_RE = /\b(?:in the (?:starting )?lineup|out of the lineup|(?:back|return[s]?|rejoin[s]?|recalled) (?:to|in) (?:the )?(?:starting )?(?:lineup|rotation)|return[s]? to (?:the )?[A-Z][\w']+ ?(?:'s)? lineup|(?:starting|batting) (?:lineup|order)|(?:named|will be|is|is the|listed as) (?:the )?(?:starting|starter)\b|gets? the (?:start|nod|ball)|will (?:start|get the start|be under center)|(?:late )?scratch(?:ed|es)?|benched?|to the bench|activated (?:from|off)|reinstated|recall(?:s|ed)?|call(?:s|ed)?[ -]up|promoted to the (?:active roster|majors|big leagues?)|(?:ruled|listed as) (?:inactive|active)|game-time decision|expected to (?:start|play)|named (?:the )?starter|starting (?:pitcher|goalie|goaltender|quarterback|qb|center|nine|five)|to start at\b|makes? (?:his|her|the) (?:first|season) start)/i;
            const ROSTER_NEWS_RE = /\b(sign(?:s|ed|ing)?|trade[ds]?|acquire[ds]?|claim(?:ed|s)?|waive[ds]?|release[ds]?|(?:is|are|were) (?:released|cut)|designat(?:e|ed) for assignment|option(?:ed|s)? (?:to|down)|contract extension|DFA'?d?)\b/i;
            const WEATHER_NEWS_RE = /\b(rain(?:ed|ing|out)?|wind|snow|storm|postpone[ds]?|(?:weather|rain) delay|tarp (?:on|is)|game (?:suspended|postponed)|makeup game)\b/i;
            const RECAP_NEWS_RE = /(?:\b\d+-\d+\b|game highlights|final score|:\s*game highlights$)|\b(?:beat|beats|defeat[s]?|hold[s]? off|rally (?:past|to)|carries?|blank[s]?|edge[s]?|top[s]?|rout[s]?|snap[s]? (?:a |their )?\d|homers? (?:as|to)|walk-?off)\b/i;
            const NEWS_NOISE_RE = /\bfantasy (?:football|baseball|hockey|basketball)\b|\bforecaster\b|\bwaiver\b|start[\/-]?sit|\brankings?\b|cheat sheet|\bmock draft\b|best bets|how to bet\b|odds,? (?:tips|analysis)|betting (?:preview|preparations)|power rankings|\bpodcast\b|\bfree tix\b/i;

            const fetchLiveInjuries = async (players, isStale) => {
                const gone = () => typeof isStale === 'function' && isStale();
                try {
                    const espnPath = ESPN_SPORT_PATHS[selectedSport];
                    if (!espnPath) { setInjuryDataSource('sample'); return; }

                    // Only ask ESPN about teams that are actually on today's slate
                    const teams = Array.from(new Set(players.flatMap(p => [p.team, p.opponent]).filter(Boolean)));
                    if (teams.length === 0) { setInjuryDataSource('sample'); return; }

                    // Pull from several fast keyless feeds in parallel and merge.
                    const teamQuery = teams.map(t => `team=${encodeURIComponent(t)}`).join('&');
                    const [injData, newsData, txData] = await Promise.all([
                        fetchJSONWithFallback(`https://site.api.espn.com/apis/site/v2/sports/${espnPath}/injuries?${teamQuery}`).catch(() => null),
                        fetchJSONWithFallback(`https://site.api.espn.com/apis/site/v2/sports/${espnPath}/news?limit=50`).catch(() => null),
                        selectedSport === 'mlb'
                            ? fetch(`${MLB_API}/transactions?sportId=1&startDate=${selectedDate}&endDate=${selectedDate}`).then(r => r.ok ? r.json() : null).catch(() => null)
                            : Promise.resolve(null)
                    ]);

                    const bySlug = {}; // player name -> merged item (freshest wins)
                    const put = (item) => {
                        if (!item.player) return;
                        const k = item.player.toLowerCase();
                        const ex = bySlug[k];
                        const tNew = Date.parse(item.timestamp) || 0;
                        const tOld = ex ? (Date.parse(ex.timestamp) || 0) : -1;
                        if (!ex) { bySlug[k] = item; return; }
                        // keep the structured status; take the freshest headline/time
                        bySlug[k] = {
                            ...ex,
                            ...(tNew >= tOld ? { update: item.update || ex.update, timestamp: item.timestamp || ex.timestamp, source: item.source || ex.source } : {}),
                            status: (ex.source === 'ESPN Injury Report' ? ex.status : item.status) || ex.status || item.status,
                            team: ex.team || item.team,
                            position: ex.position || item.position,
                            injury: ex.injury && ex.injury !== 'Injury' ? ex.injury : (item.injury || ex.injury),
                            sources: Array.from(new Set([...(ex.sources || [ex.source]), item.source].filter(Boolean)))
                        };
                    };

                    // (a) ESPN structured injury report — the reliable status source.
                    // Shape varies: unfiltered -> {items:[teamBlock]}; team-filtered
                    // -> a single teamBlock at the top ({injuries:[athleteInj], team}ages);
                    // sometimes {injuries:[teamBlock]} where each teamBlock nests
                    // its own athlete `injuries`. Flatten all of them.
                    const collectAthleteInjuries = (node, teamHint) => {
                        if (!node || typeof node !== 'object') return;
                        const team = (node.team && (node.team.abbreviation || node.team.name)) || teamHint;
                        if (Array.isArray(node.injuries)) {
                            node.injuries.forEach(inj => {
                                if (inj && inj.athlete) {
                                    put({
                                        id: inj.id,
                                        player: strOf(inj.athlete.displayName),
                                        team: strOf(team || (inj.athlete.team && inj.athlete.team.abbreviation)),
                                        position: strOf(inj.athlete.position && (inj.athlete.position.abbreviation || inj.athlete.position.name)),
                                        status: normInjuryStatus(inj.status) || 'QUESTIONABLE',
                                        rawStatus: strOf(inj.status),
                                        injury: strOf(inj.details && inj.details.type) || strOf(inj.type) || 'Injury',
                                        update: strOf(inj.shortComment || inj.longComment),
                                        timestamp: strOf(inj.date),
                                        source: 'ESPN Injury Report'
                                    });
                                } else if (inj && Array.isArray(inj.injuries)) {
                                    collectAthleteInjuries(inj, team);
                                }
                            });
                        }
                    };
                    const roots = (injData && (Array.isArray(injData.items) ? injData.items : [injData])) || [];
                    roots.forEach(r => collectAthleteInjuries(r));

                    // (b) ESPN news headlines — usually the FASTEST signal (posts
                    //     within minutes of a beat-writer report).
                    (newsData && newsData.articles || []).forEach(a => {
                        const text = `${a.headline || ''} ${a.description || ''}`;
                        if (!NEWS_INJURY_RE.test(text)) return;
                        const cat = (a.categories || []).find(c => c.type === 'athlete' && c.athlete);
                        const tcat = (a.categories || []).find(c => c.type === 'team' && c.team);
                        const name = strOf(cat && (cat.athlete.displayName || cat.description));
                        if (!name) return;
                        put({
                            player: name,
                            team: strOf(tcat && tcat.team && (tcat.team.abbreviation || tcat.team.name)),
                            position: strOf(cat.athlete.position && (cat.athlete.position.abbreviation || cat.athlete.position.name)),
                            status: normInjuryStatus(text) || 'QUESTIONABLE',
                            injury: 'Injury',
                            update: strOf(a.headline),
                            timestamp: strOf(a.published || a.lastModified),
                            source: 'ESPN News'
                        });
                    });

                    // (c) MLB transactions — IL placements / activations, timestamped
                    (txData && txData.transactions || []).forEach(tx => {
                        const d = `${tx.description || ''} ${tx.typeDesc || ''}`;
                        if (!/injur|\bIL\b|\bDL\b|activat|reinstat/i.test(d)) return;
                        const name = tx.person && tx.person.fullName;
                        if (!name) return;
                        const activated = /activat|reinstat/i.test(d);
                        put({
                            player: name,
                            team: (tx.toTeam && tx.toTeam.abbreviation) || (tx.fromTeam && tx.fromTeam.abbreviation) || '',
                            position: '',
                            status: activated ? 'PROBABLE' : 'OUT',
                            injury: 'Injury',
                            update: tx.description || '',
                            timestamp: tx.date || tx.effectiveDate || '',
                            source: 'MLB Transactions'
                        });
                    });

                    const liveInjuries = Object.values(bySlug)
                        .map(i => ({
                            ...i,
                            player: strOf(i.player), team: strOf(i.team), position: strOf(i.position),
                            status: strOf(i.status) || 'QUESTIONABLE', rawStatus: strOf(i.rawStatus),
                            injury: strOf(i.injury) || 'Injury', update: strOf(i.update),
                            timestamp: strOf(i.timestamp),
                            ageLabel: agoLabel(strOf(i.timestamp)),
                            sources: (i.sources || (i.source ? [i.source] : [])).map(strOf).filter(Boolean)
                        }))
                        .filter(i => i.player)
                        .sort((a, b) => (Date.parse(b.timestamp) || 0) - (Date.parse(a.timestamp) || 0));

                    // Status trend vs the last refresh — a downgrade (e.g.
                    // QUESTIONABLE → DOUBTFUL) is the moment to bet the backup,
                    // before the book re-prices. Sticky for 2h so it survives
                    // a few refreshes.
                    const TREND_KEY = 'beatsedge_inj_status_v1', TREND_TTL = 2 * 3600 * 1000;
                    let prevStatusMap = {};
                    try { prevStatusMap = JSON.parse(localStorage.getItem(TREND_KEY) || '{}'); } catch (e) { }
                    const nextStatusMap = {}, _now = Date.now();
                    liveInjuries.forEach(i => {
                        const key = i.player.toLowerCase();
                        const prev = prevStatusMap[key];
                        const oNew = STATUS_ORDER[i.status] ?? 4;
                        const oOld = prev ? (STATUS_ORDER[prev.status] ?? 4) : null;
                        if (oOld != null && oNew < oOld) { i.statusTrend = 'down'; i.prevStatus = prev.status; i.trendSince = _now; }
                        else if (oOld != null && oNew > oOld) { i.statusTrend = 'up'; i.prevStatus = prev.status; i.trendSince = _now; }
                        else if (prev && prev.trendSince && (_now - prev.trendSince) < TREND_TTL) {
                            i.statusTrend = prev.statusTrend; i.prevStatus = prev.prevStatus; i.trendSince = prev.trendSince;
                        }
                        nextStatusMap[key] = { status: i.status, ts: _now, statusTrend: i.statusTrend || null, prevStatus: i.prevStatus || null, trendSince: i.trendSince || null };
                    });
                    try { localStorage.setItem(TREND_KEY, JSON.stringify(nextStatusMap)); } catch (e) { }

                    if (gone()) return;
                    setInjuryNews(liveInjuries);
                    setInjuryDataSource(liveInjuries.length ? 'live' : 'sample');

                    // Full news feed for the News page — every article, tagged by
                    // kind so lineup / role items can float to the top.
                    const allNews = ((newsData && newsData.articles) || []).map(a => {
                        const acat = (a.categories || []).find(c => c.type === 'athlete' && c.athlete);
                        const tcats = [...new Set((a.categories || [])
                            .filter(c => c.type === 'team' && c.team)
                            .map(c => strOf(c.team.abbreviation || c.team.name)).filter(Boolean))];
                        const headline = strOf(a.headline);
                        const text = `${headline} ${strOf(a.description)}`;
                        // Recap / noise first so a recap that mentions "the
                        // starting pitcher" isn't mislabelled a lineup alert.
                        const kind = NEWS_NOISE_RE.test(text) ? 'news'
                            : RECAP_NEWS_RE.test(headline) ? 'recap'
                                : LINEUP_NEWS_RE.test(text) ? 'lineup'
                                    : NEWS_INJURY_RE.test(text) ? 'injury'
                                        : ROSTER_NEWS_RE.test(text) ? 'roster'
                                            : WEATHER_NEWS_RE.test(text) ? 'weather'
                                                : 'news';
                        const ts = strOf(a.published || a.lastModified);
                        return {
                            headline,
                            description: strOf(a.description),
                            published: ts,
                            ageLabel: agoLabel(ts),
                            url: strOf(a.links && a.links.web && a.links.web.href),
                            athlete: strOf(acat && acat.athlete && (acat.athlete.displayName || acat.athlete.fullName)),
                            teams: tcats,
                            kind
                        };
                    }).filter(n => n.headline);
                    setSlateNews(allNews);
                    setSlateNewsSource(allNews.length ? 'live' : 'sample');

                    // Sidelined players per team for "next man up" — now
                    // OUT / DOUBTFUL / QUESTIONABLE (probable players are
                    // likely to play, so they don't free anyone's minutes).
                    const sidelinedByTeam = {};
                    liveInjuries.forEach(i => {
                        if (SIDELINED_LIKELIHOOD[i.status]) {
                            (sidelinedByTeam[i.team] = sidelinedByTeam[i.team] || []).push(i);
                        }
                    });

                    setPlayersData(prev => prev.map(p => {
                        const match = liveInjuries.find(i => i.player === p.name);
                        let next = p;
                        if (match) {
                            next = {
                                ...next,
                                status: match.status,
                                statusTrend: match.statusTrend || null,
                                prevStatus: match.prevStatus || null,
                                injury: match.injury,
                                injuryDetail: match.update || match.rawStatus || ''
                            };
                        } else if (p.statusTrend) {
                            next = { ...next, statusTrend: null, prevStatus: null };
                        }
                        // "Next man up": a healthy player whose team has a
                        // sidelined regular in the same position bucket — they
                        // stand to see more run. Skip the injured guy himself.
                        if ((!match || match.status === 'ACTIVE' || match.status === 'PROBABLE') && next.status !== 'OUT') {
                            const myBucket = posBucket(p.position);
                            const sidelined = NEXT_MAN_UP_BUCKETS.has(myBucket)
                                ? (sidelinedByTeam[p.team] || []).filter(i => posBucket(i.position) === myBucket && i.player !== p.name)
                                : [];
                            if (sidelined.length) {
                                // sort most-certain-out first
                                sidelined.sort((a, b) => (STATUS_ORDER[a.status] ?? 4) - (STATUS_ORDER[b.status] ?? 4));
                                const hot = sidelined.some(i => i.statusTrend === 'down');
                                const trigger = (sidelined.find(i => i.statusTrend === 'down') || {});
                                next = {
                                    ...next,
                                    opportunity: {
                                        covers: sidelined.map(i => ({
                                            name: i.player, position: i.position || '',
                                            status: i.status, likelihood: (SIDELINED_LIKELIHOOD[i.status] || {}).label || i.status.toLowerCase(),
                                            trend: i.statusTrend || null
                                        })),
                                        hot,
                                        trigger: hot ? `${trigger.player} just moved ${trigger.prevStatus || '?'} → ${trigger.status}` : null
                                    }
                                };
                            } else if (next.opportunity) {
                                next = { ...next, opportunity: null };
                            }
                        }
                        return next;
                    }));
                } catch (err) {
                    console.warn('Live ESPN injury fetch failed, using sample injury data:', err.message);
                    setInjuryDataSource('sample');
                    setSlateNewsSource('sample');
                    // Sample fallback so the news banner still has something to show
                    setInjuryNews([
                        { id: 1, player: 'LeBron James', team: 'LAL', status: 'QUESTIONABLE', injury: 'Ankle', update: "Game-time decision", timestamp: 'sample data' },
                        { id: 2, player: 'Kevin Durant', team: 'PHX', status: 'OUT', injury: 'Calf', update: 'Ruled out', timestamp: 'sample data' }
                    ]);
                }
            };

            // Starting lineups + probables for the News page. MLB has real
            // confirmed batting orders from statsapi (posted ~2-3h before first
            // pitch); other sports get probables + an honest "full lineup not
            // published by a free source yet" note.
            const fetchSlateLineups = async (players, isStale) => {
                const gone = () => typeof isStale === 'function' && isStale();
                try {
                    if (selectedSport === 'mlb') {
                        const sched = await mlbFetch(`/schedule?sportId=1&date=${selectedDate}&hydrate=lineups,probablePitcher,team,linescore`);
                        const games = (sched.dates && sched.dates[0] && sched.dates[0].games) || [];
                        const rows = games.map(g => {
                            const L = g.lineups || {};
                            const mapLine = (arr) => (arr || []).map((p, i) => ({
                                order: i + 1, id: String(p.id), name: p.fullName,
                                pos: (p.primaryPosition && p.primaryPosition.abbreviation) || ''
                            }));
                            const away = mapLine(L.awayPlayers), home = mapLine(L.homePlayers);
                            return {
                                key: String(g.gamePk),
                                away: g.teams.away.team.abbreviation, awayName: g.teams.away.team.teamName || g.teams.away.team.name,
                                home: g.teams.home.team.abbreviation, homeName: g.teams.home.team.teamName || g.teams.home.team.name,
                                startMs: Date.parse(g.gameDate), startLabel: new Date(g.gameDate).toLocaleString([], { weekday: 'short', hour: 'numeric', minute: '2-digit' }),
                                state: g.status && g.status.abstractGameState, statusText: g.status && g.status.detailedState,
                                awayProb: g.teams.away.probablePitcher && g.teams.away.probablePitcher.fullName,
                                homeProb: g.teams.home.probablePitcher && g.teams.home.probablePitcher.fullName,
                                awayLineup: away, homeLineup: home,
                                confirmed: away.length >= 9 && home.length >= 9
                            };
                        }).sort((a, b) => (a.startMs || 0) - (b.startMs || 0));
                        if (gone()) return;
                        setLineups(rows);
                        setLineupSource(rows.some(r => r.confirmed) ? 'live' : rows.length ? 'partial' : 'unavailable');
                        return;
                    }
                    if (selectedSport === 'nfl' || selectedSport === 'ncaaf') {
                        const cache = selectedSport === 'nfl' ? nflCache.current : cfbCache.current;
                        const games = (cache && cache.games) || [];
                        const meta = (cache && cache.teamMeta) || {};
                        const qbByTeam = {};
                        (players || []).forEach(p => {
                            if (p.sport === selectedSport && p.position === 'QB') (qbByTeam[p.team] = qbByTeam[p.team] || []).push(p.name);
                        });
                        const rows = games.map(g => ({
                            key: String(g.gameId),
                            away: (meta[g.awayId] || {}).abbr, awayName: (meta[g.awayId] || {}).name,
                            home: (meta[g.homeId] || {}).abbr, homeName: (meta[g.homeId] || {}).name,
                            startMs: g.kickoffMs, startLabel: g.gameTime,
                            state: g.state, statusText: g.status,
                            awayProb: (qbByTeam[(meta[g.awayId] || {}).abbr] || [])[0] || null,
                            homeProb: (qbByTeam[(meta[g.homeId] || {}).abbr] || [])[0] || null,
                            awayLineup: [], homeLineup: [], confirmed: false,
                            note: selectedSport === 'nfl'
                                ? 'Inactives post ~90 min before kickoff — QB shown from the depth chart.'
                                : 'CFB has no confirmed pre-game lineup feed — QB shown from the roster.'
                        })).sort((a, b) => (a.startMs || 0) - (b.startMs || 0));
                        if (gone()) return;
                        setLineups(rows);
                        setLineupSource(rows.length ? 'partial' : 'unavailable');
                        return;
                    }
                    if (gone()) return;
                    setLineups([]);
                    setLineupSource('unavailable');
                } catch (err) {
                    console.warn('Lineup fetch failed:', err.message);
                    if (!gone()) { setLineups([]); setLineupSource('unavailable'); }
                }
            };

            const fetchLiveScoreboard = async (isStale) => {
                const gone = () => typeof isStale === 'function' && isStale();
                try {
                    const espnPath = ESPN_SPORT_PATHS[selectedSport];
                    if (!espnPath) { setScoreboardSource('sample'); return; }
                    const dateStr = selectedDate.replace(/-/g, '');
                    const url = `https://site.api.espn.com/apis/site/v2/sports/${espnPath}/scoreboard?dates=${dateStr}`;
                    const data = await fetchJSONWithFallback(url);
                    if (gone()) return;
                    const games = (data.events || []).map(ev => {
                        const comp = ev.competitions && ev.competitions[0];
                        const competitors = (comp && comp.competitors) || [];
                        const home = competitors.find(c => c.homeAway === 'home');
                        const away = competitors.find(c => c.homeAway === 'away');
                        return {
                            id: ev.id,
                            home: home && home.team && home.team.abbreviation,
                            away: away && away.team && away.team.abbreviation,
                            status: ev.status && ev.status.type && ev.status.type.shortDetail
                        };
                    });
                    setLiveGames(games);
                    setScoreboardSource('live');
                } catch (err) {
                    console.warn('Live ESPN scoreboard fetch failed:', err.message);
                    setScoreboardSource('sample');
                }
            };

            // ============================================================
            // COMBINED DEFENSIVE DATA: NBA.com / WNBA.com + ESPN
            // ============================================================
            // IMPORTANT REALITY CHECK (read before relying on this):
            // - stats.nba.com and stats.wnba.com DO publish real opponent
            //   defensive stats, but that endpoint requires a Referer/User-Agent
            //   header that browsers refuse to let JavaScript set. This is a
            //   browser security rule, not a bug — so from a static HTML page,
            //   this call will usually fail and fall through to ESPN. It's kept
            //   here so it works immediately if this file is ever served through
            //   a small backend proxy (which is the correct production setup).
            // - Neither NBA.com, WNBA.com, nor ESPN publish "points/rebounds/
            //   assists allowed BY POSITION" as a raw stat — that specific split
            //   is always a computed metric (the kind RotoWire/HashtagBasketball
            //   build themselves from box scores). So below, we pull the REAL
            //   combined overall defensive number and use it to scale the
            //   position-level breakdown proportionally — the position split
            //   stays a labeled estimate, but now it moves with real data
            //   instead of being a static guess.
            const fetchCombinedDefenseData = async (players) => {
                // NHL: skaters use the real defense-vs-position grid (NHL
                // boxscores already split Forward/Defenseman, so this fits
                // naturally). Goalies use a team-shooting-profile fetch
                // instead, mirroring MLB's pitcher-vs-lineup idea.
                if (selectedSport === 'nhl') {
                    if (!backendUrl) return;
                    for (const player of players) {
                        try {
                            if (player.role === 'goalie') {
                                const res = await fetch(`${backendUrl}/api/nhl/team-shooting/${player.opponent}?window=season`);
                                if (!res.ok) continue;
                                const data = await res.json();
                                setPlayersData(prev => prev.map(p => {
                                    if (p.id !== player.id) return p;
                                    return {
                                        ...p,
                                        opponentContext: {
                                            ...p.opponentContext,
                                            teamShooting: { shotsPerGame: data.shots_per_game, goalsPerGame: data.goals_per_game, shootingPct: data.shooting_pct, rank: data.rank }
                                        },
                                        matchupDataSource: 'Your backend (real api-web.nhle.com data)'
                                    };
                                }));
                            } else {
                                const res = await fetch(`${backendUrl}/api/nhl/defense/by-position/${player.opponent}?window=season`);
                                if (!res.ok) continue;
                                const data = await res.json();
                                if (!data.byPosition || Object.keys(data.byPosition).length === 0) continue;
                                setPlayersData(prev => prev.map(p => {
                                    if (p.id !== player.id || !p.opponentDefense) return p;
                                    const mergedByPosition = { ...p.opponentDefense.byPosition };
                                    Object.entries(data.byPosition).forEach(([pos, stats]) => {
                                        if (mergedByPosition[pos]) mergedByPosition[pos] = { ...mergedByPosition[pos], ...stats };
                                    });
                                    return {
                                        ...p,
                                        opponentDefense: { ...p.opponentDefense, byPosition: mergedByPosition, dataSource: 'Your backend (real api-web.nhle.com data)', isRealByPosition: true }
                                    };
                                }));
                            }
                        } catch (e) {
                            // This player's matchup stays on sample data — no crash, no silent lie.
                        }
                    }
                    return;
                }

                // MLB: architecturally different fetch, matching the sport's real
                // structure (see beatsedge-backend/lib/mlbDb.js). A pitcher's real
                // opposing lineup can be fetched with just a team abbreviation. A
                // batter's real opposing PITCHER needs a specific pitcher ID —
                // this mock data doesn't have one (today's real probable starter
                // isn't known without a live schedule lookup), so batter matchups
                // honestly stay on sample data here rather than fetch nothing and
                // pretend it's real.
                if (selectedSport === 'mlb') {
                    // The full-slate builder (fetchMlbSlate) already fills in
                    // opponentContext.pitcher / .teamBatting for every player
                    // from batched statsapi calls, and fetchMlbPropLines does
                    // the real lines. The old per-player backend calls below
                    // would fire hundreds of requests against a 300-player
                    // slate for data we already have — skip them entirely.
                    return;
                    // eslint-disable-next-line no-unreachable
                    if (!backendUrl) return;
                    for (const player of players) {
                        try {
                            if (player.role === 'pitcher') {
                                const res = await fetch(`${backendUrl}/api/mlb/team-batting/${player.opponent}?window=season`);
                                if (!res.ok) continue;
                                const data = await res.json();
                                setPlayersData(prev => prev.map(p => {
                                    if (p.id !== player.id) return p;
                                    return {
                                        ...p,
                                        opponentContext: {
                                            ...p.opponentContext,
                                            teamBatting: {
                                                teamAvg: data.team_avg, kRate: data.k_rate,
                                                runsPerGame: data.runs_per_game, rank: data.rank
                                            }
                                        },
                                        matchupDataSource: 'Your backend (real statsapi.mlb.com data)'
                                    };
                                }));
                            } else if (player.role === 'batter') {
                                // Step 1: who's actually pitching against this team tonight (real lookup, not a guess)
                                const ppRes = await fetch(`${backendUrl}/api/mlb/probable-pitcher/${player.team}?date=${selectedDate}`);
                                if (!ppRes.ok) continue; // no probable starter posted yet — stays sample
                                const probablePitcher = await ppRes.json();

                                // Step 2: that specific pitcher's real rolled-up stats
                                const statsRes = await fetch(`${backendUrl}/api/mlb/pitcher/${probablePitcher.pitcherId}?window=season`);
                                if (!statsRes.ok) {
                                    // We know WHO is pitching for real, just not their stats yet (e.g. rookie
                                    // with no starts logged). Still worth showing the real name.
                                    setPlayersData(prev => prev.map(p => {
                                        if (p.id !== player.id) return p;
                                        return {
                                            ...p,
                                            opponentContext: { ...p.opponentContext, pitcher: { ...p.opponentContext.pitcher, id: probablePitcher.pitcherId, name: probablePitcher.pitcherName } },
                                            matchupDataSource: 'Your backend (real probable pitcher, stats pending)'
                                        };
                                    }));
                                    continue;
                                }
                                const data = await statsRes.json();
                                setPlayersData(prev => prev.map(p => {
                                    if (p.id !== player.id) return p;
                                    return {
                                        ...p,
                                        opponentContext: {
                                            ...p.opponentContext,
                                            pitcher: { id: probablePitcher.pitcherId, name: probablePitcher.pitcherName, era: data.era, whip: data.whip, kPer9: data.k_per_9 }
                                        },
                                        matchupDataSource: 'Your backend (real statsapi.mlb.com data)'
                                    };
                                }));
                            }
                        } catch (e) {
                            // This player's matchup stays on sample data — no crash, no silent lie.
                        }
                    }
                    return;
                }

                // NFL: the only real source is your own backend (no NBA.com-style
                // official league API attempted for NFL in this pass — see
                // beatsedge-backend README). No backend configured = keep the
                // sample data already on the mock players, clearly labeled as such.
                if (selectedSport === 'nfl') {
                    if (!backendUrl) return;
                    const opponents = Array.from(new Set(players.map(p => p.opponent).filter(Boolean)));
                    for (const teamAbbr of opponents) {
                        try {
                            const res = await fetch(`${backendUrl}/api/nfl/defense/by-position/${teamAbbr}?window=season`);
                            if (!res.ok) continue;
                            const data = await res.json();
                            if (!data.byPosition || Object.keys(data.byPosition).length === 0) continue;

                            setPlayersData(prev => prev.map(p => {
                                if (p.opponent !== teamAbbr || !p.opponentDefense) return p;
                                const mergedByPosition = { ...p.opponentDefense.byPosition };
                                Object.entries(data.byPosition).forEach(([pos, stats]) => {
                                    mergedByPosition[pos] = {
                                        passingYardsAllowed: stats.passingYardsAllowed,
                                        rushingYardsAllowed: stats.rushingYardsAllowed,
                                        receivingYardsAllowed: stats.receivingYardsAllowed,
                                        receptionsAllowed: stats.receptionsAllowed,
                                        tdsAllowed: stats.tdsAllowed,
                                        fantasyPointsAllowed: stats.fantasyPointsAllowed,
                                        rank: stats.rank
                                    };
                                });
                                return {
                                    ...p,
                                    opponentDefense: {
                                        ...p.opponentDefense,
                                        byPosition: mergedByPosition,
                                        dataSource: 'Your backend (real nflverse data)',
                                        isRealByPosition: true
                                    }
                                };
                            }));
                        } catch (e) {
                            // This opponent keeps its sample defense numbers — no crash, no silent lie.
                        }
                    }
                    return;
                }

                // NBA now carries its own real opponent defense — team ranks
                // from ESPN's `statistics/byteam` (fetchNbaSlate → player.oppDef)
                // and a live per-position box-score tally on modal open
                // (fetchNbaPlayerDetail → player.opponentDefense). The legacy
                // path below only reached for stats.nba.com, which is
                // CORS-blocked in a browser — skip it (was pure console noise).
                if (selectedSport === 'nba') return;

                const espnPath = ESPN_SPORT_PATHS[selectedSport];
                const isBasketball = selectedSport === 'nba' || selectedSport === 'wnba';
                const opponents = Array.from(new Set(players.map(p => p.opponent).filter(Boolean)));

                for (const teamAbbr of opponents) {
                    let realPpgAllowed = null;
                    let sourceLabel = null;
                    let realByPosition = null; // genuinely computed, not scaled — from your own backend

                    // 0) Your own backend (see beatsedge-backend/), if configured.
                    //    This is the ONLY source that returns real, computed
                    //    defense-by-position numbers rather than a scaled estimate.
                    if (backendUrl && isBasketball) {
                        try {
                            const season = '2025-26';
                            const url = `${backendUrl}/api/defense/combined/${selectedSport}/${season}/${teamAbbr}`;
                            const res = await fetch(url);
                            if (res.ok) {
                                const data = await res.json();
                                if (data.overall && typeof data.overall.oppPointsAllowed === 'number') {
                                    realPpgAllowed = data.overall.oppPointsAllowed;
                                    sourceLabel = data.overallSource || 'Your backend';
                                }
                                if (data.byPosition && Object.keys(data.byPosition).length > 0) {
                                    realByPosition = data.byPosition;
                                    sourceLabel = (sourceLabel ? sourceLabel + ' + ' : '') + 'Your backend (computed DvP)';
                                }
                                setBackendDataSource('live');
                                setBackendError(null);
                            }
                        } catch (e) {
                            setBackendDataSource('sample');
                            setBackendError('Could not reach backend at ' + backendUrl + ' — ' + e.message);
                        }
                    }

                    // 1) Best-effort: official league stats (NBA.com/WNBA.com for
                    //    basketball). Expected to fail in most browsers — see note above.
                    //    Skipped if the backend already gave us a real number.
                    if (isBasketball && realPpgAllowed === null) {
                        try {
                            const host = selectedSport === 'wnba' ? 'https://stats.wnba.com' : 'https://stats.nba.com';
                            const url = `${host}/stats/leaguedashteamstats?Season=2025-26&SeasonType=Regular+Season&PerMode=PerGame&MeasureType=Opponent`;
                            const data = await fetchJSONWithFallback(url);
                            const rs = data.resultSets && data.resultSets[0];
                            if (rs) {
                                const abbrevIdx = rs.headers.indexOf('TEAM_ABBREVIATION');
                                const oppPtsIdx = rs.headers.indexOf('OPP_PTS');
                                const row = rs.rowSet.find(r => r[abbrevIdx] === teamAbbr);
                                if (row && oppPtsIdx >= 0) {
                                    realPpgAllowed = row[oppPtsIdx];
                                    sourceLabel = selectedSport === 'wnba' ? 'WNBA.com' : 'NBA.com';
                                }
                            }
                        } catch (e) {
                            // Expected: stats.nba.com/wnba.com block headers a browser can't set.
                        }
                    }

                    // 2) ESPN — the source that reliably works from a browser.
                    //    Used standalone for football/college, and as a cross-check
                    //    (or primary fallback) for basketball.
                    try {
                        if (espnPath) {
                            const url = `https://site.api.espn.com/apis/site/v2/sports/${espnPath}/standings`;
                            const data = await fetchJSONWithFallback(url);
                            const entries = []
                                .concat((data.children || []).flatMap(c => (c.standings && c.standings.entries) || []))
                                .concat((data.standings && data.standings.entries) || []);
                            const entry = entries.find(e => e.team && e.team.abbreviation === teamAbbr);
                            if (entry) {
                                const stat = (entry.stats || []).find(s =>
                                    s.name === 'avgPointsAgainst' || s.abbreviation === 'PA' || s.name === 'pointsAgainst'
                                );
                                if (stat && typeof stat.value === 'number') {
                                    if (realPpgAllowed === null) {
                                        realPpgAllowed = stat.value;
                                        sourceLabel = 'ESPN';
                                    } else {
                                        sourceLabel = sourceLabel + ' + ESPN';
                                    }
                                }
                            }
                        }
                    } catch (e) {
                        // ESPN unreachable too — this opponent keeps its modeled/sample numbers.
                    }

                    if (realPpgAllowed !== null || realByPosition !== null) {
                        setPlayersData(prev => prev.map(p => {
                            if (p.opponent !== teamAbbr || !p.opponentDefense) return p;

                            let finalByPosition;
                            if (realByPosition) {
                                // Genuinely computed per-position data from your own backend —
                                // use it directly, no scaling/estimating needed.
                                finalByPosition = { ...p.opponentDefense.byPosition };
