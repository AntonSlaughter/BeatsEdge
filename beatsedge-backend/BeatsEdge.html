                                Object.entries(realByPosition).forEach(([pos, stats]) => {
                                    if (finalByPosition[pos]) {
                                        finalByPosition[pos] = { ...finalByPosition[pos], ...stats };
                                    }
                                });
                            } else {
                                // Fallback: scale the estimate by the real overall number.
                                const oldPpg = p.opponentDefense.overall.ppg || realPpgAllowed;
                                const scale = oldPpg ? (realPpgAllowed / oldPpg) : 1;
                                finalByPosition = {};
                                Object.entries(p.opponentDefense.byPosition).forEach(([pos, stats]) => {
                                    finalByPosition[pos] = {
                                        ...stats,
                                        pointsAllowed: Math.round(stats.pointsAllowed * scale * 10) / 10
                                    };
                                });
                            }

                            return {
                                ...p,
                                opponentDefense: {
                                    ...p.opponentDefense,
                                    overall: realPpgAllowed !== null
                                        ? { ...p.opponentDefense.overall, ppg: Math.round(realPpgAllowed * 10) / 10 }
                                        : p.opponentDefense.overall,
                                    byPosition: finalByPosition,
                                    dataSource: sourceLabel,
                                    isRealByPosition: !!realByPosition
                                }
                            };
                        }));
                    }
                }
            };

            // ============================================================
            // BALLDONTLIE — real season averages + game log
            // ============================================================
            // Free tier requires your own key (5 req/min, core NBA endpoints).
            // Powers the L5/L10/season pieces of the edge engine with real
            // numbers instead of sample data, when a key is provided.
            const BDL_BASE = 'https://api.balldontlie.io/v1';

            const bdlFetch = async (path) => {
                const res = await fetch(`${BDL_BASE}${path}`, {
                    headers: { 'Authorization': balldontlieKey }
                });
                if (res.status === 401) throw new Error('Invalid or missing BallDontLie API key');
                if (res.status === 429) throw new Error('BallDontLie rate limit hit (free tier: 5 req/min) — try again shortly');
                if (!res.ok) throw new Error('BallDontLie HTTP ' + res.status);
                return res.json();
            };

            const fetchBallDontLieStats = async (players) => {
                if (!balldontlieKey || selectedSport !== 'nba') {
                    setStatsDataSource(balldontlieKey ? 'sample' : 'sample');
                    return;
                }

                try {
                    setBdlError(null);
                    for (const player of players) {
                        // 1) Find the player's BallDontLie ID by name
                        const [firstName, ...rest] = player.name.split(' ');
                        const lastName = rest.join(' ');
                        const searchData = await bdlFetch(`/players?search=${encodeURIComponent(lastName || player.name)}`);
                        const match = (searchData.data || []).find(p =>
                            `${p.first_name} ${p.last_name}`.toLowerCase() === player.name.toLowerCase()
                        ) || (searchData.data || [])[0];

                        if (!match) continue;

                        // 2) Real season average
                        const seasonData = await bdlFetch(`/season_averages?season=2025&player_ids[]=${match.id}`);
                        const seasonStats = (seasonData.data || [])[0];

                        // 3) Real recent game log (used for L5/L10)
                        const statsData = await bdlFetch(`/stats?player_ids[]=${match.id}&seasons[]=2025&per_page=20`);
                        const games = (statsData.data || [])
                            .filter(g => g.min && g.min !== '00' && g.min !== '0')
                            .sort((a, b) => new Date(b.game.date) - new Date(a.game.date));

                        if (games.length === 0 && !seasonStats) continue;

                        const avgOf = (arr, key) => arr.length ? Math.round((arr.reduce((s, g) => s + (g[key] || 0), 0) / arr.length) * 10) / 10 : null;

                        const updates = {};
                        if (games.length) {
                            const l5 = games.slice(0, 5);
                            const l10 = games.slice(0, 10);
                            updates.last5 = { hitRate: player.stats.last5.hitRate, avg: avgOf(l5, 'pts'), games: l5.length };
                            updates.last10 = { hitRate: player.stats.last10.hitRate, avg: avgOf(l10, 'pts'), games: l10.length };
                        }
                        if (seasonStats) {
                            updates.season = { hitRate: player.stats.season.hitRate, avg: seasonStats.pts, games: seasonStats.games_played };
                        }

                        setPlayersData(prev => prev.map(p => {
                            if (p.id !== player.id) return p;
                            return {
                                ...p,
                                stats: { ...p.stats, ...updates },
                                statsSource: 'BallDontLie (live)'
                            };
                        }));
                    }
                    setStatsDataSource('live');
                } catch (err) {
                    console.warn('BallDontLie fetch failed, keeping sample stats:', err.message);
                    setStatsDataSource('sample');
                    setBdlError(err.message);
                }
            };

            // Real back-to-back and home/away splits, from your own backend
            // (see beatsedge-backend/lib/situationalEngine.js) — computed by
            // joining actual box scores to the actual schedule, not modeled.
            // Requires the "Your Backend" URL to be set in Data Sources.
            // `isHomeTonight` / `isBackToBackTonight` on each mock player are
            // placeholders for demo purposes — in production these come from
            // the ESPN scoreboard fetch already wired in above, which reports
            // home/away directly per game.
            const fetchPlayerSituationalData = async (players) => {
                if (!backendUrl || selectedSport !== 'nba') return;

                for (const player of players) {
                    try {
                        const url = `${backendUrl}/api/player/situational/${encodeURIComponent(player.name)}`;
                        const res = await fetch(url);
                        if (!res.ok) continue;
                        const data = await res.json();

                        setPlayersData(prev => prev.map(p => {
                            if (p.id !== player.id) return p;
                            return { ...p, situational: data };
                        }));
                    } catch (e) {
                        // This player's situational data just isn't available — the
                        // Edge Score engine already treats missing situational data
                        // as "omit these factors", not an error state.
                    }
                }
            };

            // ============================================================
            // MLB REAL FULL SLATE — statsapi.mlb.com (keyless, CORS-open)
            // ============================================================
            // Replaces the 2 hand-picked MLB sample players with every
            // probable pitcher + every lineup hitter for the selected date's
            // real games. Identity, positions, matchups, season stats, and
            // L5/L10 recent form are all REAL. Prop LINES are still sample
            // values — anchored to each player's real season production —
            // because no free source publishes real sportsbook prop lines
            // (same honest limitation as every other sport in this app).
            //
            // Every prop PropLine offers for a player becomes its own prop,
            // each with its OWN stat windows (L5/L10/L20/season/vs-opp), hit
            // rate and game-log — computed per stat from the same statsapi
            // game log — so every column in the expanded card is real for
            // whichever prop is selected. Without a PropLine key, a small set
            // of sample props (anchored to season rates) is used instead.
            const MLB_API = 'https://statsapi.mlb.com/api/v1';

            // statKey -> { display type, PropLine market, how to read it from a
            // statsapi hitting/pitching stat object, and which "games" field
            // divides a season total into a per-game rate }. One table drives
            // season seeding, L5/L10 warm-up, and the on-expand game log.
            // DraftKings-style fantasy scoring, per game, from a statsapi
            // hitting or pitching stat object.
            const mlbFantasyHit = (s) => {
                const h = s.hits || 0, d = s.doubles || 0, t = s.triples || 0, hr = s.homeRuns || 0;
                const singles = Math.max(0, h - d - t - hr);
                return Math.round((3 * singles + 5 * d + 8 * t + 10 * hr + 2 * (s.rbi || 0) + 2 * (s.runs || 0) + 2 * (s.baseOnBalls || 0) + 2 * (s.hitByPitch || 0) + 5 * (s.stolenBases || 0)) * 10) / 10;
            };
            // PrizePicks "Pitcher Fantasy Score": out +1, K +3, ER -3,
            // Win +6, Quality Start +4. (NOT DraftKings scoring — this is
            // the number PrizePicks/Underdog actually post.)
            const mlbFantasyPitch = (s) => {
                const ipStr = String(s.inningsPitched != null ? s.inningsPitched : '0');
                const [whole, frac] = ipStr.split('.');
                const outs = s.outs != null ? s.outs : ((parseInt(whole, 10) || 0) * 3 + (parseInt(frac, 10) || 0));
                const er = s.earnedRuns || 0;
                const qs = s.qualityStarts != null
                    ? s.qualityStarts
                    : ((outs >= 18 && er <= 3) ? 1 : 0); // derive per-game when not aggregated
                return Math.round((outs + 3 * (s.strikeOuts || 0) - 3 * er + 6 * (s.wins || 0) + 4 * qs) * 10) / 10;
            };

            // `type` matches PrizePicks' stat-category naming. `market: null`
            // means PropLine has no line for it (fantasy scores, pitcher walks)
            // so it's shown as a computed projection off the real game log.
            const MLB_PROP_DEFS = {
                hits:             { type: 'Hits',                  market: 'batter_hits',            get: s => s.hits || 0 },
                totalBases:       { type: 'Total Bases',           market: 'batter_total_bases',     get: s => s.totalBases || 0 },
                homeRuns:         { type: 'Home Runs',             market: 'batter_home_runs',       get: s => s.homeRuns || 0 },
                rbis:             { type: 'RBIs',                  market: 'batter_rbis',            get: s => s.rbi || 0 },
                runs:             { type: 'Runs',                  market: 'batter_runs',            get: s => s.runs || 0 },
                doubles:          { type: 'Doubles',               market: 'batter_doubles',         get: s => s.doubles || 0 },
                triples:          { type: 'Triples',               market: 'batter_triples',         get: s => s.triples || 0 },
                singles:          { type: 'Singles',               market: 'batter_singles',         get: s => Math.max(0, (s.hits || 0) - (s.doubles || 0) - (s.triples || 0) - (s.homeRuns || 0)) },
                batterWalks:      { type: 'Walks',                 market: 'batter_walks',           get: s => s.baseOnBalls || 0 },
                batterStrikeouts: { type: 'Hitter Strikeouts',     market: 'batter_strikeouts',      get: s => s.strikeOuts || 0 },
                stolenBases:      { type: 'Stolen Bases',          market: 'batter_stolen_bases',    get: s => s.stolenBases || 0 },
                hitsRunsRbis:     { type: 'Hits+Runs+RBIs',        market: 'batter_hits_runs_rbis',  get: s => (s.hits || 0) + (s.runs || 0) + (s.rbi || 0) },
                fantasy:          { type: 'Hitter Fantasy Score',  market: null,                     get: s => mlbFantasyHit(s) },
                strikeouts:       { type: 'Pitcher Strikeouts',    market: 'pitcher_strikeouts',     get: s => s.strikeOuts || 0, pitcher: true },
                earnedRuns:       { type: 'Earned Runs Allowed',   market: 'pitcher_earned_runs',    get: s => s.earnedRuns || 0, pitcher: true },
                hitsAllowed:      { type: 'Hits Allowed',          market: 'pitcher_hits_allowed',   get: s => s.hits || 0, pitcher: true },
                pitcherOuts:      { type: 'Pitching Outs',         market: 'pitcher_outs',           get: s => s.outs != null ? s.outs : Math.round((parseFloat(s.inningsPitched) || 0) * 3), pitcher: true },
                pitcherWalks:     { type: 'Walks Allowed',         market: null,                     get: s => s.baseOnBalls || 0, pitcher: true },
                pitcherFantasy:   { type: 'Pitcher Fantasy Score', market: null,                     get: s => mlbFantasyPitch(s), pitcher: true }
            };
            const MLB_MARKET_TO_KEY = Object.fromEntries(Object.entries(MLB_PROP_DEFS).filter(([, v]) => v.market).map(([k, v]) => [v.market, k]));
            // Computed projections (no book line) shown alongside the live
            // lines. `market: null` in MLB_PROP_DEFS marks these.
            const MLB_PROJECTION_KEYS = { batter: ['fantasy'], pitcher: ['pitcherFantasy', 'pitcherWalks'] };
            // Order for the PrizePicks-style category filter bar.
            const STAT_CAT_ORDER = ['Pitcher Strikeouts', 'Total Bases', 'Hits+Runs+RBIs', 'Hitter Fantasy Score', 'Pitcher Fantasy Score', 'Pitching Outs', 'Hits Allowed', 'Hits', 'Runs', 'RBIs', 'Home Runs', 'Walks', 'Stolen Bases', 'Earned Runs Allowed', 'Walks Allowed', 'Hitter Strikeouts', 'Singles', 'Doubles', 'Triples'];
            // Placeholder set shown before PropLine runs (buildMlbPlayer).
            const MLB_DEFAULT_KEYS = { batter: ['totalBases', 'hits', 'rbis', 'runs', 'fantasy'], pitcher: ['strikeouts', 'earnedRuns', 'pitcherOuts', 'pitcherFantasy'] };
            const mlbGamesField = (statObj, isPitcher) => isPitcher
                ? (statObj.gamesStarted || statObj.gamesPlayed || 0)
                : (statObj.gamesPlayed || 0);
            // A reasonable sample line for a stat given its per-game rate.
            const mlbSampleLine = (statKey, perGame) => {
                if (statKey === 'strikeouts') return Math.max(3.5, roundHalf(perGame));
                if (statKey === 'pitcherOuts') return Math.max(11.5, roundHalf(perGame) - 0.5);
                if (statKey === 'earnedRuns' || statKey === 'hitsAllowed') return Math.max(1.5, roundHalf(perGame));
                if (statKey === 'totalBases' || statKey === 'hitsRunsRbis') return Math.max(1.5, roundHalf(perGame));
                if (statKey === 'fantasy' || statKey === 'pitcherFantasy') return Math.max(0.5, roundHalf(perGame) - 0.5);
                if (statKey === 'pitcherWalks') return Math.max(1.5, roundHalf(perGame));
                return 0.5; // hits, HR, RBI, runs, doubles, triples, singles, walks, SB
            };
            const MLB_SEASON = new Date(selectedDate + 'T12:00:00').getFullYear();
            const mlbHeadshot = (id) => `https://img.mlbstatic.com/mlb-photos/image/upload/w_120,q_auto:best/v1/people/${id}/headshot/67/current`;
            const roundHalf = (n) => Math.round(n * 2) / 2;
            const round1 = (n) => Math.round(n * 10) / 10;
            const num = (v) => { const f = parseFloat(v); return Number.isFinite(f) ? f : null; };
            // Rough placeholder hit-rate until the real per-game series is
            // pulled on card-expand. Not shown as authoritative anywhere the
            // real number would be.
            const estHitRate = (avg, line) => Math.max(15, Math.min(90, Math.round(50 + (avg - line) * 22)));

            // ============================================================
            // NFL REAL SLATE — ESPN (keyless) for identity/stats/game logs,
            // PropLine for the real book lines. Mirrors the MLB pipeline.
            // PropLine gives NO player ids for NFL (only `desc` names), so
            // the join to ESPN athletes is by normalized name.
            // ============================================================
            const NFL_ESPN = 'https://site.api.espn.com/apis/site/v2/sports/football/nfl';
            const NFL_ESPN_COMMON = 'https://site.api.espn.com/apis/common/v3/sports/football/nfl';
            const NFL_SKILL_POS = { QB: 'QB', RB: 'RB', FB: 'RB', WR: 'WR', TE: 'TE', K: 'K', PK: 'K' };
            // Aggressive name normalization for the PropLine `desc` <-> ESPN join.
            const nflNormName = (s) => (s || '')
                .toLowerCase()
                .normalize('NFD').replace(/[̀-ͯ]/g, '')
                .replace(/\b(jr|sr|ii|iii|iv|v)\b/g, '')
                .replace(/[^a-z]/g, '');

            // statKey -> { PrizePicks type, PropLine market, positions it applies
            // to, and how to read it from a zipped ESPN gamelog row }.
            const NFL_PROP_DEFS = {
                passYds:         { type: 'Pass Yards',        market: 'player_pass_yds',           pos: 'QB',       get: r => r.passingYards || 0 },
                passTds:         { type: 'Pass TDs',          market: 'player_pass_tds',           pos: 'QB',       get: r => r.passingTouchdowns || 0 },
                passAttempts:    { type: 'Pass Attempts',     market: 'player_pass_attempts',      pos: 'QB',       get: r => r.passingAttempts || 0 },
                passCompletions: { type: 'Pass Completions',  market: 'player_pass_completions',   pos: 'QB',       get: r => r.completions || 0 },
                interceptions:   { type: 'Interceptions',     market: 'player_pass_interceptions', pos: 'QB',       get: r => r.interceptions || 0 },
                passRushYds:     { type: 'Pass+Rush Yards',   market: 'player_pass_rush_yds',      pos: 'QB',       get: r => (r.passingYards || 0) + (r.rushingYards || 0) },
                rushYds:         { type: 'Rush Yards',        market: 'player_rush_yds',           pos: 'RB,QB,WR', get: r => r.rushingYards || 0 },
                rushAttempts:    { type: 'Rush Attempts',     market: 'player_rush_attempts',      pos: 'RB,QB',    get: r => r.rushingAttempts || 0 },
                rushTds:         { type: 'Rush TDs',          market: 'player_rush_tds',           pos: 'RB,QB,WR', get: r => r.rushingTouchdowns || 0 },
                longRush:        { type: 'Longest Rush',      market: 'player_rush_longest',       pos: 'RB,QB',    get: r => r.longRushing || 0 },
                recYds:          { type: 'Receiving Yards',   market: 'player_reception_yds',      pos: 'WR,TE,RB', get: r => r.receivingYards || 0 },
                receptions:      { type: 'Receptions',        market: 'player_receptions',         pos: 'WR,TE,RB', get: r => r.receptions || 0 },
                recTds:          { type: 'Receiving TDs',     market: 'player_reception_tds',      pos: 'WR,TE,RB', get: r => r.receivingTouchdowns || 0 },
                targets:         { type: 'Targets',           market: 'player_reception_targets',  pos: 'WR,TE,RB', get: r => r.receivingTargets || 0 },
                longRec:         { type: 'Longest Reception', market: 'player_reception_longest',  pos: 'WR,TE,RB', get: r => r.longReception || 0 },
                rushRecYds:      { type: 'Rush+Rec Yards',    market: 'player_rush_reception_yds', pos: 'RB,WR,TE', get: r => (r.rushingYards || 0) + (r.receivingYards || 0) },
                kickingPts:      { type: 'Kicking Points',    market: 'player_kicking_points',     pos: 'K',        get: r => r.totalKickingPoints != null ? r.totalKickingPoints : (r.totalPoints || 0) },
                fgMade:          { type: 'FG Made',           market: 'player_field_goals_made',   pos: 'K',        get: r => r['fieldGoalsMade-fieldGoalAttempts'] || r.fieldGoalsMade || 0 }
            };
            const NFL_MARKET_TO_KEY = Object.fromEntries(Object.entries(NFL_PROP_DEFS).map(([k, v]) => [v.market, k]));
            const nflPosKeys = (pos) => Object.keys(NFL_PROP_DEFS).filter(k => NFL_PROP_DEFS[k].pos.split(',').includes(pos));
            const NFL_STAT_CAT_ORDER = ['Pass Yards', 'Rush Yards', 'Receiving Yards', 'Receptions', 'Pass TDs', 'Pass Attempts', 'Pass Completions', 'Rush Attempts', 'Targets', 'Pass+Rush Yards', 'Rush+Rec Yards', 'Rush TDs', 'Receiving TDs', 'Longest Rush', 'Longest Reception', 'Interceptions', 'Kicking Points', 'FG Made'];

            // A plausible pre-line sample number, anchored to the player's own
            // per-game rate (used only when PropLine has nothing for a stat).
            const nflSampleLine = (statKey, perGame) => {
                if (/Yards/.test(NFL_PROP_DEFS[statKey].type)) return Math.max(0.5, Math.round(perGame) - 0.5);
                if (/TDs|Interceptions|FG Made/.test(NFL_PROP_DEFS[statKey].type)) return 0.5;
                return Math.max(0.5, roundHalf(perGame) - 0.5);
            };

            // Same window shape MLB uses, so calculateEdgeScore / PlayerCard
            // read it unchanged. Seeded from the line; real numbers land when
            // the game log resolves (nflComputeWindows).
            const nflSeedWindows = (perGame, line) => {
                const avg = round1(perGame);
                const hr = estHitRate(avg, line);
                const w = (g) => ({ avg, hitRate: hr, games: g });
                return {
                    recent: { avg, hitRate: hr, median: Math.round(perGame), range: [0, Math.max(1, Math.ceil(perGame * 2))], games: 0 },
                    last5: w(0), last10: w(0), last20: w(0), season: w(0), vsOpp: { avg, hitRate: hr, games: 0 }
                };
            };

            // Small caches / lookups populated during a slate build.
            const mlbCache = React.useRef({ rosters: {}, abbrById: {} });
            const nflCache = React.useRef({ byNorm: {}, teamMeta: {}, games: [] });

            const mlbFetch = async (path) => {
                const res = await fetch(`${MLB_API}${path}`);
                if (!res.ok) throw new Error('MLB API HTTP ' + res.status + ' — ' + path);
                return res.json();
            };
            const chunk = (arr, n) => { const o = []; for (let i = 0; i < arr.length; i += n) o.push(arr.slice(i, i + n)); return o; };

            const HITTER_POS_TYPES = new Set(['Catcher', 'First Base', 'Second Base', 'Third Base', 'Shortstop', 'Infielder', 'Outfielder', 'Designated Hitter', 'Hitter', 'Two-Way Player']);

            // Pull season hitting + pitching for a batch of person ids in one call.
            const mlbSeasonStatsFor = async (ids) => {
                const map = {};
                for (const group of chunk(Array.from(new Set(ids.filter(Boolean))), 40)) {
                    const data = await mlbFetch(`/people?personIds=${group.join(',')}&hydrate=stats(group=[hitting,pitching],type=[season],season=${MLB_SEASON})`);
                    (data.people || []).forEach(p => {
                        const entry = { id: p.id, name: p.fullName, position: p.primaryPosition, hit: null, pitch: null };
                        (p.stats || []).forEach(s => {
                            const stat = s.splits && s.splits[0] && s.splits[0].stat;
                            if (!stat) return;
                            if (s.group && s.group.displayName === 'pitching') entry.pitch = stat;
                            else if (s.group && s.group.displayName === 'hitting') entry.hit = stat;
                        });
                        map[p.id] = entry;
                    });
                }
                return map;
            };

            // Seed all stat windows for one statKey from a season stat object.
            // Real L5/L10 land later (warmMlbSlateForm); real hit rates + game
            // log land on card-expand (fetchMlbPlayerDetail).
            const mlbSeedWindows = (seasonStatObj, isPitcher, statKey, line) => {
                const def = MLB_PROP_DEFS[statKey];
                const games = mlbGamesField(seasonStatObj, isPitcher);
                const perGame = games > 0 ? def.get(seasonStatObj) / games : 0;
                const avg = round1(perGame);
                const hr = estHitRate(avg, line);
                const w = (g) => ({ avg, hitRate: hr, games: g });
                return {
                    recent: { avg, hitRate: hr, median: Math.round(perGame), range: [0, Math.max(2, Math.ceil(perGame * 3))], games },
                    last5: w(5), last10: w(10), last20: w(20), season: w(games), vsOpp: { avg, hitRate: hr, games: 0 }
                };
            };

            const CONSENSUS_ORDER = ['draftkings', 'fanduel', 'betmgm', 'betrivers', 'caesars', 'pinnacle', 'prizepicks', 'underdog', 'sleeper', 'bovada'];

            // Build the prop list for ONE book. `allLines` is
            //   { statKey: { bookKey: [ {line, over, under, setAt, move, primary} ] } }
            // Only LIVE book lines become props — no sample fallback. For a DFS
            // book EVERY offered line becomes its own over+under pair. Fantasy
            // (a computed projection, not a line) is included only when the
            // player has at least one real line (i.e. the game is live).
            // `noSample` is really only false during the pre-lines seed pass in
            // buildMlbPlayer, which shows season-anchored placeholders until
            // fetchMlbPropLines runs.
            const mlbBuildProps = (seasonStat, isPitcher, statsByKey, allLines, book, seedMode) => {
                allLines = allLines || {};
                book = book || 'prizepicks';
                const hasAnyReal = Object.keys(allLines).length > 0;
                const seedK = (k, line) => { if (!statsByKey[k]) statsByKey[k] = mlbSeedWindows(seasonStat, isPitcher, k, line); return statsByKey[k]; };
                const pushPair = (k, def, line, extra) => {
                    const oHR = estHitRate(seedK(k, line).season.avg, line);
                    const base = { type: def.type, statKey: k, line, ...extra };
                    props.push({ ...base, direction: 'over', odds: extra.odds ?? -110, oppOdds: extra.oppOdds ?? -110, hitRate: oHR });
                    props.push({ ...base, direction: 'under', odds: extra.oppOdds ?? -110, oppOdds: extra.odds ?? -110, hitRate: Math.max(2, 100 - oHR) });
                };
                // A line PropLine only prices on ONE side — on PrizePicks/
                // Underdog/Sleeper that's a Goblin (easier) or Demon (harder),
                // and there is NO opposite side to pick. Never fabricate one.
                const pushOne = (k, def, line, side, extra) => {
                    const oHR = estHitRate(seedK(k, line).season.avg, line);
                    props.push({
                        type: def.type, statKey: k, line, ...extra, direction: side, oneWay: true,
                        odds: (side === 'over' ? extra.odds : extra.oppOdds) ?? -110, oppOdds: null,
                        hitRate: side === 'over' ? oHR : Math.max(2, 100 - oHR)
                    });
                };
                const pushLine = (k, def, e, extraIn) => {
                    const { _stdLine, ...extra } = extraIn;
                    // PrizePicks/Underdog Goblin & Demon are "More"-only picks —
                    // no opposite side, whatever PropLine echoes back.
                    if (DFS_PLATFORMS.has(book) && (e.ppType === 'goblin' || e.ppType === 'demon')) {
                        pushOne(k, def, e.line, 'over', { ...extra, ppKind: e.ppType });
                        return;
                    }
                    const hasO = e.over != null, hasU = e.under != null;
                    if (hasO && hasU) { pushPair(k, def, e.line, extra); return; }
                    // one-way sportsbook rung (N+ ladder)
                    pushOne(k, def, e.line, hasO ? 'over' : 'under', { ...extra, ppKind: null });
                };
                const props = [];

                if (seedMode) {
                    // pre-lines placeholder set (buildMlbPlayer)
                    MLB_DEFAULT_KEYS[isPitcher ? 'pitcher' : 'batter'].forEach(k => {
                        const def = MLB_PROP_DEFS[k];
                        const g = mlbGamesField(seasonStat, isPitcher);
                        pushPair(k, def, mlbSampleLine(k, g > 0 ? def.get(seasonStat) / g : 0), { isProjection: !def.market });
                    });
                    return props;
                }

                if (!hasAnyReal) return props; // no live lines at all → player has no props

                // every LIVE line this book carries. Two-way lines get over +
                // under; a one-way line (PrizePicks Goblin / Demon, or a
                // sportsbook alt ladder rung) gets only the side that's priced.
                Object.keys(MLB_PROP_DEFS).forEach(k => {
                    const def = MLB_PROP_DEFS[k];
                    const arr = allLines[k] && allLines[k][book];
                    if (!arr || !arr.length) return;
                    const sorted = arr.slice().sort((a, c) => (c.primary ? 1 : 0) - (a.primary ? 1 : 0) || a.line - c.line);
                    const multi = sorted.length > 1;
                    const stdLine = (sorted.find(e => e.over != null && e.under != null) || {}).line;
                    sorted.forEach(e => pushLine(k, def, e, {
                        lineSource: `${e._src === 'parlayapi' ? 'ParlayAPI' : 'PropLine'} · ${book}`, book, move: e.move, setAt: e.setAt,
                        altLine: multi && !e.primary, odds: e.over, oppOdds: e.under, _stdLine: stdLine
                    }));
                });

                // computed projections (fantasy score, pitcher walks) alongside
                // the live lines — PropLine carries no market for these
                const g = mlbGamesField(seasonStat, isPitcher);
                MLB_PROJECTION_KEYS[isPitcher ? 'pitcher' : 'batter'].forEach(k => {
                    const pdef = MLB_PROP_DEFS[k];
                    pushPair(k, pdef, mlbSampleLine(k, g > 0 ? pdef.get(seasonStat) / g : 0), { isProjection: true });
                });

                return props;
            };

            // Order props best-first — the standard line most likely to cash on
            // top; Goblins / Demons / alt lines sort after the standard board.
            const sortPropsByEdge = (playerLike, props) => {
                return props
                    .map(pr => { const e = calculateEdgeScore(playerLike, pr); return { pr, alt: pr.altLine ? 1 : 0, r: GRADE_RANK[e.grade], g: e.gradeScore }; })
                    .sort((a, b) => a.alt - b.alt || a.r - b.r || b.g - a.g)
                    .map(x => x.pr);
            };

            // Build one player object. `props` has an over AND an under entry
            // per stat, each with its own stat windows in statsByKey so every
            // column in the card is real for whichever prop is selected. Starts
            // on the default sample-line set; fetchMlbPropLines swaps in real
            // book lines and adds every other market PropLine offers.
            const buildMlbPlayer = (slot, people, teamBattingByTeamId) => {
                const me = people[slot.personId];
                if (!me) return null;
                const isPitcher = slot.role === 'pitcher';
                const seasonStat = (isPitcher ? me.pitch : me.hit) || {};

                const common = {
                    id: slot.personId,
                    sport: 'mlb',
                    role: slot.role,
                    name: me.name,
                    team: slot.teamAbbr,
                    opponent: slot.oppAbbr,
                    teamId: slot.teamId,
                    oppTeamId: slot.oppTeamId,
                    gamePk: slot.gamePk,
                    position: (me.position && me.position.abbreviation) || slot.position || (isPitcher ? 'P' : '-'),
                    gameTime: slot.gameTime,
                    status: 'ACTIVE',
                    injury: null,
                    isHomeTonight: !!slot.isHome,
                    paceRating: 'neutral',
                    paceDetail: 'No pace-equivalent factor for MLB in this pass',
                    headshot: mlbHeadshot(slot.personId),
                    minutesTrend: 0,
                    gameLog: [],
                    gameLogByKey: {},
                    _detailLoaded: false,
                    _seasonStat: seasonStat,
                    _isPitcher: isPitcher,
                    oppPitcherId: slot.oppPitcherId || null,
                    oppPitcherName: slot.oppPitcherName || null
                };

                const statsByKey = {};
                const props = mlbBuildProps(seasonStat, isPitcher, statsByKey, {}, 'prizepicks', true);

                let opponentContext, matchupDataSource = null;
                if (isPitcher) {
                    const tb = teamBattingByTeamId[slot.oppTeamId] || null;
                    opponentContext = tb ? { teamBatting: tb } : {};
                    matchupDataSource = tb ? 'statsapi.mlb.com — real opposing lineup profile' : null;
                } else {
                    const opp = people[slot.oppPitcherId];
                    const ops = opp && opp.pitch;
                    let pitcherCtx = null;
                    if (ops && num(ops.inningsPitched) > 0) {
                        pitcherCtx = {
                            id: slot.oppPitcherId,
                            name: slot.oppPitcherName || (opp && opp.name) || 'Opposing Starter',
                            era: num(ops.era), whip: num(ops.whip),
                            kPer9: round1((ops.strikeOuts / num(ops.inningsPitched)) * 9)
                        };
                    }
                    opponentContext = pitcherCtx ? { pitcher: pitcherCtx } : { pitcherName: slot.oppPitcherName || null };
                    matchupDataSource = pitcherCtx ? 'statsapi.mlb.com — real probable pitcher' : null;
                }

                const built = {
                    ...common,
                    props,
                    statsByKey,
                    statsSource: 'statsapi.mlb.com — season (real); recent form loading',
                    opponentContext,
                    matchupDataSource,
                    opponentDefense: null
                };
                built.props = sortPropsByEdge(built, props);
                built.stats = statsByKey[built.props[0].statKey];
                return built;
            };

            const fetchMlbSlate = async (date) => {
                const cache = mlbCache.current;
                cache.abbrById = {};
                const sched = await mlbFetch(`/schedule?sportId=1&date=${date}&hydrate=probablePitcher,lineups,team`);
                const games = (sched.dates && sched.dates[0] && sched.dates[0].games) || [];
                if (!games.length) return [];

                // Register team abbreviations for gamelog opponent resolution.
                games.forEach(gm => {
                    ['home', 'away'].forEach(side => {
                        const t = gm.teams[side].team;
                        if (t && t.id) cache.abbrById[t.id] = t.abbreviation || t.name;
                    });
                });

                const slots = [];
                const rosterNeeded = new Set();

                for (const gm of games) {
                    const when = new Date(gm.gameDate);
                    const gameTime = when.toLocaleString([], { weekday: 'short', hour: 'numeric', minute: '2-digit' })
                        + (gm.status && gm.status.detailedState && gm.status.detailedState !== 'Scheduled' && gm.status.detailedState !== 'Warmup'
                            ? ` · ${gm.status.detailedState}` : '');
                    const sides = [
                        { side: 'home', teamKey: 'home', oppKey: 'away', isHome: true },
                        { side: 'away', teamKey: 'away', oppKey: 'home', isHome: false }
                    ];
                    for (const s of sides) {
                        const meT = gm.teams[s.teamKey].team;
                        const oppT = gm.teams[s.oppKey].team;
                        const myProb = gm.teams[s.teamKey].probablePitcher;
                        const oppProb = gm.teams[s.oppKey].probablePitcher;
                        const base = {
                            teamAbbr: meT.abbreviation, teamId: meT.id,
                            oppAbbr: oppT.abbreviation, oppTeamId: oppT.id,
                            gamePk: String(gm.gamePk), isHome: s.isHome, gameTime
                        };

                        if (myProb && myProb.id) {
                            slots.push({ ...base, personId: String(myProb.id), role: 'pitcher', position: 'SP' });
                        }

                        const lineup = gm.lineups && gm.lineups[s.side + 'Players'];
                        if (Array.isArray(lineup) && lineup.length) {
                            lineup.forEach(pl => slots.push({
                                ...base, personId: String(pl.id), role: 'batter',
                                position: pl.primaryPosition && pl.primaryPosition.abbreviation,
                                oppPitcherId: oppProb && oppProb.id ? String(oppProb.id) : null,
                                oppPitcherName: oppProb && oppProb.fullName
                            }));
                        } else {
                            rosterNeeded.add(JSON.stringify({ tId: meT.id, ...base, oppPitcherId: oppProb && oppProb.id ? String(oppProb.id) : null, oppPitcherName: oppProb && oppProb.fullName }));
                        }
                    }
                }

                // Lineups not posted yet (future games) — fall back to the
                // team's active roster, position players only.
                for (const raw of rosterNeeded) {
                    const info = JSON.parse(raw);
                    let roster = cache.rosters[info.tId];
                    if (!roster) {
                        try {
                            const r = await mlbFetch(`/teams/${info.tId}/roster?rosterType=active`);
                            roster = r.roster || [];
                            cache.rosters[info.tId] = roster;
                        } catch (e) { roster = []; }
                    }
                    roster
                        .filter(p => p.position && HITTER_POS_TYPES.has(p.position.type))
                        .forEach(p => slots.push({
                            teamAbbr: info.teamAbbr, teamId: info.tId, oppAbbr: info.oppAbbr, oppTeamId: info.oppTeamId,
                            gamePk: info.gamePk, isHome: info.isHome, gameTime: info.gameTime,
                            personId: String(p.person.id), role: 'batter',
                            position: p.position.abbreviation,
                            oppPitcherId: info.oppPitcherId, oppPitcherName: info.oppPitcherName
                        }));
                }

                // Real league-wide team batting (for pitcher matchup context + rank).
                let teamBattingByTeamId = {};
                try {
                    const tstats = await mlbFetch(`/teams/stats?stats=season&group=hitting&season=${MLB_SEASON}&sportIds=1`);
                    const splits = (tstats.stats && tstats.stats[0] && tstats.stats[0].splits) || [];
                    const rows = splits.map(sp => {
                        const st = sp.stat || {};
                        const pa = st.plateAppearances || st.atBats || 1;
                        return {
                            teamId: sp.team && sp.team.id,
                            teamAvg: num(st.avg),
                            kRate: st.strikeOuts != null ? st.strikeOuts / pa : null,
                            runsPerGame: st.gamesPlayed ? round1(st.runs / st.gamesPlayed) : null
                        };
                    });
                    const ranked = [...rows].filter(r => r.kRate != null).sort((a, b) => a.kRate - b.kRate);
                    ranked.forEach((r, i) => { r.rank = i + 1; });
                    rows.forEach(r => { teamBattingByTeamId[r.teamId] = r; });
                } catch (e) { /* pitcher cards just omit rank/lineup context */ }

                // One batched season-stats fetch for everyone on the slate,
                // plus the opposing probable pitchers referenced by hitters.
                const ids = [];
                slots.forEach(s => { ids.push(s.personId); if (s.oppPitcherId) ids.push(s.oppPitcherId); });
                const people = await mlbSeasonStatsFor(ids);

                // De-dupe (a hitter can appear once per game only, but guard anyway).
                const seen = new Set();
                const players = [];
                for (const slot of slots) {
                    const key = slot.personId + ':' + slot.role;
                    if (seen.has(key)) continue;
                    seen.add(key);
                    const built = buildMlbPlayer(slot, people, teamBattingByTeamId);
                    if (!built) continue;
                    // Drop hitters with no real season signal (September call-ups,
                    // bench arms listed as position players, etc.).
                    if (built.role === 'batter' && (!people[slot.personId].hit || (people[slot.personId].hit.gamesPlayed || 0) < 15)) continue;
                    players.push(built);
                }

                // Pitchers first, then by game time, then name — a stable,
                // readable order until sorting/filters land (Phase 2).
                players.sort((a, b) =>
                    (a.role === b.role ? 0 : a.role === 'pitcher' ? -1 : 1) ||
                    String(a.gameTime).localeCompare(String(b.gameTime)) ||
                    a.name.localeCompare(b.name));
                return players;
            };

            // Layer real L5 / L10 recent-form averages (in each player's prop
            // unit) on top of the season-seeded numbers, in two batched calls.
            const warmMlbSlateForm = async (players) => {
                const wantGroups = {}; // id -> 'hitting' | 'pitching'
                players.forEach(p => { wantGroups[p.id] = p.role === 'pitcher' ? 'pitching' : 'hitting'; });
                const ids = Object.keys(wantGroups);

                const fetchWindow = async (limit) => {
                    const map = {};
                    for (const group of chunk(ids, 40)) {
                        try {
                            const data = await mlbFetch(`/people?personIds=${group.join(',')}&hydrate=stats(group=[hitting,pitching],type=[lastXGames],limit=${limit},season=${MLB_SEASON})`);
                            (data.people || []).forEach(p => {
                                (p.stats || []).forEach(s => {
                                    const stat = s.splits && s.splits[0] && s.splits[0].stat;
                                    if (stat && s.group) map[p.id + ':' + s.group.displayName] = stat;
                                });
                            });
                        } catch (e) { /* leave season-seeded */ }
                    }
                    return map;
                };

                const [l5, l10] = await Promise.all([fetchWindow(5), fetchWindow(10)]);

                // per-game rate for one statKey out of a lastXGames stat object
                const winAvg = (stat, isPitcher, statKey) => {
                    if (!stat) return null;
                    const g = mlbGamesField(stat, isPitcher);
                    return g > 0 ? round1(MLB_PROP_DEFS[statKey].get(stat) / g) : null;
                };

                setPlayersData(prev => prev.map(p => {
                    if (p.sport !== 'mlb' || !p.statsByKey) return p;
                    const grp = wantGroups[p.id];
                    const s5 = l5[p.id + ':' + grp];
                    const s10 = l10[p.id + ':' + grp];
                    if (!s5 && !s10) return p;
                    const isPitcher = !!p._isPitcher;
                    // Prefer the STANDARD-board line for each stat — an alt /
                    // goblin / demon line must not become the hit-rate baseline.
                    const lineFor = {};
                    [...p.props].sort((a, b) => (a.altLine || a.ppKind ? 1 : 0) - (b.altLine || b.ppKind ? 1 : 0))
                        .forEach(pr => { if (lineFor[pr.statKey] == null) lineFor[pr.statKey] = pr.line; });
                    const nextByKey = { ...p.statsByKey };
                    Object.keys(nextByKey).forEach(k => {
                        const line = lineFor[k] != null ? lineFor[k] : nextByKey[k].season.avg;
                        const a5 = winAvg(s5, isPitcher, k);
                        const a10 = winAvg(s10, isPitcher, k);
                        if (a5 == null && a10 == null) return;
                        const w = { ...nextByKey[k] };
                        if (a5 != null) w.last5 = { ...w.last5, avg: a5, hitRate: estHitRate(a5, line) };
                        if (a10 != null) {
                            w.last10 = { ...w.last10, avg: a10, hitRate: estHitRate(a10, line) };
                            w.recent = { ...w.recent, avg: a10 };
                        }
                        nextByKey[k] = w;
                    });
                    return { ...p, statsByKey: nextByKey, stats: nextByKey[p.props[0].statKey], statsSource: 'statsapi.mlb.com — season + L5/L10 (real)' };
                }));
            };

            // ============================================================
            // PropLine — real prop LINES (prop-line.com). Requires a key
            // (Data Sources settings). Replaces the season-anchored SAMPLE
            // line on each MLB player's single prop with a real book line.
            // PropLine's player_id is the statsapi id ("mlb:682829"), so the
            // join is exact — no name matching.
            //
            // api.prop-line.com sends NO Access-Control-Allow-Origin, so a
            // browser can't call it directly. It's routed through your
            // beatsedge-backend's /api/propline/* passthrough (which adds CORS).
            // So this needs BOTH a PropLine key AND "Your Backend" URL set.
            // ============================================================
            // Sharp sportsbooks first, then the DFS apps this app is themed
            // around. First book in this list that has a line for a player wins.
            const PROPLINE_BOOK_PRIORITY = ['draftkings', 'fanduel', 'betmgm', 'betrivers', 'caesars', 'pinnacle', 'prizepicks', 'underdog', 'sleeper', 'parlayplay', 'betr', 'pick6', 'bovada'];

            // ── ParlayAPI: fetch DFS props for one sport, shaped as
            //   { normName: { statKey: { book: [ {line,over,under,juice,setAt,ppType,_src} ] } } }
            // Returns null when disabled / unreachable. Gap-fill only — the
            // caller adds a book's array ONLY where it doesn't already have one.
            const fetchParlayProps = async (parlaySportKey, mktMap) => {
                if (!parlayApiKey || !backendUrl) return null;
                let rows;
                try {
                    const url = `${backendUrl}/api/parlayapi/v1/sports/${parlaySportKey}/props`
                        + `?apiKey=${encodeURIComponent(parlayApiKey)}&bookmakers=${PARLAY_DFS_BOOKS}&limit=1000`;
                    const r = await fetch(url);
                    if (!r.ok) throw new Error('ParlayAPI HTTP ' + r.status);
                    rows = await r.json();
                } catch (e) {
                    console.warn('ParlayAPI fetch failed:', e.message);
                    setParlaySource('error');
                    return null;
                }
                if (!Array.isArray(rows)) { setParlaySource('error'); return null; }
                const byNorm = {};
                let n = 0;
                rows.forEach(row => {
                    const sk = mktMap[row.market_key];
                    if (!sk) return;
                    const nn = nflNormName(row.player);
                    if (!nn || row.line == null) return;
                    const book = row.bookmaker;
                    if (!DFS_PLATFORMS.has(book)) return;
                    const ppType = /demon/i.test(row.odds_type || row.projection_type || '') ? 'demon'
                        : /goblin/i.test(row.odds_type || row.projection_type || '') ? 'goblin'
                            : (row.is_dfs_flat_payout ? 'standard' : null);
                    const t2 = byNorm[nn] || (byNorm[nn] = {});
                    const t3 = t2[sk] || (t2[sk] = {});
                    const arr = t3[book] || (t3[book] = []);
                    const kk = ppType ? `${row.line}|${ppType}` : `${row.line}`;
                    if (arr.some(e => e._kk === kk)) return;
                    const o = row.over_price, u = row.under_price;
                    arr.push({
                        _kk: kk, line: row.line, over: o ?? null, under: u ?? null,
                        juice: Math.min(Math.abs(o || 9999), Math.abs(u || 9999)),
                        setAt: row.last_update || null, ppType, primary: false, _src: 'parlayapi'
                    });
                    n++;
                });
                setParlaySource('live');
                return { byNorm, n };
            };
            // Merge ParlayAPI's byNorm into a PropLine target map, keyed by
            // whatever the caller uses (pid or normName). `keyFor(normName)`
            // returns the target key (or null to skip). Gap-fill: only sets a
            // [statKey][book] array when the target has none there.
            const mergeParlay = (target, parlay, keyFor) => {
                if (!parlay || !parlay.byNorm) return 0;
                let added = 0;
                Object.entries(parlay.byNorm).forEach(([nn, byStat]) => {
                    const key = keyFor(nn);
                    if (key == null) return;
                    const tByStat = target[key] || (target[key] = {});
                    Object.entries(byStat).forEach(([sk, byBook]) => {
                        const tByBook = tByStat[sk] || (tByStat[sk] = {});
                        Object.entries(byBook).forEach(([book, arr]) => {
                            if (tByBook[book] && tByBook[book].length) return; // PropLine wins
                            tByBook[book] = arr.map(e => ({ ...e, primary: e.ppType === 'standard' }));
                            added += arr.length;
                        });
                    });
                });
                return added;
            };

            const fetchMlbPropLines = async (players, isStale) => {
                // isStale() → the user switched sport/date mid-flight; skip every
                // pill/roster write so we don't stomp the new selection.
                const gone = () => typeof isStale === 'function' && isStale();
                if (gone()) return;
                if (!backendUrl) {
                    setPropLineSource('sample');
                    setProplineError('PropLine has no CORS — set "Your Backend" URL too so it can be proxied.');
                    return;
                }
                const plFetch = async (path) => {
                    // path like "/v1/sports/baseball_mlb/events" -> proxied
                    const [p, q] = path.replace(/^\//, '').split('?');
                    const url = `${backendUrl}/api/propline/${p}?apiKey=${encodeURIComponent(proplineKey)}${q ? '&' + q : ''}`;
                    const r = await fetch(url);
                    if (r.status === 401 || r.status === 403) throw new Error(`PropLine key rejected (HTTP ${r.status})`);
                    if (r.status === 429) throw new Error('PropLine rate limit hit — try again later');
                    if (!r.ok) throw new Error('PropLine HTTP ' + r.status);
                    return r.json();
                };

                // 1. PropLine events -> match to our slate games by MLB team-id pair
                //    (PropLine uses "mlb:145" = the same statsapi team id).
                const events = await plFetch('/v1/sports/baseball_mlb/events');
                // PropLine returns a ROLLING multi-day window (today + the next
                // ~2 weeks), so most matchups appear several times — today's
                // game plus the next days' rematches. Keying by team-pair with
                // no date filter collapses to whichever appears LAST (a future
                // game with no lines posted → "PropLine had none for this
                // slate"). Fix: keep only events that start inside THIS slate's
                // day, then pick the earliest remaining event per matchup.
                // Window: selectedDate 08:00Z → +28h (next day 12:00Z) covers a
                // full US day of first pitches incl. late West-coast starts and
                // excludes tomorrow's slate (earliest ~15:00Z / afternoon ET).
                const _slateStartMs = Date.parse(selectedDate + 'T08:00:00Z');
                const _slateEndMs = _slateStartMs + 28 * 3600 * 1000;
                const evByPair = {};
                (Array.isArray(events) ? events : []).forEach(ev => {
                    const ct = Date.parse(ev.commence_time || '');
                    if (!Number.isFinite(ct) || ct < _slateStartMs || ct > _slateEndMs) return;
                    const h = String(ev.home_team_id || '').replace('mlb:', '');
                    const a = String(ev.away_team_id || '').replace('mlb:', '');
                    if (!h || !a) return;
                    [h + '-' + a, a + '-' + h].forEach(key => {
                        const cur = evByPair[key];
                        if (!cur || ct < cur.ct) evByPair[key] = { id: ev.id, ct };
                    });
                });

                const wantEventIds = new Set();
                const seenGames = new Set();
                players.forEach(p => {
                    if (seenGames.has(p.gamePk)) return;
                    seenGames.add(p.gamePk);
                    // live lines only — skip games that have already finished
                    if (/final|completed|game over/i.test(p.gameTime || '')) return;
                    const ev = evByPair[String(p.teamId) + '-' + String(p.oppTeamId)];
                    if (ev) wantEventIds.add(ev.id);
                });
                if (gone()) return;
                if (!wantEventIds.size) { setPropLineSource('sample'); setProplineError('No upcoming/live games on this slate for PropLine.'); return; }

                // 2. One odds call per game — ALL supported markets, ALL books.
                //    Keep EVERY line each book offers (PrizePicks etc. post
                //    alternate lines) so the platform tabs can stay separate
                //    and PrizePicks shows all of its lines.
                const books = PROPLINE_BOOK_PRIORITY.join(',');
                const markets = Object.values(MLB_PROP_DEFS).map(d => d.market).filter(Boolean).join(',');
                // pid -> statKey -> bookKey -> [ {line, over, under, juice, setAt, primary, move} ]
                const allLinesByPid = {};
                await Promise.all([...wantEventIds].map(async eid => {
                    try {
                        const data = await plFetch(`/v1/sports/baseball_mlb/events/${eid}/odds?markets=${markets}&bookmakers=${books}`);
                        (data.bookmakers || []).forEach(bm => {
                            (bm.markets || []).forEach(m => {
                                const statKey = MLB_MARKET_TO_KEY[m.key];
                                if (!statKey) return;
                                if (m.suspended_at) return; // live lines only — skip suspended markets
                                (m.outcomes || []).forEach(o => {
                                    const pid = String(o.player_id || '').replace('mlb:', '');
                                    if (!pid || o.price == null) return;
                                    if (o.suspended_at) return;
                                    // PropLine tags every PrizePicks/Underdog line:
                                    // 'standard' (over+under both pickable), 'goblin'
                                    // (easier, over only), 'demon' (harder, over only).
                                    const ppType = o.dfs_odds_type || null;
                                    let line = null, side = null;
                                    if (/^over$/i.test(o.name || '') && o.point != null) { line = o.point; side = 'over'; }
                                    else if (/^under$/i.test(o.name || '') && o.point != null) { line = o.point; side = 'under'; }
                                    // "N+ Strikeouts" ladders: sportsbooks only. DFS
                                    // apps don't post these; treating them as lines
                                    // manufactures picks that aren't really offered.
                                    else if (!DFS_PLATFORMS.has(bm.key)) { const mm = /^(\d+)\s*\+/.exec(o.name || ''); if (mm) { line = parseInt(mm[1], 10) - 0.5; side = 'over'; } }
                                    if (line == null || side == null) return;
                                    const t2 = (allLinesByPid[pid] || (allLinesByPid[pid] = {}));
                                    const t3 = (t2[statKey] || (t2[statKey] = {}));
                                    const arr = (t3[bm.key] || (t3[bm.key] = []));
                                    // key by line + ppType so a standard and a demon
                                    // at the same number stay distinct.
                                    const kk = ppType ? `${line}|${ppType}` : `${line}`;
                                    let e = arr.find(x => x._kk === kk);
                                    if (!e) { e = { _kk: kk, line, over: null, under: null, juice: 9999, setAt: null, ppType }; arr.push(e); }
                                    e[side] = o.price;
                                    const jz = Math.abs(o.price || 0);
                                    if (jz < e.juice) e.juice = jz;
                                    e.setAt = m.last_update || o.last_change_at || e.setAt;
                                });
                            });
                        });
                    } catch (e) { /* this game keeps its sample props */ }
                }));

                // ---- ParlayAPI gap-fill (optional 2nd DFS source) -----------
                if (parlayApiKey) {
                    const slateNorm = {};
                    players.forEach(p => { if (p.sport === 'mlb') slateNorm[nflNormName(p.name)] = String(p.id); });
                    const pa = await fetchParlayProps('baseball_mlb', PARLAY_MLB_MKT);
                    const added = mergeParlay(allLinesByPid, pa, nn => slateNorm[nn] || null);
                    setParlayCount(added);
                } else { setParlaySource('off'); }

                // ---- Consolidate lines per (pid, statKey) --------------------
                // DFS books: PropLine tags every line standard/goblin/demon, so
                // keep them all as-is (that IS the PrizePicks board) — just mark
                // the standard one primary and drop a standard that's wildly off
                // the sharp market (bad data). Sportsbooks: their `N+` ladder has
                // no tag → keep the min-juice rung as primary.
                const medianOf = (nums) => {
                    if (!nums.length) return null;
                    const s = [...nums].sort((a, b) => a - b);
                    const m = Math.floor(s.length / 2);
                    return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
                };
                Object.values(allLinesByPid).forEach(byKey =>
                    Object.entries(byKey).forEach(([statKey, byBook]) => {
                        const sharpPrimaries = [];
                        Object.entries(byBook).forEach(([bk, arr]) => {
                            arr.sort((a, b) => a.line - b.line);
                            let best = arr[0];
                            arr.forEach(e => { if (e.juice < best.juice) best = e; });
                            arr.forEach(e => { e.primary = (e === best); });
                            if (!DFS_PLATFORMS.has(bk) && best) sharpPrimaries.push(best.line);
                        });
                        const marketLine = medianOf(sharpPrimaries);

                        Object.keys(byBook).forEach(bk => {
                            if (!DFS_PLATFORMS.has(bk)) return;
                            let arr = byBook[bk];
                            if (!arr || !arr.length) return;
                            // primary = the standard line (fallback: closest to sharp market, else first)
                            const std = arr.find(e => e.ppType === 'standard');
                            const anchor = marketLine != null ? marketLine : medianOf(arr.map(e => e.line));
                            const primary = std || arr.slice().sort((a, b) => Math.abs(a.line - anchor) - Math.abs(b.line - anchor))[0];
                            // bad data guard: a STANDARD line >2.5 (or >60%) off the sharp market
                            if (std && marketLine != null && Math.abs(std.line - marketLine) > Math.max(2.5, marketLine * 0.6)) {
                                byBook[bk] = []; return;
                            }
                            arr.forEach(e => { e.primary = (e === primary); });
                            byBook[bk] = arr.slice().sort((a, b) => a.line - b.line);
                        });
                    }));

                // ---- Line movement (client-side): diff each book's PRIMARY
                // line against the snapshot from your last visit. PropLine's own
                // history is a paid tier, so this answers "did it move since I
                // last looked?" for free.
                const SNAP_KEY = 'beatsedge_lines_v3'; // v3: after line-consolidation fix
                let snap = {};
                try { snap = JSON.parse(localStorage.getItem(SNAP_KEY) || '{}'); } catch (e) { snap = {}; }
                const now = Date.now();
                const nextSnap = {};
                Object.entries(allLinesByPid).forEach(([pid, byKey]) =>
                    Object.entries(byKey).forEach(([k, byBook]) =>
                        Object.entries(byBook).forEach(([b, arr]) => {
                            const primary = arr.find(e => e.primary) || arr[0];
                            if (!primary) return;
                            const id = `${pid}:${k}:${b}`;
                            nextSnap[id] = { line: primary.line, o: primary.over, ts: now };
                            const prev = snap[id];
                            if (prev && typeof prev.line === 'number' && prev.line !== primary.line) {
                                primary.move = { from: prev.line, to: primary.line, delta: Math.round((primary.line - prev.line) * 10) / 10, sinceTs: prev.ts };
                            } else if (prev && prev.o !== primary.over && prev.line === primary.line) {
                                primary.move = { from: prev.line, to: primary.line, delta: 0, priceOnly: true, sinceTs: prev.ts };
                            }
                        })));
                try { localStorage.setItem(SNAP_KEY, JSON.stringify(nextSnap)); } catch (e) { /* full/blocked — fine */ }

                if (gone()) return;
                const wantBook = PLATFORM_BOOK[selectedPlatform] || 'prizepicks';
                let matched = 0, bookMatched = 0;
                setPlayersData(prev => prev.map(p => {
                    if (p.sport !== 'mlb' || !p.statsByKey) return p;
                    const all = allLinesByPid[String(p.id)];
                    if (!all || !Object.keys(all).length) return { ...p, _allLines: {}, _noLiveLines: true };
                    matched++;
                    const nextByKey = { ...p.statsByKey };
                    let props = mlbBuildProps(p._seasonStat || {}, !!p._isPitcher, nextByKey, all, wantBook);
                    props = sortPropsByEdge({ ...p, statsByKey: nextByKey }, props);
                    const hasRealForBook = props.some(pr => pr.lineSource);
                    if (hasRealForBook) bookMatched++;
                    return {
                        ...p, props, statsByKey: nextByKey,
                        stats: props.length ? nextByKey[props[0].statKey] : p.stats,
                        realPropLine: true, _allLines: all, _detailLoaded: false,
                        _noLiveLines: !hasRealForBook
                    };
                }));
                if (!gone()) markFresh();
                setPropLineSource(matched > 0 ? 'live' : 'sample');
                const bookName = (platforms.find(x => x.id === selectedPlatform) || {}).name || selectedPlatform;
                setProplineError(matched === 0
                    ? 'PropLine reached, but no lines matched tonight\'s slate (games may already be final).'
                    : (bookMatched === 0 ? `PropLine is live, but ${bookName} hasn't posted MLB lines for this slate yet — try another book tab.` : null));
            };

            // On card-expand: pull the real per-game series ONCE and compute
            // real hit rates / averages / game-log for EVERY prop this player
            // has, so every column is real no matter which prop is selected.
            const fetchMlbPlayerDetail = async (player) => {
                const isPitcher = !!player._isPitcher || player.role === 'pitcher';
                const group = isPitcher ? 'pitching' : 'hitting';
                const pit = player.oppPitcherId;
                // Game log + (batters only) situational splits, batter-vs-this-
                // pitcher career, and the opposing starter's throwing hand —
                // all keyless, all in one round trip.
                const [glData, splitData, bvpData, pitchData] = await Promise.all([
                    mlbFetch(`/people/${player.id}/stats?stats=gameLog&group=${group}&season=${MLB_SEASON}`).catch(() => null),
                    (!isPitcher) ? mlbFetch(`/people/${player.id}/stats?stats=statSplits&group=hitting&season=${MLB_SEASON}&sitCodes=vl,vr,h,a&sportId=1`).catch(() => null) : Promise.resolve(null),
                    (!isPitcher && pit) ? mlbFetch(`/people/${player.id}/stats?stats=vsPlayerTotal&group=hitting&opposingPlayerId=${pit}&sportId=1`).catch(() => null) : Promise.resolve(null),
                    (!isPitcher && pit) ? mlbFetch(`/people/${pit}?fields=people,id,pitchHand,code`).catch(() => null) : Promise.resolve(null)
                ]);
                const splits = (glData && glData.stats && glData.stats[0] && glData.stats[0].splits) || [];
                if (!splits.length) {
                    setPlayersData(prev => prev.map(p => p.id === player.id && p.role === player.role ? { ...p, _detailLoaded: true } : p));
                    return;
                }
                // ---- shape the split extras ----
                const splitBy = {};
                ((splitData && splitData.stats && splitData.stats[0] && splitData.stats[0].splits) || [])
                    .forEach(sp => { const c = sp.split && sp.split.code; if (c) splitBy[c] = sp.stat || null; });
                const bvp = (bvpData && bvpData.stats && bvpData.stats[0] && bvpData.stats[0].splits && bvpData.stats[0].splits[0] && bvpData.stats[0].splits[0].stat) || null;
                const oppHand = (pitchData && pitchData.people && pitchData.people[0] && pitchData.people[0].pitchHand && pitchData.people[0].pitchHand.code) || null;

                const abbrById = mlbCache.current.abbrById;
                const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
                const games = splits.map(sp => {
                    const iso = sp.date || '';
                    const parts = iso.split('-'); // YYYY-MM-DD
                    const disp = parts.length === 3 ? `${MON[+parts[1] - 1] || parts[1]} ${+parts[2]}, ${parts[0]}` : iso;
                    const oppAbbr = (sp.opponent && (abbrById[sp.opponent.id] || sp.opponent.name)) || '';
                    return {
                        date: disp,                       // "Sep 6, 2026"
                        dateShort: parts.length === 3 ? `${+parts[1]}/${+parts[2]}/${parts[0].slice(2)}` : iso, // "9/6/26"
                        opponent: oppAbbr,
                        vsLabel: (sp.isHome === false ? '@ ' : 'vs ') + oppAbbr,
                        stat: sp.stat || {}
                    };
                });
                const mean = (arr) => arr.length ? round1(arr.reduce((s, v) => s + v, 0) / arr.length) : null;

                setPlayersData(prev => prev.map(p => {
                    if (p.id !== player.id || p.role !== player.role || !p.statsByKey) return p;
                    // Prefer the STANDARD-board line per stat (see warmMlbSlateForm).
                    const lineFor = {};
                    [...p.props].sort((a, b) => (a.altLine || a.ppKind ? 1 : 0) - (b.altLine || b.ppKind ? 1 : 0))
                        .forEach(pr => { if (lineFor[pr.statKey] == null) lineFor[pr.statKey] = pr.line; });
                    const nextByKey = { ...p.statsByKey };
                    const nextLogByKey = { ...p.gameLogByKey };

                    Object.keys(nextByKey).forEach(k => {
                        const getV = MLB_PROP_DEFS[k].get;
                        const vals = games.map(g => getV(g.stat) || 0);
                        const line = lineFor[k] != null ? lineFor[k] : nextByKey[k].season.avg;
                        const hitRateOf = (a) => a.length ? Math.round((a.filter(v => v > line).length / a.length) * 100) : null;
                        const lastN = (n) => vals.slice(-n);
                        const sorted = [...vals].sort((a, b) => a - b);
                        const oppVals = games.filter(g => g.opponent === p.opponent).map(g => getV(g.stat) || 0);
                        nextByKey[k] = {
                            last5: { avg: mean(lastN(5)), hitRate: hitRateOf(lastN(5)), games: Math.min(5, vals.length) },
                            last10: { avg: mean(lastN(10)), hitRate: hitRateOf(lastN(10)), games: Math.min(10, vals.length) },
                            last20: { avg: mean(lastN(20)), hitRate: hitRateOf(lastN(20)), games: Math.min(20, vals.length) },
                            season: { avg: mean(vals), hitRate: hitRateOf(vals), games: vals.length },
                            vsOpp: oppVals.length ? { avg: mean(oppVals), hitRate: hitRateOf(oppVals), games: oppVals.length } : nextByKey[k].vsOpp,
                            recent: { avg: mean(lastN(10)), hitRate: hitRateOf(lastN(10)), median: sorted[Math.floor(sorted.length / 2)] || 0, range: [sorted[0] || 0, sorted[sorted.length - 1] || 0], games: vals.length }
                        };
                        // full recent series (up to 40) so the chart can widen
                        // to L20 / season when the window selector changes
                        nextLogByKey[k] = games.slice(-40).map(g => ({ date: g.date, dateShort: g.dateShort, opponent: g.opponent, vsLabel: g.vsLabel, points: getV(g.stat) || 0, line }));
                    });

                    return {
                        ...p, statsByKey: nextByKey, gameLogByKey: nextLogByKey,
                        stats: nextByKey[p.props[0].statKey], gameLog: nextLogByKey[p.props[0].statKey] || [],
                        splitBy, bvp, oppPitcherHand: oppHand,
                        _detailLoaded: true, statsSource: 'statsapi.mlb.com — full game log + splits (real)'
                    };
                }));
            };

            // ---- NFL: ESPN keyless slate + game logs, PropLine real lines ----
            const nflFetch = (url) => fetchJSONWithFallback(url);
            const NFL_SEASON = MLB_SEASON; // year the current NFL season starts in

            // ESPN's gamelog endpoint defaults to the in-progress season, which
            // is empty in Week 1. Pull the current and prior season in parallel
            // and prefer the current one once it actually has games.
            const nflEventCount = (gl) => (gl && Array.isArray(gl.seasonTypes))
                ? gl.seasonTypes.reduce((n, st) => n + (st.categories || []).reduce((m, c) => m + (c.events || []).length, 0), 0)
                : 0;
            const nflFetchGamelog = async (id) => {
                const [cur, prev] = await Promise.all([
                    nflFetch(`${NFL_ESPN_COMMON}/athletes/${id}/gamelog?season=${NFL_SEASON}`).catch(() => null),
                    nflFetch(`${NFL_ESPN_COMMON}/athletes/${id}/gamelog?season=${NFL_SEASON - 1}`).catch(() => null)
                ]);
                if (nflEventCount(cur) >= 3) return cur;
                if (nflEventCount(prev) > 0) return prev;
                return nflEventCount(cur) > 0 ? cur : null;
            };

            // ESPN gamelog -> array of { date, dateShort, opponent, vsLabel, row }
            // where `row` is names[] zipped onto the per-game stats[].
            const nflParseGamelog = (gl) => {
                const names = gl.names || (gl.labels || []).map(x => x);
                const evMeta = gl.events || {};
                const out = [];
                (gl.seasonTypes || []).forEach(st => {
                    (st.categories || []).forEach(cat => {
                        (cat.events || []).forEach(ev => {
                            const meta = evMeta[ev.eventId] || {};
                            const row = {};
                            (ev.stats || []).forEach((v, i) => {
                                const num = parseFloat(v);
                                if (names[i]) row[names[i]] = Number.isFinite(num) ? num : 0;
                            });
                            const iso = (meta.gameDate || meta.date || '').slice(0, 10);
                            const parts = iso.split('-');
                            const opp = (meta.opponent && (meta.opponent.abbreviation || meta.opponent.displayName)) || '';
                            const away = meta.atVs === '@' || meta.homeAway === 'away';
                            out.push({
                                ts: Date.parse(meta.gameDate || meta.date || 0) || 0,
                                date: parts.length === 3 ? `${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+parts[1]-1]} ${+parts[2]}, ${parts[0]}` : (iso || `Wk ${meta.week || '?'}`),
                                dateShort: parts.length === 3 ? `${+parts[1]}/${+parts[2]}/${parts[0].slice(2)}` : (meta.week ? `Wk${meta.week}` : ''),
                                opponent: opp,
                                vsLabel: (away ? '@ ' : 'vs ') + opp,
                                row
                            });
                        });
                    });
                });
                return out.sort((a, b) => a.ts - b.ts);
            };

            const nflGamelogs = async (ids) => {
                const map = {};
                for (const grp of chunk([...new Set(ids)], 24)) {
                    await Promise.all(grp.map(async id => {
                        try {
                            const gl = await nflFetchGamelog(id);
                            map[id] = gl ? nflParseGamelog(gl) : [];
                        } catch (e) { map[id] = []; }
                    }));
                }
                return map;
            };

            // Multi-season game logs (for the backtest — one NFL season is only
            // ~17 games, too thin). Concatenates oldest → newest.
            const nflGamelogsMulti = async (ids, years) => {
                const map = {};
                for (const grp of chunk([...new Set(ids)], 20)) {
                    await Promise.all(grp.map(async id => {
                        const rows = [];
                        for (const yr of years) {
                            try {
                                const gl = await nflFetch(`${NFL_ESPN_COMMON}/athletes/${id}/gamelog?season=${yr}`);
                                if (gl && nflEventCount(gl) > 0) rows.push(...nflParseGamelog(gl));
                            } catch (e) { /* skip year */ }
                        }
                        rows.sort((a, b) => (a.ts || 0) - (b.ts || 0));
                        map[id] = rows;
                    }));
                }
                return map;
            };

            // DFS books: PropLine tags every line standard/goblin/demon, so keep
            // them all (that IS the PrizePicks board); mark the standard one
            // primary and drop a standard that's wildly off the sharp market.
            // Sportsbooks: keep the min-juice rung of their N+ ladder as primary.
            const nflConsolidate = (linesByName) => {
                const median = (a) => { if (!a.length) return null; const s = [...a].sort((x, y) => x - y); const m = s.length >> 1; return s.length % 2 ? s[m] : (s[m-1]+s[m]) / 2; };
                Object.values(linesByName).forEach(byKey => Object.entries(byKey).forEach(([statKey, byBook]) => {
                    const sharp = [];
                    Object.entries(byBook).forEach(([bk, arr]) => {
                        arr.sort((a, b) => a.line - b.line);
                        let best = arr[0];
                        arr.forEach(e => { if (e.juice < best.juice) best = e; });
                        arr.forEach(e => { e.primary = (e === best); });
                        if (!DFS_PLATFORMS.has(bk) && best) sharp.push(best.line);
                    });
                    const marketLine = median(sharp);
                    Object.keys(byBook).forEach(bk => {
                        if (!DFS_PLATFORMS.has(bk)) return;
                        const arr = byBook[bk];
                        if (!arr || !arr.length) return;
                        const std = arr.find(e => e.ppType === 'standard');
                        const anchor = marketLine != null ? marketLine : median(arr.map(e => e.line));
                        const primary = std || arr.slice().sort((a, b) => Math.abs(a.line - anchor) - Math.abs(b.line - anchor))[0];
                        if (std && marketLine != null && Math.abs(std.line - marketLine) > Math.max(3, Math.abs(marketLine) * 0.6)) { byBook[bk] = []; return; }
