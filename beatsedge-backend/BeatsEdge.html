                                    </div>
                                ) : (
                                    <>
                                        <div style={{ marginBottom: '1rem', fontSize: '0.9rem', color: 'var(--text-secondary)' }}>
                                            Only props with 80%+ hit rate can be added for optimal performance
                                        </div>
                                        {selectedProps.map(prop => (
                                            <div key={prop.id} className="parlay-item">
                                                <div className="parlay-item-info">
                                                    <div className="parlay-item-player">
                                                        {prop.player} ({prop.team})
                                                    </div>
                                                    <div className="parlay-item-prop">
                                                        {prop.prop} {prop.direction === 'under' ? 'U' : 'O'}{prop.line} • Hit Rate: {Math.round(prop.hitRate)}%
                                                    </div>
                                                </div>
                                                <div className="parlay-item-odds">
                                                    {prop.odds > 0 ? '+' : ''}{prop.odds}
                                                </div>
                                                <button 
                                                    className="remove-btn"
                                                    onClick={() => setSelectedProps(selectedProps.filter(p => p.id !== prop.id))}
                                                >
                                                    Remove
                                                </button>
                                            </div>
                                        ))}
                                        <div className="parlay-summary">
                                            <div className="parlay-summary-row">
                                                <span>Legs:</span>
                                                <span>{selectedProps.length}</span>
                                            </div>
                                            <div className="parlay-summary-row">
                                                <span>Combined Hit Rate:</span>
                                                <span>{combinedHitRate.toFixed(1)}%</span>
                                            </div>
                                            <div className="parlay-summary-row">
                                                <span>Parlay Odds:</span>
                                                <span>{parlayOdds > 0 ? '+' : ''}{parlayOdds}</span>
                                            </div>
                                            <div className="parlay-summary-row">
                                                <span>Potential Payout ($100):</span>
                                                <span>${parlayOdds > 0 ? 100 + parlayOdds : (100 + (10000 / Math.abs(parlayOdds))).toFixed(2)}</span>
                                            </div>
                                        </div>
                                    </>
                                )}
                            </div>
                        </div>
                    </div>
                );
            };

            const basePlayers = Array.isArray(playersData) ? playersData : [];
            const norm = React.useCallback((s) => (s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''), []);

            // EXPENSIVE part (runs calculateEdgeScore for every prop) — memoized
            // so it only recomputes when the data / category / calibration
            // changes, NOT on every search keystroke or sort toggle.
            const gradedPlayers = React.useMemo(() => {
                return basePlayers
                    .filter(p => !((p.sport === 'mlb' || p.sport === 'nfl' || p.sport === 'ncaaf' || p.sport === 'nba') && p._allLines && p._noLiveLines))
                    .filter(p => statFilter === 'all' || (Array.isArray(p.props) && p.props.some(pr => pr.type === statFilter)))
                    .map(p => ({
                        p, g: playerBestGrade(p, statFilter),
                        _n: norm(p.name), _t: norm(p.team), _o: norm(p.opponent), _pos: norm(p.position)
                    }));
            }, [basePlayers, statFilter, gradeVersion, norm]);

            // CHEAP part — filter by the debounced query + sort by precomputed grade.
            // The grid order is FROZEN while the detail modal is open: opening a
            // card triggers a data pull (game log, opponent DvP, …) that bumps
            // that player's grade, which would otherwise re-sort the grid and
            // slide a different player's card under the (semi-transparent)
            // modal — the modal lives inside its card's DOM, so a re-sort makes
            // it look like "the background jumped to another player".
            const orderRef = React.useRef([]);
            const filteredPlayers = React.useMemo(() => {
                const q = norm(playerSearchDebounced.trim());
                const rows = q
                    ? gradedPlayers.filter(x => x._n.includes(q) || x._t.includes(q) || x._o.includes(q) || x._pos === q)
                    : gradedPlayers.slice();
                const cmp = {
                    grade: (a, b) => (GRADE_RANK[a.g.grade] - GRADE_RANK[b.g.grade])
                        || (b.g.gradeScore - a.g.gradeScore)
                        || (Math.abs(b.g.edge) - Math.abs(a.g.edge)),
                    edge: (a, b) => (b.g.edge - a.g.edge),
                    time: (a, b) => String(a.p.gameTime || '').localeCompare(String(b.p.gameTime || '')),
                    name: (a, b) => String(a.p.name).localeCompare(String(b.p.name))
                }[sortBy] || (() => 0);
                let sortedRows;
                if (detailModal && orderRef.current.length) {
                    const pos = new Map(orderRef.current.map((id, i) => [id, i]));
                    sortedRows = rows.slice().sort((a, b) => {
                        const ai = pos.has(a.p.id) ? pos.get(a.p.id) : Infinity;
                        const bi = pos.has(b.p.id) ? pos.get(b.p.id) : Infinity;
                        return ai - bi || cmp(a, b);
                    });
                } else {
                    sortedRows = rows.sort(cmp);
                }
                const out = sortedRows.map(x => x.p);
                if (!detailModal) orderRef.current = out.map(p => p.id);
                return out;
            }, [gradedPlayers, sortBy, playerSearchDebounced, norm, detailModal]);

            // Free plan: Browse only renders today's research picks (the 2 best
            // overs + 2 best unders), each with its FULL research modal intact.
            // Every other player + the advanced filters are Pro.
            const researchPickIds = React.useMemo(() => {
                if (!Array.isArray(playersData) || !playersData.length) return new Set();
                const r = findResearchPicks(playersData);
                return new Set([...r.overs, ...r.unders].map(x => x.player.id));
            }, [playersData, gradeVersion]);
            const browsePlayers = isPro ? filteredPlayers : filteredPlayers.filter(p => researchPickIds.has(p.id));
            const lockedCount = isPro ? 0 : Math.max(0, filteredPlayers.length - browsePlayers.length);

            // Stat categories actually present on the current slate, ordered
            // PrizePicks-style. Feeds the Browse filter chip bar.
            const statCats = React.useMemo(() => {
                const seen = new Set();
                basePlayers.forEach(p => {
                    if ((p.sport === 'mlb' || p.sport === 'nfl' || p.sport === 'ncaaf' || p.sport === 'nba') && p._allLines && p._noLiveLines) return;
                    (Array.isArray(p.props) ? p.props : []).forEach(pr => { if (pr.type) seen.add(pr.type); });
                });
                const order = (selectedSport === 'nfl' || selectedSport === 'ncaaf') ? NFL_STAT_CAT_ORDER : (selectedSport === 'nba' ? NBA_STAT_CAT_ORDER : STAT_CAT_ORDER);
                const ordered = order.filter(t => seen.has(t));
                const extra = [...seen].filter(t => !order.includes(t)).sort();
                return [...ordered, ...extra];
            }, [basePlayers, selectedSport]);

            return (
                <div className="app-container">

                                    onClick={() => setCurrentView('news')}

                                </button>

                                title="Data source settings"

                                ⚙️ Data Sources
                            </button>
                            <button 
                                className="parlay-builder-btn"
                                onClick={() => setShowParlayBuilder(true)}
                            >
                                🎯 Smart Parlay
                                {selectedProps.length > 0 && (
                                    <span className="parlay-count">{selectedProps.length}</span>
                                )}
                            </button>
                        </div>
                    </header>

                    {currentView === 'browse' && (
                    <div className="platform-tabs">
                        <div className="platform-tabs-inner">
                            {platforms.filter(p => !p.srcKey || parlayApiKey).map(platform => (

                    <main className="main-content">
                        {currentView === 'browse' && (

                                    {mlbSlateSource === 'live' ? '🟢 LIVE' : (mlbSlateSource === 'sample' ? '🟡 SAMPLE' : '⏳ CHECKING')} — MLB Slate (statsapi.mlb.com, real players &amp; stats)
                                </span>

                            {selectedSport === 'nfl' && (
                                <span className={`source-pill ${nflSlateSource}`}>
                                    {nflSlateSource === 'live' ? '🟢 LIVE' : (nflSlateSource === 'sample' ? '🟡 SAMPLE' : '⏳ CHECKING')} — NFL Slate (ESPN players/stats + PropLine lines)
                                </span>

                            {selectedSport === 'ncaaf' && (
                                <span className={`source-pill ${cfbSlateSource}`}>
                                    {cfbSlateSource === 'live' ? '🟢 LIVE' : (cfbSlateSource === 'sample' ? '🟡 SAMPLE' : '⏳ CHECKING')} — CFB Slate (ESPN players/stats + PropLine lines)
                                </span>

                            {selectedSport === 'nba' && (

                                </span>

                            <span className={`source-pill ${injuryDataSource}`}>
                                {injuryDataSource === 'live' ? '🟢 LIVE' : (injuryDataSource === 'sample' ? '🟡 SAMPLE' : '⏳ CHECKING')} — ESPN Injuries
                            </span>
                            <span className={`source-pill ${scoreboardSource}`}>

                            {parlayApiKey && (selectedSport === 'mlb' || selectedSport === 'nfl' || selectedSport === 'ncaaf' || selectedSport === 'nba') && (

                        {Array.isArray(injuryNews) && injuryNews.length > 0 && (
                            <div className="news-banner">
                                <div className="news-icon">⚠️</div>
                                <div className="news-content">
                                    <div className="news-title">
                                        Injury wire {injuryDataSource === 'live' ? '· live' : '· sample'}
                                        <span style={{ fontWeight: 400, color: 'var(--text-secondary)' }}> — newest first · </span>
                                        <span
                                            style={{ fontWeight: 700, color: 'var(--info-blue)', cursor: 'pointer' }}
                                            onClick={() => setCurrentView('injuries')}
                                        >open the Injuries page →</span>
                                    </div>
                                    <div className="news-text">
                                        {injuryNews.slice(0, 12).map((news, i) => (
                                            <span key={i} style={{ marginRight: '0.9rem', whiteSpace: 'nowrap' }}>
                                                <strong style={{ color: 'var(--text-primary)' }}>{news.player}</strong>
                                                {news.team ? ` ${news.team}` : ''} · {news.status}
                                                {news.ageLabel ? <span style={{ color: 'var(--text-muted)' }}> · {news.ageLabel}</span> : ''}
                                            </span>
                                        ))}
                                    </div>
                                </div>

                        <div className="content-header">
                            <div className="page-title">

                                    </span>

                            </div>
                            <div className="filters">
                                {isPro && (
                                    <div className="player-search">
                                        <span className="player-search-icon">⌕</span>
                                        <input

                                        {playerSearch && (

                                        )}
                                    </div>
                                )}
                                <input
                                    type="date"
                                    className="date-input"
                                    value={selectedDate}
                                    onChange={(e) => setSelectedDate(e.target.value)}
                                />
                                {isPro ? (
                                    <select
                                        className="filter-select"
                                        value={sortBy}
                                        onChange={(e) => setSortBy(e.target.value)}
                                        title="Sort players"
                                    >
                                        <option value="grade">Sort: Grade (A→D)</option>
                                        <option value="edge">Sort: Model edge</option>
                                        <option value="time">Sort: Game time</option>
                                        <option value="name">Sort: Name (A→Z)</option>

                                )}
                            </div>
                        </div>

                        {isPro && statCats.length > 0 && (

                                <button

                                    onClick={() => setStatFilter('all')}
                                >All</button>
                                {statCats.map(cat => (
                                    <button
                                        key={cat}
                                        className={`stat-cat-chip ${statFilter === cat ? 'active' : ''}`}
                                        onClick={() => setStatFilter(cat)}
                                    >{cat}</button>
                                ))}
                            </div>
                        )}

                        {loading ? (
                            <div className="loading">
                                <div className="spinner"></div>
                                <div>Loading real-time data...</div>
                            </div>
                        ) : (
                            <React.Fragment>
                                {!isPro && (
                                    <div className="pro-gate-banner">
                                        <div>
                                            <strong>Free plan — today's research picks.</strong> You're seeing the {browsePlayers.length} best plays with full research. {lockedCount > 0 ? `${lockedCount} more player${lockedCount === 1 ? '' : 's'} on this slate` : 'Every other player, every prop'}, plus search, sort, filters, alerts and historical model performance are Pro.
                                        </div>
                                        <button className="pro-lock-btn" onClick={onUnlock}>Unlock full BeatsEdge research</button>
                                    </div>
                                )}
                                <div className="grid-count">
                                    {isPro
                                        ? <>{filteredPlayers.length} {filteredPlayers.length === 1 ? 'player' : 'players'}{statFilter !== 'all' ? ` · ${statFilter}` : ''}{playerSearch ? ` matching “${playerSearch}”` : ''}</>
                                        : <>Showing {browsePlayers.length} free research pick{browsePlayers.length === 1 ? '' : 's'}</>}
                                </div>
                                {browsePlayers.length === 0 ? (
                                    <div className="loading" style={{ padding: '2.5rem' }}>
                                        {!isPro
                                            ? 'No research picks for this sport yet — check back when the slate loads.'
                                            : (platforms.find(p => p.id === selectedPlatform) || {}).srcKey
                                                ? <>{(platforms.find(p => p.id === selectedPlatform) || {}).name} hasn't posted {SPORT_LABELS[selectedSport]} lines for this slate (via ParlayAPI). Coverage varies by book, sport and day — try {' '}
                                                    <span style={{ color: 'var(--accent-red)', cursor: 'pointer' }} onClick={() => setSelectedPlatform('prizepicks')}>PrizePicks</span>.</>
                                                : <>No players{statFilter !== 'all' ? ` with a ${statFilter} prop` : ''}{playerSearch ? ` matching “${playerSearch}”` : ''}.{' '}
                                                    {statFilter !== 'all' && <span style={{ color: 'var(--accent-red)', cursor: 'pointer' }} onClick={() => setStatFilter('all')}>Show all categories</span>}
                                                    {playerSearch && <span style={{ color: 'var(--accent-red)', cursor: 'pointer' }} onClick={() => setPlayerSearch('')}> · Clear search</span>}</>}
                                    </div>
                                ) : (
                                    <div className="players-grid">
                                        {browsePlayers.map(player => (
                                            <PlayerCard key={player.id} player={player} />
                                        ))}
                                    </div>
                                )}
                                {!isPro && lockedCount > 0 && (
                                    <div className="pro-lock-strip" onClick={onUnlock}>
                                        <span className="pro-lock-strip-blur">
                                            {filteredPlayers.filter(p => !researchPickIds.has(p.id)).slice(0, 6).map(p => (

                                            ))}

                                        <span className="pro-lock-strip-cta">🔒 {lockedCount} more researched player{lockedCount === 1 ? '' : 's'} — Unlock full Browse →</span>
                                    </div>
                                )}

                        {currentView === 'picks' && (
                            <ErrorBoundary name="TopPicks" resetKey={selectedSport}>
                            <TopPicksView
                                playersData={playersData}
                                loading={loading}
                                selectedSport={selectedSport}
                                backtest={backtest}
                                backtestRunning={backtestRunning}
                                onRunBacktest={runBacktest}
                                isPro={isPro}
                                onUnlock={onUnlock}
                                dataUpdatedAt={dataUpdatedAt}
                                onSwitchSport={(sport, view) => { setSelectedSport(sport); setCurrentView(view); }}
                                onOpenPick={(pl, propIdx) => { setCurrentView('browse'); setStatFilter('all'); setPlayerSearch(isPro ? pl.name : ''); openDetail(pl.id, propIdx); }}
                            />
                            </ErrorBoundary>
                        )}

                        {currentView === 'news' && (
                            <ErrorBoundary name="News" resetKey={selectedSport}>
                            <NewsView
                                lineups={lineups}
                                lineupSource={lineupSource}
                                slateNews={slateNews}
                                slateNewsSource={slateNewsSource}
                                selectedSport={selectedSport}
                                playersData={playersData}
                                onOpenPlayer={(pl) => { setCurrentView('browse'); setPlayerSearch(pl.name); openDetail(pl.id, 0); }}
                            />
                            </ErrorBoundary>
                        )}

                        {currentView === 'injuries' && (
                            <ErrorBoundary name="Injuries" resetKey={selectedSport}>
                            <InjuriesView
                                injuryNews={injuryNews}
                                playersData={playersData}
                                selectedSport={selectedSport}
                                injuryDataSource={injuryDataSource}
                                onOpenPlayer={(pl) => { setCurrentView('browse'); setPlayerSearch(pl.name); openDetail(pl.id, 0); }}
                            />
                            </ErrorBoundary>
                        )}
                    </main>

                    <ParlayBuilderModal />
                    <SettingsModal />
                    <UpgradeModal />
                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
